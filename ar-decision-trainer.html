<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AR整理决策教练 - Decision Trainer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            overflow: hidden;
            background: #000;
            touch-action: none;
        }

        #container {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }

        /* 视频和画布层 */
        #video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scaleX(-1);
            z-index: 1;
        }

        #frozenCanvas, #edgeCanvas, #debugCanvas, #uiCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }

        #frozenCanvas { z-index: 2; display: none; }
        #edgeCanvas { z-index: 3; opacity: 0.6; }
        #debugCanvas { z-index: 4; }
        #uiCanvas { z-index: 5; }

        /* UI叠加层 */
        .ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
        }

        /* 顶部状态栏 */
        .status-bar {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(10px);
            padding: 15px 30px;
            border-radius: 30px;
            color: white;
            font-size: 16px;
            pointer-events: all;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            min-width: 300px;
            text-align: center;
        }

        .phase-indicator {
            font-size: 14px;
            color: #4ecdc4;
            margin-bottom: 5px;
        }

        /* 中央大屏提示 */
        .center-message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(20px);
            color: white;
            padding: 50px 60px;
            border-radius: 25px;
            font-size: 28px;
            text-align: center;
            max-width: 80%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7);
            opacity: 0;
            transition: opacity 0.3s, transform 0.3s;
            pointer-events: none;
        }

        .center-message.show {
            opacity: 1;
            transform: translate(-50%, -50%) scale(1);
        }

        .center-message-icon {
            font-size: 60px;
            margin-bottom: 20px;
            display: block;
            animation: pulse 2s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        /* 训练进度 */
        .training-hud {
            position: absolute;
            top: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            padding: 20px 30px;
            border-radius: 20px;
            color: white;
            display: none;
            min-width: 400px;
        }

        .training-hud.active {
            display: block;
        }

        .hud-row {
            display: flex;
            justify-content: space-between;
            margin: 10px 0;
            font-size: 16px;
        }

        .hud-label {
            color: #888;
        }

        .hud-value {
            color: #4ecdc4;
            font-weight: bold;
        }

        .timer {
            font-size: 36px;
            text-align: center;
            margin: 15px 0;
            color: #fff;
        }

        .timer.warning {
            color: #ff6b6b;
            animation: blink 0.5s ease-in-out infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
            overflow: hidden;
            margin: 10px 0;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #4ecdc4, #44d9e6);
            transition: width 0.3s;
        }

        /* 压力值显示 */
        .pressure-meter {
            margin-top: 15px;
        }

        .pressure-bar {
            width: 100%;
            height: 10px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 5px;
            overflow: hidden;
        }

        .pressure-fill {
            height: 100%;
            background: linear-gradient(90deg, #00ff00, #ffff00, #ff0000);
            transition: width 0.3s;
        }

        /* 手势提示 */
        .gesture-guide {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85);
            padding: 20px 30px;
            border-radius: 20px;
            display: none;
        }

        .gesture-guide.active {
            display: flex;
            gap: 20px;
        }

        .gesture-item {
            text-align: center;
            color: white;
        }

        .gesture-icon {
            font-size: 32px;
            display: block;
            margin-bottom: 8px;
        }

        .gesture-label {
            font-size: 12px;
            color: #888;
        }

        /* 决策反馈 */
        .decision-feedback {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 48px;
            color: white;
            opacity: 0;
            pointer-events: none;
            text-shadow: 0 0 20px rgba(0, 0, 0, 0.8);
            animation: feedbackPop 0.6s ease-out;
        }

        @keyframes feedbackPop {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
            50% { opacity: 1; transform: translate(-50%, -50%) scale(1.2); }
            100% { opacity: 0; transform: translate(-50%, -50%) scale(1); }
        }

        /* 报告界面 */
        .report-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            z-index: 20;
            display: none;
            overflow-y: auto;
            padding: 40px 20px;
        }

        .report-screen.active {
            display: block;
        }

        .report-container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 25px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .report-title {
            text-align: center;
            font-size: 32px;
            margin-bottom: 30px;
            color: #333;
        }

        .score-circle {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            margin: 0 auto 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            color: white;
        }

        .score-value {
            font-size: 48px;
            font-weight: bold;
        }

        .score-grade {
            font-size: 24px;
        }

        .report-section {
            margin: 30px 0;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 15px;
        }

        .report-section-title {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 15px;
            color: #333;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            margin: 10px 0;
            font-size: 16px;
        }

        .pattern-card {
            background: white;
            padding: 20px;
            border-radius: 15px;
            margin-top: 15px;
            border-left: 4px solid #667eea;
        }

        .pattern-title {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .pattern-desc {
            color: #666;
            line-height: 1.6;
        }

        .advice-list {
            list-style: none;
            margin-top: 10px;
        }

        .advice-list li {
            padding: 10px 0;
            border-bottom: 1px solid #eee;
        }

        .advice-list li:last-child {
            border-bottom: none;
        }

        .button-group {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        .btn {
            flex: 1;
            padding: 18px;
            border: none;
            border-radius: 15px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            pointer-events: all;
        }

        .btn:active {
            transform: scale(0.95);
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: white;
            color: #667eea;
            border: 2px solid #667eea;
        }

        /* 加载屏幕 */
        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            text-align: center;
            z-index: 100;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* 调试开关 */
        .debug-toggle {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 10px 15px;
            border-radius: 10px;
            font-size: 12px;
            cursor: pointer;
            pointer-events: all;
            z-index: 15;
        }
    </style>
</head>
<body>
    <div id="container">
        <!-- 视频和画布 -->
        <video id="video" autoplay playsinline></video>
        <canvas id="frozenCanvas"></canvas>
        <canvas id="edgeCanvas"></canvas>
        <canvas id="debugCanvas"></canvas>
        <canvas id="uiCanvas"></canvas>

        <!-- UI层 -->
        <div class="ui-overlay">
            <!-- 状态栏 -->
            <div class="status-bar">
                <div class="phase-indicator" id="phaseIndicator">初始化中...</div>
                <div id="statusText">正在加载...</div>
            </div>

            <!-- 中央提示 -->
            <div class="center-message" id="centerMessage">
                <span class="center-message-icon">🙏</span>
                <div id="messageText">双手合十开始扫描</div>
            </div>

            <!-- 训练HUD -->
            <div class="training-hud" id="trainingHUD">
                <div class="hud-row">
                    <span class="hud-label">物品进度</span>
                    <span class="hud-value"><span id="currentItem">1</span>/<span id="totalItems">5</span></span>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <div class="timer" id="timer">3.0</div>
                <div class="hud-row">
                    <span class="hud-label">连击</span>
                    <span class="hud-value"><span id="comboCount">0</span>x 🔥</span>
                </div>
                <div class="pressure-meter">
                    <div class="hud-row">
                        <span class="hud-label">压力值</span>
                        <span class="hud-value"><span id="pressureValue">0</span>%</span>
                    </div>
                    <div class="pressure-bar">
                        <div class="pressure-fill" id="pressureFill"></div>
                    </div>
                </div>
            </div>

            <!-- 手势指南 -->
            <div class="gesture-guide" id="gestureGuide">
                <div class="gesture-item">
                    <span class="gesture-icon">👆</span>
                    <div class="gesture-label">立即处理</div>
                </div>
                <div class="gesture-item">
                    <span class="gesture-icon">🖐️</span>
                    <div class="gesture-label">稍后处理</div>
                </div>
                <div class="gesture-item">
                    <span class="gesture-icon">🤟</span>
                    <div class="gesture-label">丢弃</div>
                </div>
                <div class="gesture-item">
                    <span class="gesture-icon">✊</span>
                    <div class="gesture-label">归档</div>
                </div>
            </div>
        </div>

        <!-- 报告界面 -->
        <div class="report-screen" id="reportScreen">
            <div class="report-container">
                <h1 class="report-title">🎉 训练完成！</h1>

                <div class="score-circle">
                    <div class="score-value" id="finalScore">85</div>
                    <div class="score-grade" id="finalGrade">A</div>
                </div>

                <div class="report-section">
                    <div class="report-section-title">📊 训练统计</div>
                    <div class="stat-row">
                        <span>总决策数</span>
                        <span id="statTotal">--</span>
                    </div>
                    <div class="stat-row">
                        <span>平均用时</span>
                        <span id="statAvgTime">--</span>
                    </div>
                    <div class="stat-row">
                        <span>快速决策</span>
                        <span id="statFast">--</span>
                    </div>
                    <div class="stat-row">
                        <span>最大连击</span>
                        <span id="statCombo">--</span>
                    </div>
                    <div class="stat-row">
                        <span>最终压力</span>
                        <span id="statPressure">--</span>
                    </div>
                </div>

                <div class="report-section">
                    <div class="report-section-title">📋 决策分布</div>
                    <div class="stat-row">
                        <span>🔥 立即处理</span>
                        <span id="statDoNow">--</span>
                    </div>
                    <div class="stat-row">
                        <span>⏰ 稍后处理</span>
                        <span id="statDoLater">--</span>
                    </div>
                    <div class="stat-row">
                        <span>🗑️ 丢弃</span>
                        <span id="statDelete">--</span>
                    </div>
                    <div class="stat-row">
                        <span>📁 归档</span>
                        <span id="statArchive">--</span>
                    </div>
                </div>

                <div class="report-section">
                    <div class="report-section-title">🧠 决策模式分析</div>
                    <div class="pattern-card">
                        <div class="pattern-title" id="patternTitle">--</div>
                        <div class="pattern-desc" id="patternDesc">--</div>
                    </div>
                    <ul class="advice-list" id="adviceList">
                        <!-- 动态生成 -->
                    </ul>
                </div>

                <div class="button-group">
                    <button class="btn btn-secondary" id="exportBtn">📥 导出清单</button>
                    <button class="btn btn-primary" id="restartBtn">🔄 再来一局</button>
                </div>
            </div>
        </div>

        <!-- 加载 -->
        <div class="loading" id="loading">
            <div class="spinner"></div>
            正在加载手势识别模型...<br>
            <small>首次加载可能需要几秒钟</small>
        </div>

        <!-- 调试开关 -->
        <div class="debug-toggle" id="debugToggle">🐛 调试</div>
    </div>

    <!-- MediaPipe Hands -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

    <script>
        // ==============================================
        // 全局变量和配置
        // ==============================================

        const video = document.getElementById('video');
        const frozenCanvas = document.getElementById('frozenCanvas');
        const edgeCanvas = document.getElementById('edgeCanvas');
        const debugCanvas = document.getElementById('debugCanvas');
        const uiCanvas = document.getElementById('uiCanvas');

        const frozenCtx = frozenCanvas.getContext('2d');
        const edgeCtx = edgeCanvas.getContext('2d');
        const debugCtx = debugCanvas.getContext('2d');
        const uiCtx = uiCanvas.getContext('2d');

        // 应用状态机
        const AppPhases = {
            LOADING: 'loading',
            READY: 'ready',
            SCANNING: 'scanning',
            TRAINING: 'training',
            REPORT: 'report'
        };

        let currentPhase = AppPhases.LOADING;
        let handsData = { left: null, right: null };
        let isDebugMode = false;

        // 决策类型
        const DecisionTypes = {
            DO_NOW: 'do_now',
            DO_LATER: 'do_later',
            DELETE: 'delete',
            ARCHIVE: 'archive'
        };

        const DecisionConfig = {
            [DecisionTypes.DO_NOW]: { icon: '🔥', label: '立即处理', color: '#ff4444' },
            [DecisionTypes.DO_LATER]: { icon: '⏰', label: '稍后处理', color: '#ffaa00' },
            [DecisionTypes.DELETE]: { icon: '🗑️', label: '丢弃', color: '#888888' },
            [DecisionTypes.ARCHIVE]: { icon: '📁', label: '归档', color: '#4444ff' }
        };

        // 训练数据
        let itemRegions = [];
        let currentItemIndex = 0;
        let decisions = [];
        let decisionTimer = null;
        let decisionStartTime = 0;
        const DECISION_TIME_LIMIT = 3000; // 3秒

        // 游戏化系统
        let comboCount = 0;
        let maxCombo = 0;
        let pressureLevel = 0;

        // ==============================================
        // 初始化
        // ==============================================

        async function init() {
            try {
                console.log('🚀 启动AR决策训练教练');

                // 初始化摄像头
                await initCamera();
                console.log('✅ 摄像头就绪');

                // 初始化MediaPipe
                await initMediaPipe();
                console.log('✅ MediaPipe就绪');

                // 隐藏加载界面
                document.getElementById('loading').style.display = 'none';

                // 进入就绪阶段
                enterPhase(AppPhases.READY);

            } catch (err) {
                console.error('❌ 初始化失败:', err);
                alert('初始化失败：' + err.message);
            }
        }

        async function initCamera() {
            const stream = await navigator.mediaDevices.getUserMedia({
                video: {
                    facingMode: 'environment',
                    width: { ideal: 1280 },
                    height: { ideal: 720 }
                },
                audio: false
            });

            video.srcObject = stream;

            return new Promise((resolve) => {
                video.onloadedmetadata = () => {
                    resizeCanvases();
                    resolve();
                };
            });
        }

        function resizeCanvases() {
            const width = window.innerWidth;
            const height = window.innerHeight;

            [frozenCanvas, edgeCanvas, debugCanvas, uiCanvas].forEach(canvas => {
                canvas.width = width;
                canvas.height = height;
            });
        }

        window.addEventListener('resize', resizeCanvases);

        async function initMediaPipe() {
            const hands = new Hands({
                locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
            });

            hands.setOptions({
                maxNumHands: 2,
                modelComplexity: 1,
                minDetectionConfidence: 0.7,
                minTrackingConfidence: 0.5
            });

            hands.onResults(onHandsResults);

            const camera = new Camera(video, {
                onFrame: async () => {
                    await hands.send({ image: video });
                },
                width: 1280,
                height: 720
            });

            await camera.start();
        }

        function onHandsResults(results) {
            debugCtx.clearRect(0, 0, debugCanvas.width, debugCanvas.height);

            if (results.multiHandLandmarks && results.multiHandedness) {
                handsData = { left: null, right: null };

                results.multiHandLandmarks.forEach((landmarks, index) => {
                    const handedness = results.multiHandedness[index].label;
                    const handLabel = handedness === 'Left' ? 'right' : 'left';

                    handsData[handLabel] = { landmarks, handedness: handLabel };

                    if (isDebugMode) {
                        drawHandLandmarks(landmarks, handLabel);
                    }
                });

                // 根据当前阶段处理手势
                processGestures();
            }
        }

        function drawHandLandmarks(landmarks, handLabel) {
            const color = handLabel === 'left' ? '#00ff00' : '#ff0000';

            landmarks.forEach((landmark) => {
                const x = landmark.x * debugCanvas.width;
                const y = landmark.y * debugCanvas.height;

                debugCtx.beginPath();
                debugCtx.arc(x, y, 5, 0, 2 * Math.PI);
                debugCtx.fillStyle = color;
                debugCtx.fill();
            });
        }

        // ==============================================
        // 状态机管理
        // ==============================================

        function enterPhase(phase) {
            console.log(`📍 进入阶段: ${phase}`);
            currentPhase = phase;

            switch (phase) {
                case AppPhases.READY:
                    showCenterMessage('🙏', '双手合十开始扫描');
                    updateStatus('准备就绪', '双手合十即可开始');
                    break;

                case AppPhases.SCANNING:
                    hideCenterMessage();
                    updateStatus('扫描中...', '正在识别物品...');
                    startScanning();
                    break;

                case AppPhases.TRAINING:
                    updateStatus('决策训练', '快速做出决策！');
                    startTraining();
                    break;

                case AppPhases.REPORT:
                    showReport();
                    break;
            }
        }

        function updateStatus(phase, text) {
            document.getElementById('phaseIndicator').textContent = phase;
            document.getElementById('statusText').textContent = text;
        }

        function showCenterMessage(icon, text) {
            const msg = document.getElementById('centerMessage');
            msg.querySelector('.center-message-icon').textContent = icon;
            document.getElementById('messageText').textContent = text;
            msg.classList.add('show');
        }

        function hideCenterMessage() {
            document.getElementById('centerMessage').classList.remove('show');
        }

        // ==============================================
        // 手势处理
        // ==============================================

        function processGestures() {
            if (currentPhase === AppPhases.READY) {
                detectHandsTogether();
            } else if (currentPhase === AppPhases.TRAINING) {
                detectDecisionGesture();
            }
        }

        function detectHandsTogether() {
            if (!handsData.left || !handsData.right) return;

            const leftPalm = handsData.left.landmarks[9];
            const rightPalm = handsData.right.landmarks[9];

            const distanceX = (leftPalm.x - rightPalm.x) * debugCanvas.width;
            const distanceY = (leftPalm.y - rightPalm.y) * debugCanvas.height;
            const distance = Math.sqrt(distanceX * distanceX + distanceY * distanceY);

            if (distance < 60) {
                enterPhase(AppPhases.SCANNING);
            }
        }

        function detectDecisionGesture() {
            const hand = handsData.left || handsData.right;
            if (!hand) return;

            const gesture = recognizeGesture(hand);
            if (gesture) {
                makeDecision(gesture);
            }
        }

        function recognizeGesture(hand) {
            const landmarks = hand.landmarks;

            const index_tip = landmarks[8];
            const middle_tip = landmarks[12];
            const ring_tip = landmarks[16];
            const pinky_tip = landmarks[20];

            const index_mcp = landmarks[5];
            const middle_mcp = landmarks[9];
            const ring_mcp = landmarks[13];
            const pinky_mcp = landmarks[17];

            const isIndexStraight = index_tip.y < index_mcp.y - 0.05;
            const isMiddleStraight = middle_tip.y < middle_mcp.y - 0.05;
            const isRingStraight = ring_tip.y < ring_mcp.y - 0.05;
            const isPinkyStraight = pinky_tip.y < pinky_mcp.y - 0.05;

            // 👆 食指指向 → 立即处理
            if (isIndexStraight && !isMiddleStraight && !isRingStraight && !isPinkyStraight) {
                return DecisionTypes.DO_NOW;
            }

            // 🖐️ 手掌展开 → 稍后处理
            if (isIndexStraight && isMiddleStraight && isRingStraight && isPinkyStraight) {
                return DecisionTypes.DO_LATER;
            }

            // 🤟 摇滚手势 → 丢弃
            if (isIndexStraight && isPinkyStraight && !isMiddleStraight && !isRingStraight) {
                return DecisionTypes.DELETE;
            }

            // ✊ 握拳 → 归档
            if (!isIndexStraight && !isMiddleStraight && !isRingStraight && !isPinkyStraight) {
                return DecisionTypes.ARCHIVE;
            }

            return null;
        }

        // ==============================================
        // 扫描阶段
        // ==============================================

        function startScanning() {
            // 冻结背景
            frozenCtx.save();
            frozenCtx.scale(-1, 1);
            frozenCtx.drawImage(video, -frozenCanvas.width, 0, frozenCanvas.width, frozenCanvas.height);
            frozenCtx.restore();

            frozenCanvas.style.display = 'block';
            video.style.display = 'none';

            // 检测边缘
            setTimeout(() => {
                detectEdges();
                identifyRegions();

                setTimeout(() => {
                    enterPhase(AppPhases.TRAINING);
                }, 1500);
            }, 500);
        }

        function detectEdges() {
            const imageData = frozenCtx.getImageData(0, 0, frozenCanvas.width, frozenCanvas.height);
            const width = imageData.width;
            const height = imageData.height;
            const data = imageData.data;

            const grayData = new Uint8ClampedArray(width * height);
            for (let i = 0; i < data.length; i += 4) {
                const gray = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
                grayData[i / 4] = gray;
            }

            const edgeData = new Uint8ClampedArray(width * height);
            const threshold = 50;

            for (let y = 1; y < height - 1; y++) {
                for (let x = 1; x < width - 1; x++) {
                    const idx = y * width + x;

                    const gx =
                        -1 * grayData[(y - 1) * width + (x - 1)] +
                        -2 * grayData[y * width + (x - 1)] +
                        -1 * grayData[(y + 1) * width + (x - 1)] +
                         1 * grayData[(y - 1) * width + (x + 1)] +
                         2 * grayData[y * width + (x + 1)] +
                         1 * grayData[(y + 1) * width + (x + 1)];

                    const gy =
                        -1 * grayData[(y - 1) * width + (x - 1)] +
                        -2 * grayData[(y - 1) * width + x] +
                        -1 * grayData[(y - 1) * width + (x + 1)] +
                         1 * grayData[(y + 1) * width + (x - 1)] +
                         2 * grayData[(y + 1) * width + x] +
                         1 * grayData[(y + 1) * width + (x + 1)];

                    const magnitude = Math.sqrt(gx * gx + gy * gy);
                    edgeData[idx] = magnitude > threshold ? 255 : 0;
                }
            }

            const edgeImageData = edgeCtx.createImageData(width, height);
            for (let i = 0; i < edgeData.length; i++) {
                const idx = i * 4;
                if (edgeData[i] > 0) {
                    edgeImageData.data[idx] = 0;
                    edgeImageData.data[idx + 1] = 255;
                    edgeImageData.data[idx + 2] = 255;
                    edgeImageData.data[idx + 3] = 255;
                }
            }

            edgeCtx.putImageData(edgeImageData, 0, 0);
        }

        function identifyRegions() {
            // 简化版：将画面分成网格，模拟物品区域
            const gridCols = 3;
            const gridRows = 2;
            const width = frozenCanvas.width;
            const height = frozenCanvas.height;
            const cellWidth = width / gridCols;
            const cellHeight = height / gridRows;

            itemRegions = [];
            for (let row = 0; row < gridRows; row++) {
                for (let col = 0; col < gridCols; col++) {
                    itemRegions.push({
                        x: col * cellWidth + cellWidth * 0.2,
                        y: row * cellHeight + cellHeight * 0.2,
                        width: cellWidth * 0.6,
                        height: cellHeight * 0.6,
                        centerX: col * cellWidth + cellWidth / 2,
                        centerY: row * cellHeight + cellHeight / 2
                    });
                }
            }

            // 随机选择5-7个区域
            itemRegions = itemRegions.sort(() => Math.random() - 0.5).slice(0, 5 + Math.floor(Math.random() * 3));

            console.log(`✅ 识别到 ${itemRegions.length} 个物品区域`);
        }

        // ==============================================
        // 训练阶段
        // ==============================================

        function startTraining() {
            document.getElementById('trainingHUD').classList.add('active');
            document.getElementById('gestureGuide').classList.add('active');

            document.getElementById('totalItems').textContent = itemRegions.length;
            currentItemIndex = 0;
            decisions = [];
            comboCount = 0;
            maxCombo = 0;
            pressureLevel = 0;

            startNextItem();
        }

        function startNextItem() {
            if (currentItemIndex >= itemRegions.length) {
                finishTraining();
                return;
            }

            clearInterval(decisionTimer);

            document.getElementById('currentItem').textContent = currentItemIndex + 1;
            updateProgress();

            // 高亮当前物品
            highlightCurrentItem();

            // 开始计时
            decisionStartTime = Date.now();
            let timeLeft = DECISION_TIME_LIMIT;

            decisionTimer = setInterval(() => {
                timeLeft = Math.max(0, DECISION_TIME_LIMIT - (Date.now() - decisionStartTime));
                const seconds = (timeLeft / 1000).toFixed(1);

                const timerEl = document.getElementById('timer');
                timerEl.textContent = seconds;

                if (timeLeft < 1000) {
                    timerEl.classList.add('warning');
                } else {
                    timerEl.classList.remove('warning');
                }

                if (timeLeft === 0) {
                    clearInterval(decisionTimer);
                    makeDecision(null); // 超时
                }
            }, 100);
        }

        function highlightCurrentItem() {
            uiCtx.clearRect(0, 0, uiCanvas.width, uiCanvas.height);

            const region = itemRegions[currentItemIndex];

            uiCtx.strokeStyle = '#ffff00';
            uiCtx.lineWidth = 4;
            uiCtx.strokeRect(region.x, region.y, region.width, region.height);

            uiCtx.fillStyle = 'rgba(255, 255, 0, 0.2)';
            uiCtx.fillRect(region.x, region.y, region.width, region.height);
        }

        function makeDecision(decisionType) {
            clearInterval(decisionTimer);

            const decisionTime = Date.now() - decisionStartTime;

            if (decisionType === null) {
                // 超时
                pressureLevel = Math.min(100, pressureLevel + 15);
                comboCount = 0;

                showDecisionFeedback('⏰', 'timeout');
            } else {
                // 正常决策
                if (decisionTime < 2000) {
                    comboCount++;
                    maxCombo = Math.max(maxCombo, comboCount);
                } else {
                    comboCount = 0;
                }

                if (decisionTime > DECISION_TIME_LIMIT) {
                    pressureLevel = Math.min(100, pressureLevel + 10);
                } else {
                    pressureLevel = Math.max(0, pressureLevel - 5);
                }

                decisions.push({
                    item: currentItemIndex,
                    decision: decisionType,
                    time: decisionTime,
                    pressure: pressureLevel,
                    timestamp: Date.now()
                });

                showDecisionFeedback(DecisionConfig[decisionType].icon, decisionType);
            }

            updateCombo();
            updatePressure();

            currentItemIndex++;
            setTimeout(() => startNextItem(), 800);
        }

        function showDecisionFeedback(icon, type) {
            const feedback = document.createElement('div');
            feedback.className = 'decision-feedback';
            feedback.textContent = icon;
            document.getElementById('container').appendChild(feedback);

            setTimeout(() => feedback.remove(), 600);
        }

        function updateProgress() {
            const progress = (currentItemIndex / itemRegions.length) * 100;
            document.getElementById('progressFill').style.width = progress + '%';
        }

        function updateCombo() {
            document.getElementById('comboCount').textContent = comboCount;
        }

        function updatePressure() {
            document.getElementById('pressureValue').textContent = Math.round(pressureLevel);
            document.getElementById('pressureFill').style.width = pressureLevel + '%';
        }

        function finishTraining() {
            document.getElementById('trainingHUD').classList.remove('active');
            document.getElementById('gestureGuide').classList.remove('active');
            uiCtx.clearRect(0, 0, uiCanvas.width, uiCanvas.height);

            enterPhase(AppPhases.REPORT);
        }

        // ==============================================
        // 报告生成
        // ==============================================

        function showReport() {
            const report = generateReport();
            displayReport(report);

            document.getElementById('reportScreen').classList.add('active');
        }

        function generateReport() {
            const totalDecisions = decisions.length;
            const totalTime = decisions.reduce((sum, d) => sum + d.time, 0);
            const avgTime = totalTime / totalDecisions;

            const fastDecisions = decisions.filter(d => d.time < 2000).length;
            const slowDecisions = decisions.filter(d => d.time > 3000).length;

            const decisionCounts = {
                [DecisionTypes.DO_NOW]: decisions.filter(d => d.decision === DecisionTypes.DO_NOW).length,
                [DecisionTypes.DO_LATER]: decisions.filter(d => d.decision === DecisionTypes.DO_LATER).length,
                [DecisionTypes.DELETE]: decisions.filter(d => d.decision === DecisionTypes.DELETE).length,
                [DecisionTypes.ARCHIVE]: decisions.filter(d => d.decision === DecisionTypes.ARCHIVE).length
            };

            const timeScore = Math.max(0, 100 - avgTime / 10);
            const comboBonus = maxCombo * 10;
            const pressurePenalty = pressureLevel;
            const score = Math.round(timeScore + comboBonus - pressurePenalty);

            let grade = 'D';
            if (score >= 90) grade = 'S';
            else if (score >= 80) grade = 'A';
            else if (score >= 70) grade = 'B';
            else if (score >= 60) grade = 'C';

            const pattern = analyzePattern(avgTime, decisionCounts[DecisionTypes.DO_LATER] / totalDecisions, slowDecisions);

            return {
                score,
                grade,
                totalDecisions,
                avgTime,
                fastDecisions,
                slowDecisions,
                maxCombo,
                pressureLevel,
                decisionCounts,
                pattern
            };
        }

        function analyzePattern(avgTime, doLaterRatio, slowCount) {
            let pattern = 'balanced';
            let advice = [];

            if (doLaterRatio > 0.5) {
                pattern = 'procrastinator';
                advice.push('💡 尝试将更多物品标记为"立即处理"');
                advice.push('⚡ 技巧：问自己"2分钟内能完成吗？"');
            } else if (avgTime > 4000 && slowCount > decisions.length * 0.6) {
                pattern = 'perfectionist';
                advice.push('💡 练习快速决策，大多数决定是可逆的');
                advice.push('⚡ 技巧：使用3秒规则');
            } else if (avgTime < 1500) {
                pattern = 'impulsive';
                advice.push('💡 适当放慢节奏，思考一下后果');
                advice.push('⚡ 技巧：重要物品至少思考2秒');
            } else {
                pattern = 'balanced';
                advice.push('✨ 你的决策节奏很好！');
                advice.push('🎯 继续保持这种平衡的决策风格');
            }

            const patternInfo = {
                procrastinator: { title: '拖延症型 🐌', desc: '你倾向于将事情推到"稍后处理"', color: '#ffaa00' },
                perfectionist: { title: '完美主义型 🎯', desc: '你对每个决定都很谨慎', color: '#6c5ce7' },
                impulsive: { title: '冲动型 ⚡', desc: '你决策很快，但可能忽略细节', color: '#ff6b6b' },
                balanced: { title: '平衡型 ✨', desc: '你的决策速度和质量都很好！', color: '#00d2d3' }
            };

            return {
                type: pattern,
                ...patternInfo[pattern],
                advice
            };
        }

        function displayReport(report) {
            document.getElementById('finalScore').textContent = report.score;
            document.getElementById('finalGrade').textContent = report.grade;

            document.getElementById('statTotal').textContent = report.totalDecisions;
            document.getElementById('statAvgTime').textContent = (report.avgTime / 1000).toFixed(1) + '秒';
            document.getElementById('statFast').textContent = report.fastDecisions + ' (' + Math.round(report.fastDecisions / report.totalDecisions * 100) + '%)';
            document.getElementById('statCombo').textContent = report.maxCombo + 'x';
            document.getElementById('statPressure').textContent = Math.round(report.pressureLevel) + '%';

            document.getElementById('statDoNow').textContent = report.decisionCounts[DecisionTypes.DO_NOW];
            document.getElementById('statDoLater').textContent = report.decisionCounts[DecisionTypes.DO_LATER];
            document.getElementById('statDelete').textContent = report.decisionCounts[DecisionTypes.DELETE];
            document.getElementById('statArchive').textContent = report.decisionCounts[DecisionTypes.ARCHIVE];

            document.getElementById('patternTitle').textContent = report.pattern.title;
            document.getElementById('patternDesc').textContent = report.pattern.desc;

            const adviceList = document.getElementById('adviceList');
            adviceList.innerHTML = '';
            report.pattern.advice.forEach(advice => {
                const li = document.createElement('li');
                li.textContent = advice;
                adviceList.appendChild(li);
            });
        }

        // ==============================================
        // 导出功能
        // ==============================================

        function exportTodoList() {
            let markdown = '# 🎯 你的整理决策结果\n\n';
            markdown += `生成时间：${new Date().toLocaleString()}\n\n`;

            const categorized = {
                [DecisionTypes.DO_NOW]: [],
                [DecisionTypes.DO_LATER]: [],
                [DecisionTypes.DELETE]: [],
                [DecisionTypes.ARCHIVE]: []
            };

            decisions.forEach(d => {
                categorized[d.decision].push(`物品 #${d.item + 1}`);
            });

            markdown += '## ✅ 立即处理\n';
            categorized[DecisionTypes.DO_NOW].forEach(item => {
                markdown += `- [ ] ${item}\n`;
            });

            markdown += '\n## ⏰ 稍后处理\n';
            categorized[DecisionTypes.DO_LATER].forEach(item => {
                markdown += `- [ ] ${item}\n`;
            });

            markdown += '\n## 🗑️ 可丢弃\n';
            categorized[DecisionTypes.DELETE].forEach(item => {
                markdown += `- ${item}\n`;
            });

            markdown += '\n## 📁 需归档\n';
            categorized[DecisionTypes.ARCHIVE].forEach(item => {
                markdown += `- ${item}\n`;
            });

            const blob = new Blob([markdown], { type: 'text/markdown' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `决策清单_${new Date().toISOString().split('T')[0]}.md`;
            a.click();

            alert('✅ 待办清单已下载！');
        }

        // ==============================================
        // 事件监听
        // ==============================================

        document.getElementById('exportBtn').addEventListener('click', exportTodoList);

        document.getElementById('restartBtn').addEventListener('click', () => {
            document.getElementById('reportScreen').classList.remove('active');
            frozenCanvas.style.display = 'none';
            video.style.display = 'block';
            edgeCtx.clearRect(0, 0, edgeCanvas.width, edgeCanvas.height);
            uiCtx.clearRect(0, 0, uiCanvas.width, uiCanvas.height);
            enterPhase(AppPhases.READY);
        });

        document.getElementById('debugToggle').addEventListener('click', () => {
            isDebugMode = !isDebugMode;
            if (!isDebugMode) {
                debugCtx.clearRect(0, 0, debugCanvas.width, debugCanvas.height);
            }
        });

        // 启动应用
        init();
    </script>
