<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rusty Lake Mystery Room</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', serif;
            background: #000;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        /* Main game container */
        .game-container {
            display: flex;
            height: 100vh;
            width: 100vw;
            position: relative;
        }

        /* Main scene area - with vignette effect */
        .scene-area {
            flex: 1;
            position: relative;
            background: #2a1f1a;
            overflow: hidden;
        }

        /* Vignette dark edges effect - DISABLED, images already have vignette */
        .scene-area::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            /* box-shadow: inset 0 0 200px 100px rgba(0,0,0,0.8); */
            pointer-events: none;
            z-index: 1000;
        }

        /* Room walls */
        .room-wall {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            display: none;
            background-size: cover;
            background-position: center;
        }

        .room-wall.active {
            display: block;
        }

        /* Wall 1 - Front wall (窗户墙) */
        .wall-front {
            background-image: url('前.JPG');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        /* Wall 2 - Right wall (桌子+柜子墙) */
        .wall-right {
            background-image: url('右.JPG');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        /* Wall 3 - Back wall (储物墙) */
        .wall-back {
            background-image: url('后.JPG');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        /* Wall 4 - Left wall (窗户+凳子墙) */
        .wall-left {
            background-image: url('左.JPG');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        /* Ceiling */
        .ceiling {
            background-image: url('天花板.JPG');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        /* Floor - HIDDEN, images already have floor */
        .floor {
            display: none;
        }

        /* Side walls - HIDDEN, images already have side edges */
        .wall-left-edge,
        .wall-right-edge {
            display: none;
        }

        /* Navigation arrows */
        .nav-container {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 200px;
            z-index: 1001;
        }

        .nav-arrow {
            width: 0;
            height: 0;
            cursor: pointer;
            transition: all 0.3s;
        }

        .nav-arrow.left {
            border-top: 20px solid transparent;
            border-bottom: 20px solid transparent;
            border-right: 30px solid rgba(255, 255, 255, 0.6);
        }

        .nav-arrow.right {
            border-top: 20px solid transparent;
            border-bottom: 20px solid transparent;
            border-left: 30px solid rgba(255, 255, 255, 0.6);
        }

        .nav-arrow:hover {
            transform: scale(1.2);
        }

        .nav-arrow.left:hover {
            border-right-color: rgba(255, 255, 255, 0.9);
        }

        .nav-arrow.right:hover {
            border-left-color: rgba(255, 255, 255, 0.9);
        }

        /* Up arrow for ceiling */
        .nav-up {
            position: absolute;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-bottom: 30px solid rgba(255, 255, 255, 0.6);
            cursor: pointer;
            transition: all 0.3s;
            z-index: 1001;
        }

        .nav-up:hover {
            transform: translateX(-50%) scale(1.2);
            border-bottom-color: rgba(255, 255, 255, 0.9);
        }

        /* Right toolbar */
        .toolbar {
            width: 120px;
            background: linear-gradient(180deg, #2a2520 0%, #1a1510 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 10px;
            gap: 15px;
            position: relative;
            z-index: 1002;
        }

        /* Toolbar icons (inventory slots) */
        .toolbar-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #e8d4a0 0%, #c9b888 100%);
            border: 3px solid #8b7355;
            border-radius: 8px;
            box-shadow:
                inset 0 2px 5px rgba(255,255,255,0.3),
                inset 0 -2px 5px rgba(0,0,0,0.3),
                0 4px 8px rgba(0,0,0,0.5);
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
        }

        .toolbar-icon:hover {
            transform: scale(1.05);
            box-shadow:
                inset 0 2px 5px rgba(255,255,255,0.3),
                inset 0 -2px 5px rgba(0,0,0,0.3),
                0 6px 12px rgba(0,0,0,0.7);
        }

        .toolbar-icon.active {
            background: linear-gradient(135deg, #ffd700 0%, #e8b800 100%);
            box-shadow:
                inset 0 2px 5px rgba(255,255,255,0.5),
                inset 0 -2px 5px rgba(0,0,0,0.2),
                0 0 20px rgba(255,215,0,0.6);
        }

        .toolbar-icon.empty {
            background: linear-gradient(135deg, #d4c4a0 0%, #b9a888 100%);
            cursor: default;
        }

        .toolbar-icon.empty:hover {
            transform: none;
        }

        /* Wall indicator */
        .wall-indicator {
            position: absolute;
            top: 20px;
            right: 140px;
            color: #fff;
            font-size: 18px;
            z-index: 1001;
            background: rgba(0,0,0,0.6);
            padding: 8px 16px;
            border-radius: 20px;
        }

        /* Dialog box */
        .dialog {
            position: absolute;
            bottom: 120px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.9);
            color: #fff;
            padding: 20px 30px;
            border-radius: 10px;
            border: 2px solid #8b7355;
            max-width: 500px;
            display: none;
            z-index: 1003;
            font-size: 16px;
            text-align: center;
            box-shadow: 0 8px 16px rgba(0,0,0,0.8);
        }

        .dialog.show {
            display: block;
        }

        .dialog::after {
            content: '▼';
            position: absolute;
            bottom: -15px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(0, 0, 0, 0.9);
            font-size: 20px;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <!-- Main scene area -->
        <div class="scene-area">
            <!-- Wall indicator -->
            <div class="wall-indicator">
                <span id="wallName">前墙</span>
            </div>

            <!-- Up arrow for ceiling view -->
            <div class="nav-up" onclick="game.viewCeiling()"></div>

            <!-- Room walls -->
            <div class="room-wall wall-front active" id="wall-1">
                <!-- Initial scene: 前.JPG -->
            </div>
            <div class="room-wall wall-right" id="wall-2">
                <!-- Initial scene: 右.JPG -->
            </div>
            <div class="room-wall wall-back" id="wall-3">
                <!-- Initial scene: 后.JPG -->
            </div>
            <div class="room-wall wall-left" id="wall-4">
                <!-- Initial scene: 左.JPG -->
            </div>
            <div class="room-wall ceiling" id="ceiling">
                <!-- Initial scene: 天花板.JPG -->
            </div>

            <!-- Side edges for perspective (not visible on ceiling view) -->
            <div class="wall-left-edge" id="left-edge"></div>
            <div class="wall-right-edge" id="right-edge"></div>

            <!-- Floor (always visible) -->
            <div class="floor"></div>

            <!-- Navigation arrows -->
            <div class="nav-container">
                <div class="nav-arrow left" onclick="game.previousWall()"></div>
                <div class="nav-arrow right" onclick="game.nextWall()"></div>
            </div>

            <!-- Dialog box -->
            <div class="dialog" id="dialog"></div>
        </div>

        <!-- Right toolbar (inventory) -->
        <div class="toolbar" id="toolbar">
            <!-- Inventory slots will be generated here -->
        </div>
    </div>

    <script>
        class RustyLakeRoom {
            constructor() {
                this.currentWall = 1;
                this.wallNames = ['前墙', '右墙', '后墙', '左墙', '天花板'];
                this.inventory = [];
                this.maxInventorySlots = 8;
                this.selectedItem = null;

                this.init();
            }

            init() {
                this.setupToolbar();
                this.updateWallIndicator();
                this.showDialog('欢迎来到神秘房间');
            }

            setupToolbar() {
                const toolbar = document.getElementById('toolbar');
                toolbar.innerHTML = '';

                // Create inventory slots
                for (let i = 0; i < this.maxInventorySlots; i++) {
                    const slot = document.createElement('div');
                    slot.className = 'toolbar-icon empty';
                    slot.id = `slot-${i}`;
                    toolbar.appendChild(slot);
                }
            }

            nextWall() {
                if (this.currentWall === 5) {
                    this.currentWall = 1;
                } else {
                    this.currentWall = this.currentWall === 4 ? 1 : this.currentWall + 1;
                }
                this.updateWall();
            }

            previousWall() {
                if (this.currentWall === 5) {
                    this.currentWall = 1;
                } else {
                    this.currentWall = this.currentWall === 1 ? 4 : this.currentWall - 1;
                }
                this.updateWall();
            }

            viewCeiling() {
                this.currentWall = 5;
                this.updateWall();
            }

            updateWall() {
                // Hide all walls
                document.querySelectorAll('.room-wall').forEach(wall => {
                    wall.classList.remove('active');
                });

                // Show current wall
                if (this.currentWall === 5) {
                    document.getElementById('ceiling').classList.add('active');
                } else {
                    document.getElementById(`wall-${this.currentWall}`).classList.add('active');
                }

                this.updateWallIndicator();
            }

            updateWallIndicator() {
                document.getElementById('wallName').textContent = this.wallNames[this.currentWall - 1];
            }

            showDialog(message) {
                const dialog = document.getElementById('dialog');
                dialog.innerHTML = message;
                dialog.classList.add('show');
                setTimeout(() => {
                    dialog.classList.remove('show');
                }, 3000);
            }
        }

        // Initialize game
        const game = new RustyLakeRoom();
    </script>
</body>
</html>
