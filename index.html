<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>办公室解压游戏 - 手势互动</title>
    <!-- MediaPipe Hands -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1640029074/camera_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils@0.3.1620248257/drawing_utils.js"></script>
    <!-- Matter.js 物理引擎 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #gameContainer {
            position: relative;
            width: 100%;
            max-width: 1400px;
            height: 90vh;
            display: flex;
            gap: 20px;
            padding: 20px;
        }

        /* 摄像头区域 */
        #cameraSection {
            flex: 0 0 400px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        #videoContainer {
            position: relative;
            background: rgba(0, 0, 0, 0.8);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
        }

        #inputVideo {
            width: 100%;
            display: block;
            transform: scaleX(-1);
        }

        #handCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transform: scaleX(-1);
        }

        #cameraStatus {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 15px;
            border-radius: 15px;
            color: white;
            text-align: center;
            font-size: 14px;
        }

        #cameraStatus.active {
            background: rgba(76, 175, 80, 0.2);
        }

        #cameraStatus.error {
            background: rgba(244, 67, 54, 0.2);
        }

        /* 游戏区域 */
        #gameSection {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        #gameCanvas {
            flex: 1;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            cursor: none;
        }

        /* UI 面板 */
        #uiPanel {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.2);
        }

        .stat {
            color: white;
            text-align: center;
        }

        .stat-label {
            font-size: 14px;
            opacity: 0.8;
            margin-bottom: 5px;
        }

        .stat-value {
            font-size: 32px;
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.3);
        }

        #controls {
            display: flex;
            gap: 10px;
        }

        .btn {
            padding: 12px 24px;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            color: white;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            backdrop-filter: blur(5px);
        }

        .btn:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn-primary {
            background: rgba(76, 175, 80, 0.3);
            border-color: rgba(76, 175, 80, 0.5);
        }

        .btn-primary:hover {
            background: rgba(76, 175, 80, 0.5);
        }

        /* 启动屏幕 */
        #startScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.5s;
        }

        #startScreen.hidden {
            opacity: 0;
            pointer-events: none;
        }

        #startScreen h1 {
            color: white;
            font-size: 48px;
            margin-bottom: 20px;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.3);
        }

        #startScreen p {
            color: rgba(255, 255, 255, 0.9);
            font-size: 18px;
            margin-bottom: 40px;
            text-align: center;
            max-width: 600px;
            line-height: 1.6;
        }

        #startBtn {
            padding: 20px 50px;
            font-size: 24px;
            background: rgba(255, 255, 255, 0.3);
            border: 3px solid rgba(255, 255, 255, 0.5);
            border-radius: 50px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        #startBtn:hover {
            background: rgba(255, 255, 255, 0.4);
            transform: scale(1.05);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.3);
        }

        /* 提示文字 */
        #hints {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            color: white;
            padding: 15px 30px;
            border-radius: 10px;
            font-size: 16px;
            text-align: center;
            backdrop-filter: blur(10px);
            z-index: 100;
            transition: opacity 0.3s;
        }

        #hints.hidden {
            opacity: 0;
            pointer-events: none;
        }

        /* 响应式 */
        @media (max-width: 1200px) {
            #gameContainer {
                flex-direction: column;
                height: auto;
                max-height: 95vh;
            }

            #cameraSection {
                flex: 0 0 auto;
            }

            #gameSection {
                flex: 1;
                min-height: 500px;
            }
        }

        /* 加载动画 */
        .loader {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <!-- 启动屏幕 -->
    <div id="startScreen">
        <h1>🎮 办公室解压游戏</h1>
        <p>
            使用你的手势来捏碎纸团、扔进垃圾桶！<br>
            通过摄像头捕捉你的手部动作，尽情发泄工作压力吧！<br><br>
            ✊ 握拳抓取物品 &nbsp;&nbsp; 🖐️ 张开手释放物品 &nbsp;&nbsp; 👊 快速挥动投掷
        </p>
        <button id="startBtn">开始游戏</button>
    </div>

    <!-- 游戏容器 -->
    <div id="gameContainer" style="display: none;">
        <!-- 摄像头区域 -->
        <div id="cameraSection">
            <div id="videoContainer">
                <video id="inputVideo" autoplay playsinline></video>
                <canvas id="handCanvas"></canvas>
            </div>
            <div id="cameraStatus">
                <div class="loader"></div>
                <div style="margin-top: 10px;">正在初始化摄像头...</div>
            </div>
        </div>

        <!-- 游戏区域 -->
        <div id="gameSection">
            <canvas id="gameCanvas"></canvas>

            <!-- UI 面板 -->
            <div id="uiPanel">
                <div class="stat">
                    <div class="stat-label">得分</div>
                    <div class="stat-value" id="score">0</div>
                </div>
                <div class="stat">
                    <div class="stat-label">连击</div>
                    <div class="stat-value" id="combo">0</div>
                </div>
                <div class="stat">
                    <div class="stat-label">手势状态</div>
                    <div class="stat-value" id="gestureStatus" style="font-size: 24px;">🖐️</div>
                </div>
                <div id="controls">
                    <button class="btn" id="resetBtn">重置</button>
                    <button class="btn btn-primary" id="addItemBtn">添加物品</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 提示 -->
    <div id="hints" class="hidden">
        握拳抓取，张开手释放，快速挥动投掷！
    </div>

    <script>
        // ==================== 全局变量 ====================
        const { Engine, Render, World, Bodies, Body, Events, Mouse, MouseConstraint, Runner } = Matter;

        let engine, render, world, runner;
        let hands, camera;
        let score = 0;
        let combo = 0;
        let comboTimer = null;

        // 手势状态
        let handState = {
            isGrabbing: false,
            position: { x: 0, y: 0 },
            velocity: { x: 0, y: 0 },
            previousPosition: { x: 0, y: 0 }
        };

        // 游戏物品
        let items = [];
        let trashBin = null;
        let grabbedItem = null;

        // DOM 元素
        const startScreen = document.getElementById('startScreen');
        const startBtn = document.getElementById('startBtn');
        const gameContainer = document.getElementById('gameContainer');
        const inputVideo = document.getElementById('inputVideo');
        const handCanvas = document.getElementById('handCanvas');
        const gameCanvas = document.getElementById('gameCanvas');
        const cameraStatus = document.getElementById('cameraStatus');
        const scoreElement = document.getElementById('score');
        const comboElement = document.getElementById('combo');
        const gestureStatus = document.getElementById('gestureStatus');
        const hints = document.getElementById('hints');
        const resetBtn = document.getElementById('resetBtn');
        const addItemBtn = document.getElementById('addItemBtn');

        // ==================== 初始化物理引擎 ====================
        function initPhysics() {
            const canvasWidth = gameCanvas.clientWidth;
            const canvasHeight = gameCanvas.clientHeight;

            // 创建引擎
            engine = Engine.create({
                gravity: { x: 0, y: 1 }
            });
            world = engine.world;

            // 创建渲染器
            render = Render.create({
                canvas: gameCanvas,
                engine: engine,
                options: {
                    width: canvasWidth,
                    height: canvasHeight,
                    wireframes: false,
                    background: '#f5f5dc' // 米色背景
                }
            });

            // 创建地面和墙壁
            const ground = Bodies.rectangle(canvasWidth / 2, canvasHeight - 25, canvasWidth, 50, {
                isStatic: true,
                render: {
                    fillStyle: '#8b4513', // 木纹色
                    strokeStyle: '#654321',
                    lineWidth: 2
                }
            });

            const leftWall = Bodies.rectangle(25, canvasHeight / 2, 50, canvasHeight, {
                isStatic: true,
                render: { fillStyle: '#8b4513' }
            });

            const rightWall = Bodies.rectangle(canvasWidth - 25, canvasHeight / 2, 50, canvasHeight, {
                isStatic: true,
                render: { fillStyle: '#8b4513' }
            });

            World.add(world, [ground, leftWall, rightWall]);

            // 创建垃圾桶
            createTrashBin();

            // 添加初始物品
            addRandomItem();
            addRandomItem();
            addRandomItem();

            // 启动渲染和引擎
            Render.run(render);
            runner = Runner.create();
            Runner.run(runner, engine);

            // 监听碰撞
            Events.on(engine, 'collisionStart', handleCollision);
        }

        // ==================== 创建垃圾桶 ====================
        function createTrashBin() {
            const canvasWidth = gameCanvas.clientWidth;
            const canvasHeight = gameCanvas.clientHeight;

            trashBin = Bodies.rectangle(
                canvasWidth - 150,
                canvasHeight - 100,
                100,
                120,
                {
                    isStatic: true,
                    isSensor: true, // 传感器，不产生物理碰撞
                    label: 'trashBin',
                    render: {
                        fillStyle: '#666',
                        strokeStyle: '#333',
                        lineWidth: 3
                    }
                }
            );

            World.add(world, trashBin);
        }

        // ==================== 添加随机物品 ====================
        function addRandomItem() {
            const canvasWidth = gameCanvas.clientWidth;
            const types = ['paper', 'cup', 'document'];
            const type = types[Math.floor(Math.random() * types.length)];

            let item;
            const x = Math.random() * (canvasWidth - 200) + 100;
            const y = Math.random() * 200 + 100;

            switch(type) {
                case 'paper':
                    item = Bodies.circle(x, y, 25, {
                        label: 'paper',
                        restitution: 0.6,
                        friction: 0.1,
                        render: {
                            fillStyle: '#ffffff',
                            strokeStyle: '#cccccc',
                            lineWidth: 2
                        }
                    });
                    break;
                case 'cup':
                    item = Bodies.rectangle(x, y, 40, 60, {
                        label: 'cup',
                        restitution: 0.3,
                        friction: 0.5,
                        render: {
                            fillStyle: '#d2691e',
                            strokeStyle: '#8b4513',
                            lineWidth: 2
                        }
                    });
                    break;
                case 'document':
                    item = Bodies.rectangle(x, y, 60, 80, {
                        label: 'document',
                        restitution: 0.1,
                        friction: 0.8,
                        render: {
                            fillStyle: '#f0f0f0',
                            strokeStyle: '#888888',
                            lineWidth: 2
                        }
                    });
                    break;
            }

            items.push(item);
            World.add(world, item);
        }

        // ==================== 碰撞检测 ====================
        function handleCollision(event) {
            const pairs = event.pairs;

            pairs.forEach(pair => {
                const { bodyA, bodyB } = pair;

                // 检查物品是否进入垃圾桶
                if ((bodyA === trashBin && items.includes(bodyB)) ||
                    (bodyB === trashBin && items.includes(bodyA))) {
                    const item = bodyA === trashBin ? bodyB : bodyA;

                    // 移除物品
                    World.remove(world, item);
                    items = items.filter(i => i !== item);

                    // 增加分数
                    updateScore(10);

                    // 添加新物品
                    setTimeout(() => addRandomItem(), 500);
                }
            });
        }

        // ==================== 更新分数 ====================
        function updateScore(points) {
            score += points;
            scoreElement.textContent = score;

            // 更新连击
            combo++;
            comboElement.textContent = combo;

            // 重置连击计时器
            if (comboTimer) clearTimeout(comboTimer);
            comboTimer = setTimeout(() => {
                combo = 0;
                comboElement.textContent = combo;
            }, 3000);
        }

        // ==================== 初始化 MediaPipe Hands ====================
        async function initHandTracking() {
            try {
                // 初始化 MediaPipe Hands
                hands = new Hands({
                    locateFile: (file) => {
                        return `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/${file}`;
                    }
                });

                hands.setOptions({
                    maxNumHands: 1,
                    modelComplexity: 1,
                    minDetectionConfidence: 0.7,
                    minTrackingConfidence: 0.7
                });

                hands.onResults(onHandResults);

                // 初始化摄像头
                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { width: 640, height: 480 }
                });

                inputVideo.srcObject = stream;

                camera = new Camera(inputVideo, {
                    onFrame: async () => {
                        await hands.send({ image: inputVideo });
                    },
                    width: 640,
                    height: 480
                });

                camera.start();

                // 更新状态
                cameraStatus.className = 'active';
                cameraStatus.innerHTML = '✅ 摄像头已连接<br>请将手放在摄像头前';

                // 显示提示
                setTimeout(() => {
                    hints.classList.remove('hidden');
                    setTimeout(() => hints.classList.add('hidden'), 5000);
                }, 1000);

            } catch (error) {
                console.error('初始化手势追踪失败:', error);
                cameraStatus.className = 'error';
                cameraStatus.innerHTML = '❌ 无法访问摄像头<br>请检查权限设置';
            }
        }

        // ==================== 处理手势识别结果 ====================
        function onHandResults(results) {
            // 清空 canvas
            const ctx = handCanvas.getContext('2d');
            ctx.clearRect(0, 0, handCanvas.width, handCanvas.height);

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0];

                // 绘制手部骨架
                drawConnectors(ctx, landmarks, HAND_CONNECTIONS, {
                    color: '#00FF00',
                    lineWidth: 2
                });
                drawLandmarks(ctx, landmarks, {
                    color: '#FF0000',
                    lineWidth: 1,
                    radius: 3
                });

                // 获取手掌中心位置（关键点 9 - 中指根部）
                const palmCenter = landmarks[9];
                const canvasWidth = gameCanvas.clientWidth;
                const canvasHeight = gameCanvas.clientHeight;

                // 将手部位置映射到游戏画布（镜像翻转）
                handState.previousPosition = { ...handState.position };
                handState.position = {
                    x: canvasWidth - (palmCenter.x * canvasWidth),
                    y: palmCenter.y * canvasHeight
                };

                // 计算速度
                handState.velocity = {
                    x: handState.position.x - handState.previousPosition.x,
                    y: handState.position.y - handState.previousPosition.y
                };

                // 检测抓取手势（手指是否弯曲）
                const isGrabbing = detectGrabGesture(landmarks);

                if (isGrabbing && !handState.isGrabbing) {
                    // 开始抓取
                    tryGrabItem();
                    gestureStatus.textContent = '✊';
                } else if (!isGrabbing && handState.isGrabbing) {
                    // 释放物品
                    releaseItem();
                    gestureStatus.textContent = '🖐️';
                }

                handState.isGrabbing = isGrabbing;

                // 如果正在抓取物品，更新物品位置
                if (grabbedItem) {
                    Body.setPosition(grabbedItem, handState.position);
                    Body.setVelocity(grabbedItem, { x: 0, y: 0 });
                }
            } else {
                gestureStatus.textContent = '❓';
            }
        }

        // ==================== 检测抓取手势 ====================
        function detectGrabGesture(landmarks) {
            // 检测手指是否弯曲（除了大拇指）
            // 比较指尖和指根的 y 坐标
            const fingerTips = [8, 12, 16, 20]; // 食指、中指、无名指、小指的指尖
            const fingerBases = [6, 10, 14, 18]; // 对应的指根

            let bentFingers = 0;
            for (let i = 0; i < fingerTips.length; i++) {
                const tip = landmarks[fingerTips[i]];
                const base = landmarks[fingerBases[i]];

                // 如果指尖比指根更低（y 值更大），说明手指弯曲
                if (tip.y > base.y) {
                    bentFingers++;
                }
            }

            // 至少 3 根手指弯曲才算抓取
            return bentFingers >= 3;
        }

        // ==================== 尝试抓取物品 ====================
        function tryGrabItem() {
            const grabRadius = 100;

            for (let item of items) {
                const dx = item.position.x - handState.position.x;
                const dy = item.position.y - handState.position.y;
                const distance = Math.sqrt(dx * dx + dy * dy);

                if (distance < grabRadius) {
                    grabbedItem = item;
                    Body.setStatic(grabbedItem, true); // 暂时设为静态
                    break;
                }
            }
        }

        // ==================== 释放物品 ====================
        function releaseItem() {
            if (grabbedItem) {
                Body.setStatic(grabbedItem, false);

                // 根据手势速度施加力
                const speed = Math.sqrt(
                    handState.velocity.x ** 2 +
                    handState.velocity.y ** 2
                );

                if (speed > 5) {
                    // 投掷
                    Body.setVelocity(grabbedItem, {
                        x: handState.velocity.x * 0.5,
                        y: handState.velocity.y * 0.5
                    });
                }

                grabbedItem = null;
            }
        }

        // ==================== 重置游戏 ====================
        function resetGame() {
            // 移除所有物品
            items.forEach(item => World.remove(world, item));
            items = [];

            // 重置分数
            score = 0;
            combo = 0;
            scoreElement.textContent = score;
            comboElement.textContent = combo;

            // 添加新物品
            addRandomItem();
            addRandomItem();
            addRandomItem();
        }

        // ==================== 事件监听 ====================
        startBtn.addEventListener('click', async () => {
            startScreen.classList.add('hidden');
            gameContainer.style.display = 'flex';

            // 初始化
            setTimeout(() => {
                // 设置 canvas 尺寸
                handCanvas.width = inputVideo.videoWidth || 640;
                handCanvas.height = inputVideo.videoHeight || 480;

                initPhysics();
                initHandTracking();
            }, 100);
        });

        resetBtn.addEventListener('click', resetGame);
        addItemBtn.addEventListener('click', addRandomItem);

        // ==================== 窗口大小调整 ====================
        window.addEventListener('resize', () => {
            if (render) {
                const canvasWidth = gameCanvas.clientWidth;
                const canvasHeight = gameCanvas.clientHeight;

                render.canvas.width = canvasWidth;
                render.canvas.height = canvasHeight;
                render.options.width = canvasWidth;
                render.options.height = canvasHeight;
            }
        });
    </script>
</body>
</html>
