<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>绣湖之谜 - Rusty Lake Mystery</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #e8e8e8;
            min-height: 100vh;
            padding: 20px;
            overflow-x: hidden;
        }

        .game-container {
            max-width: 1200px;
            margin: 0 auto;
            background: rgba(26, 26, 46, 0.9);
            border: 3px solid #8b7355;
            border-radius: 10px;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8), inset 0 0 50px rgba(0, 0, 0, 0.5);
            padding: 30px;
        }

        h1 {
            text-align: center;
            font-size: 42px;
            color: #c9a56f;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.8);
            margin-bottom: 10px;
            letter-spacing: 3px;
            font-family: 'Georgia', serif;
        }

        .subtitle {
            text-align: center;
            color: #8b7355;
            font-style: italic;
            margin-bottom: 30px;
            font-size: 16px;
        }

        .game-layout {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }

        .main-panel {
            background: rgba(22, 33, 62, 0.7);
            border: 2px solid #5a4a3a;
            border-radius: 8px;
            padding: 20px;
        }

        .side-panel {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .panel {
            background: rgba(22, 33, 62, 0.7);
            border: 2px solid #5a4a3a;
            border-radius: 8px;
            padding: 15px;
        }

        .panel-title {
            font-size: 20px;
            color: #c9a56f;
            border-bottom: 2px solid #5a4a3a;
            padding-bottom: 10px;
            margin-bottom: 15px;
            font-weight: bold;
        }

        .room-description {
            line-height: 1.8;
            color: #d4d4d4;
            text-align: justify;
            margin-bottom: 20px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 5px;
            border-left: 4px solid #8b7355;
        }

        .items-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-top: 15px;
        }

        .item-btn {
            background: linear-gradient(145deg, #3a2f2a, #2a1f1a);
            color: #c9a56f;
            border: 2px solid #5a4a3a;
            padding: 12px;
            border-radius: 5px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            transition: all 0.3s;
            position: relative;
        }

        .item-btn:hover {
            background: linear-gradient(145deg, #4a3f3a, #3a2f2a);
            border-color: #c9a56f;
            box-shadow: 0 0 15px rgba(201, 165, 111, 0.3);
            transform: translateY(-2px);
        }

        .item-btn.checked {
            background: linear-gradient(145deg, #2a3f2a, #1a2f1a);
            border-color: #5a7a5a;
        }

        .inventory-list {
            min-height: 100px;
        }

        .inventory-item {
            background: rgba(201, 165, 111, 0.1);
            border: 1px solid #8b7355;
            padding: 10px;
            margin-bottom: 8px;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .inventory-item:hover {
            background: rgba(201, 165, 111, 0.2);
            border-color: #c9a56f;
            transform: translateX(5px);
        }

        .use-btn {
            background: #5a4a3a;
            color: #c9a56f;
            border: none;
            padding: 5px 12px;
            border-radius: 3px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s;
        }

        .use-btn:hover {
            background: #6a5a4a;
            box-shadow: 0 0 10px rgba(201, 165, 111, 0.5);
        }

        .message-log {
            max-height: 200px;
            overflow-y: auto;
            padding: 10px;
            background: rgba(0, 0, 0, 0.4);
            border-radius: 5px;
        }

        .message {
            margin-bottom: 8px;
            padding: 8px;
            border-left: 3px solid #5a4a3a;
            background: rgba(22, 33, 62, 0.5);
            border-radius: 3px;
            animation: messageSlide 0.3s ease-out;
        }

        @keyframes messageSlide {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .message.warning {
            border-left-color: #a0522d;
            color: #ffb366;
        }

        .message.success {
            border-left-color: #4a8a4a;
            color: #90ee90;
        }

        .message.mystery {
            border-left-color: #8b4789;
            color: #dda0dd;
        }

        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .action-btn {
            flex: 1;
            background: linear-gradient(145deg, #5a4a3a, #4a3a2a);
            color: #c9a56f;
            border: 2px solid #8b7355;
            padding: 12px;
            border-radius: 5px;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.3s;
        }

        .action-btn:hover {
            background: linear-gradient(145deg, #6a5a4a, #5a4a3a);
            box-shadow: 0 0 20px rgba(201, 165, 111, 0.4);
            transform: scale(1.05);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            border: 4px solid #c9a56f;
            border-radius: 10px;
            padding: 40px;
            max-width: 600px;
            text-align: center;
            box-shadow: 0 0 50px rgba(201, 165, 111, 0.6);
            animation: modalAppear 0.5s ease-out;
        }

        @keyframes modalAppear {
            from {
                opacity: 0;
                transform: scale(0.8);
            }
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        .modal-content h2 {
            color: #c9a56f;
            font-size: 36px;
            margin-bottom: 20px;
            font-family: 'Georgia', serif;
        }

        .modal-content p {
            color: #d4d4d4;
            line-height: 1.8;
            font-size: 18px;
        }

        .stats {
            display: flex;
            justify-content: space-around;
            margin-top: 15px;
            padding: 10px;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 5px;
        }

        .stat {
            text-align: center;
        }

        .stat-label {
            color: #8b7355;
            font-size: 12px;
        }

        .stat-value {
            color: #c9a56f;
            font-size: 18px;
            font-weight: bold;
        }

        .empty-state {
            text-align: center;
            color: #8b7355;
            font-style: italic;
            padding: 20px;
        }

        /* 滚动条样式 */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.3);
        }

        ::-webkit-scrollbar-thumb {
            background: #5a4a3a;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #6a5a4a;
        }

        /* 响应式设计 */
        @media (max-width: 768px) {
            .game-layout {
                grid-template-columns: 1fr;
            }

            h1 {
                font-size: 32px;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>🌙 绣湖之谜 🌙</h1>
        <p class="subtitle">The Mystery of Rusty Lake - 维多利亚时代的神秘房间</p>

        <div class="game-layout">
            <!-- 主面板 -->
            <div class="main-panel">
                <div class="panel-title">📜 房间描述</div>
                <div class="room-description" id="roomDescription"></div>

                <div class="panel-title">🔍 房间物品</div>
                <div class="items-grid" id="itemsGrid"></div>

                <div class="action-buttons">
                    <button class="action-btn" onclick="game.triggerRandomEvent()">🎲 等待...</button>
                    <button class="action-btn" onclick="game.saveGame()">💾 保存游戏</button>
                    <button class="action-btn" onclick="game.loadGame()">📂 加载游戏</button>
                </div>
            </div>

            <!-- 侧边面板 -->
            <div class="side-panel">
                <!-- 背包 -->
                <div class="panel">
                    <div class="panel-title">🎒 背包</div>
                    <div class="inventory-list" id="inventoryList"></div>
                </div>

                <!-- 统计 -->
                <div class="panel">
                    <div class="panel-title">📊 游戏状态</div>
                    <div class="stats">
                        <div class="stat">
                            <div class="stat-label">物品数量</div>
                            <div class="stat-value" id="itemCount">0</div>
                        </div>
                        <div class="stat">
                            <div class="stat-label">已解谜题</div>
                            <div class="stat-value" id="puzzleCount">0/4</div>
                        </div>
                    </div>
                </div>

                <!-- 消息日志 -->
                <div class="panel">
                    <div class="panel-title">📰 消息日志</div>
                    <div class="message-log" id="messageLog"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- 胜利模态框 -->
    <div class="modal" id="victoryModal">
        <div class="modal-content">
            <h2>🎉 恭喜通关！🎉</h2>
            <p>你成功找到了传说中的黑色方块...</p>
            <p style="margin-top: 20px; color: #8b7355;">但这仅仅是绣湖系列的开始...</p>
            <p style="margin-top: 20px; font-style: italic; color: #dda0dd;">"记忆是一种奇特的东西，它既是钥匙，也是囚笼。"</p>
        </div>
    </div>

    <script>
        // 绣湖风格解谜游戏核心类
        class RustyLakeGame {
            constructor() {
                // 房间物品定义
                this.items = {
                    portrait: {
                        name: '神秘肖像画',
                        description: '墙上挂着一幅维多利亚时代的肖像画，画中是一位神情忧郁的绅士。他的眼睛似乎在注视着你...',
                        checked: false,
                        interactions: 0,
                        messages: [
                            '肖像画中的人物似乎在对你微笑...',
                            '你注意到画框后面有些异样...',
                            '画框后面掉出了一把古旧的钥匙！'
                        ]
                    },
                    clock: {
                        name: '古董时钟',
                        description: '一座宏伟的落地钟，但时针已经停止不动。仔细看，缺少了关键的齿轮。',
                        checked: false,
                        needsItem: 'gear',
                        interactions: 0,
                        messages: [
                            '时钟静静地立在那里，时间仿佛凝固了...',
                            '你需要找到齿轮来修复它...'
                        ],
                        repairedMessage: '你将齿轮安装到时钟上，钟声响起！时钟背后的暗格打开了，里面有一张纸条...'
                    },
                    desk: {
                        name: '老旧书桌',
                        description: '一张维多利亚风格的红木书桌，抽屉上有一把精致的锁。',
                        checked: false,
                        locked: true,
                        needsItem: 'key',
                        interactions: 0,
                        messages: [
                            '书桌的抽屉紧锁着，你需要钥匙...',
                            '书桌表面布满了岁月的痕迹...'
                        ],
                        unlockedMessage: '钥匙完美地插入锁孔！抽屉打开了，里面有一个精密的齿轮！'
                    },
                    cabinet: {
                        name: '神秘柜子',
                        description: '一个雕刻着奇异符号的黑色柜子，上面有一个三位数的密码锁。',
                        checked: false,
                        locked: true,
                        needsCode: true,
                        code: '376',
                        interactions: 0,
                        messages: [
                            '柜子上的符号似乎在诉说某种古老的秘密...',
                            '密码锁等待着正确的数字组合...'
                        ],
                        unlockedMessage: '密码正确！柜门缓缓打开，一道诡异的光芒从中透出...里面静静躺着一个黑色方块！'
                    },
                    mirror: {
                        name: '古老镜子',
                        description: '一面巨大的镜子，镜面上隐约显现出奇怪的符文。',
                        checked: false,
                        interactions: 0,
                        messages: [
                            '镜子里映出的不只是你的倒影...',
                            '你看到镜中的房间似乎有些不同...',
                            '镜子表面泛起涟漪，又恢复平静...'
                        ]
                    },
                    window: {
                        name: '窗户',
                        description: '窗外是浓密的雾气，什么也看不清。偶尔有黑色的影子飘过。',
                        checked: false,
                        interactions: 0,
                        messages: [
                            '雾气中似乎有什么东西在移动...',
                            '你看到一只乌鸦停在窗台上，盯着你看...',
                            '窗外传来诡异的风声...'
                        ]
                    },
                    bookshelf: {
                        name: '书架',
                        description: '一个装满古籍的高大书架，散发着霉味和岁月的气息。',
                        checked: false,
                        interactions: 0,
                        messages: [
                            '书架上的书籍都用一种古老的文字书写...',
                            '你翻开一本书，里面夹着一张褪色的照片...',
                            '某本书的封面上写着："真相藏在时间之中"...'
                        ]
                    },
                    fireplace: {
                        name: '壁炉',
                        description: '一个熄灭已久的壁炉，灰烬中还残留着未燃尽的木炭。',
                        checked: false,
                        interactions: 0,
                        messages: [
                            '壁炉里的灰烬已经冰凉...',
                            '你在灰烬中发现了一些奇怪的痕迹...',
                            '壁炉深处似乎有什么东西在反光...'
                        ]
                    }
                };

                // 玩家背包
                this.inventory = [];

                // 谜题状态追踪
                this.puzzleStates = {
                    portraitSolved: false,      // 肖像画谜题
                    deskUnlocked: false,        // 书桌解锁
                    clockRepaired: false,       // 时钟修复
                    cabinetUnlocked: false      // 柜子解锁
                };

                // 游戏状态
                this.gameState = {
                    gameWon: false,
                    mysteryEvents: 0,
                    totalInteractions: 0
                };

                // 随机神秘事件列表
                this.mysteryEvents = [
                    '你听到远处传来钢琴声...',
                    '房间的温度突然下降了几度...',
                    '墙上的影子似乎有了生命...',
                    '你闻到一股淡淡的玫瑰香气...',
                    '耳边传来若有若无的呢喃声...',
                    '灯光闪烁了一下，又恢复正常...',
                    '你感觉有人在背后看着你，但回头什么也没有...',
                    '时钟滴答声突然变得格外清晰...',
                    '镜子里的倒影慢了半拍...',
                    '窗外的乌鸦叫了三声...'
                ];

                this.init();
            }

            // 初始化游戏
            init() {
                this.renderRoom();
                this.renderItems();
                this.renderInventory();
                this.updateStats();
                this.addMessage('欢迎来到绣湖之谜...', 'mystery');
                this.addMessage('你醒来发现自己在一个陌生的维多利亚风格房间中。', 'warning');
                this.addMessage('你需要找到黑色方块才能逃离这里...', 'warning');
            }

            // 渲染房间描述
            renderRoom() {
                const roomDesc = document.getElementById('roomDescription');
                roomDesc.innerHTML = `
                    <p>你身处一个装饰华丽但略显诡异的维多利亚风格房间中。墙壁上铺着暗红色的壁纸，
                    上面是复杂的哥特式花纹。厚重的深色窗帘半遮半掩着窗户，只有微弱的光线透进来。</p>
                    <p style="margin-top: 10px;">房间里弥漫着一股陈旧的气味，混合着木头、书籍和某种难以名状的神秘气息。
                    你能感觉到这个房间隐藏着许多秘密...</p>
                `;
            }

            // 渲染物品按钮
            renderItems() {
                const grid = document.getElementById('itemsGrid');
                grid.innerHTML = '';

                for (let [key, item] of Object.entries(this.items)) {
                    const btn = document.createElement('button');
                    btn.className = 'item-btn' + (item.checked ? ' checked' : '');
                    btn.textContent = item.name;
                    btn.onclick = () => this.examineItem(key);
                    grid.appendChild(btn);
                }
            }

            // 检查物品
            examineItem(itemKey) {
                const item = this.items[itemKey];

                if (!item.checked) {
                    item.checked = true;
                    this.addMessage(`你仔细检查了${item.name}...`, 'success');
                    this.addMessage(item.description);
                } else {
                    this.addMessage(`你再次检查了${item.name}...`);
                }

                // 处理特定物品的互动
                this.handleItemInteraction(itemKey);

                this.gameState.totalInteractions++;
                this.renderItems();
                this.updateStats();
            }

            // 处理物品互动逻辑
            handleItemInteraction(itemKey) {
                const item = this.items[itemKey];
                item.interactions++;

                switch(itemKey) {
                    case 'portrait':
                        if (item.interactions <= item.messages.length) {
                            this.addMessage(item.messages[item.interactions - 1], 'warning');
                            if (item.interactions === 3 && !this.puzzleStates.portraitSolved) {
                                this.inventory.push({name: '古旧钥匙', id: 'key'});
                                this.puzzleStates.portraitSolved = true;
                                this.addMessage('你获得了：古旧钥匙', 'success');
                                this.renderInventory();
                            }
                        }
                        break;

                    case 'desk':
                        if (item.locked) {
                            if (item.interactions <= item.messages.length) {
                                this.addMessage(item.messages[item.interactions - 1], 'warning');
                            }
                        }
                        break;

                    case 'clock':
                        if (!this.puzzleStates.clockRepaired) {
                            if (item.interactions <= item.messages.length) {
                                this.addMessage(item.messages[item.interactions - 1], 'warning');
                            }
                        }
                        break;

                    case 'cabinet':
                        if (item.locked) {
                            if (item.interactions <= item.messages.length) {
                                this.addMessage(item.messages[item.interactions - 1], 'warning');
                            }
                        }
                        break;

                    case 'mirror':
                    case 'window':
                    case 'bookshelf':
                    case 'fireplace':
                        const msgIndex = (item.interactions - 1) % item.messages.length;
                        this.addMessage(item.messages[msgIndex], 'mystery');
                        break;
                }
            }

            // 渲染背包
            renderInventory() {
                const list = document.getElementById('inventoryList');

                if (this.inventory.length === 0) {
                    list.innerHTML = '<div class="empty-state">背包空空如也...</div>';
                    return;
                }

                list.innerHTML = '';
                this.inventory.forEach(item => {
                    const div = document.createElement('div');
                    div.className = 'inventory-item';
                    div.innerHTML = `
                        <span>${item.name}</span>
                        <button class="use-btn" onclick="game.useItem('${item.id}')">使用</button>
                    `;
                    list.appendChild(div);
                });

                this.updateStats();
            }

            // 使用物品
            useItem(itemId) {
                const item = this.inventory.find(i => i.id === itemId);
                if (!item) return;

                switch(itemId) {
                    case 'key':
                        if (!this.puzzleStates.deskUnlocked) {
                            this.addMessage('你使用了古旧钥匙...', 'success');
                            this.addMessage(this.items.desk.unlockedMessage, 'success');
                            this.items.desk.locked = false;
                            this.puzzleStates.deskUnlocked = true;

                            // 获得齿轮
                            this.inventory.push({name: '精密齿轮', id: 'gear'});
                            this.addMessage('你获得了：精密齿轮', 'success');

                            // 移除钥匙
                            this.inventory = this.inventory.filter(i => i.id !== 'key');
                            this.renderInventory();
                        } else {
                            this.addMessage('书桌已经打开了...', 'warning');
                        }
                        break;

                    case 'gear':
                        if (!this.puzzleStates.clockRepaired) {
                            this.addMessage('你使用了精密齿轮...', 'success');
                            this.addMessage(this.items.clock.repairedMessage, 'success');
                            this.puzzleStates.clockRepaired = true;

                            // 获得密码纸条
                            this.inventory.push({name: '褪色纸条', id: 'code_paper', code: '376'});
                            this.addMessage('你获得了：褪色纸条（上面写着：376）', 'success');

                            // 移除齿轮
                            this.inventory = this.inventory.filter(i => i.id !== 'gear');
                            this.renderInventory();
                        } else {
                            this.addMessage('时钟已经修复了...', 'warning');
                        }
                        break;

                    case 'code_paper':
                        if (!this.puzzleStates.cabinetUnlocked) {
                            const code = prompt('请输入密码纸条上的三位数字：');
                            if (code === this.items.cabinet.code) {
                                this.addMessage('你输入了密码：' + code, 'success');
                                this.addMessage(this.items.cabinet.unlockedMessage, 'success');
                                this.puzzleStates.cabinetUnlocked = true;
                                this.items.cabinet.locked = false;

                                // 获得黑色方块
                                this.inventory.push({name: '神秘黑色方块', id: 'black_cube'});
                                this.addMessage('你获得了：神秘黑色方块', 'success');

                                // 移除纸条
                                this.inventory = this.inventory.filter(i => i.id !== 'code_paper');
                                this.renderInventory();

                                // 游戏胜利
                                setTimeout(() => this.checkVictory(), 1000);
                            } else {
                                this.addMessage('密码错误！柜子依然紧锁着...', 'warning');
                            }
                        } else {
                            this.addMessage('柜子已经打开了...', 'warning');
                        }
                        break;

                    case 'black_cube':
                        this.addMessage('黑色方块在你手中微微发光...', 'mystery');
                        this.addMessage('你感觉到一股强大的力量...', 'mystery');
                        break;
                }
            }

            // 触发随机神秘事件
            triggerRandomEvent() {
                const event = this.mysteryEvents[Math.floor(Math.random() * this.mysteryEvents.length)];
                this.addMessage(event, 'mystery');
                this.gameState.mysteryEvents++;

                // 小概率触发特殊提示
                if (Math.random() < 0.2) {
                    const hints = [
                        '肖像画似乎知道些什么...',
                        '时间的秘密藏在时钟中...',
                        '数字376不断在你脑海中回响...',
                        '钥匙是一切的开始...'
                    ];
                    const hint = hints[Math.floor(Math.random() * hints.length)];
                    setTimeout(() => this.addMessage(hint, 'warning'), 1000);
                }
            }

            // 添加消息
            addMessage(text, type = 'normal') {
                const log = document.getElementById('messageLog');
                const msg = document.createElement('div');
                msg.className = 'message' + (type !== 'normal' ? ' ' + type : '');
                msg.textContent = text;
                log.appendChild(msg);
                log.scrollTop = log.scrollHeight;
            }

            // 更新统计
            updateStats() {
                document.getElementById('itemCount').textContent = this.inventory.length;

                const solvedPuzzles = Object.values(this.puzzleStates).filter(v => v).length;
                document.getElementById('puzzleCount').textContent = `${solvedPuzzles}/4`;
            }

            // 检查胜利条件
            checkVictory() {
                if (this.inventory.some(item => item.id === 'black_cube')) {
                    this.gameState.gameWon = true;
                    this.addMessage('', 'success');
                    this.addMessage('🎉 你找到了黑色方块！游戏通关！🎉', 'success');

                    setTimeout(() => {
                        document.getElementById('victoryModal').style.display = 'flex';
                    }, 1500);
                }
            }

            // 保存游戏
            saveGame() {
                const saveData = {
                    items: this.items,
                    inventory: this.inventory,
                    puzzleStates: this.puzzleStates,
                    gameState: this.gameState
                };

                localStorage.setItem('rustyLakeSave', JSON.stringify(saveData));
                this.addMessage('游戏已保存！', 'success');
            }

            // 加载游戏
            loadGame() {
                const saveData = localStorage.getItem('rustyLakeSave');

                if (!saveData) {
                    this.addMessage('没有找到存档...', 'warning');
                    return;
                }

                const data = JSON.parse(saveData);
                this.items = data.items;
                this.inventory = data.inventory;
                this.puzzleStates = data.puzzleStates;
                this.gameState = data.gameState;

                this.renderItems();
                this.renderInventory();
                this.updateStats();
                this.addMessage('游戏已加载！', 'success');

                if (this.gameState.gameWon) {
                    this.addMessage('你已经通关了这个游戏！', 'mystery');
                }
            }
        }

        // 初始化游戏
        let game;
        window.onload = () => {
            game = new RustyLakeGame();
        };
    </script>
</body>
</html>
