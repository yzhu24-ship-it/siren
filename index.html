<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rusty Lake Mystery - The Black Cube</title>
    <!-- Version 3.0 - Visual Image-Based Interface -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: #0a0a0a;
            color: #e8e8e8;
            overflow: hidden;
            height: 100vh;
        }

        .game-layout {
            display: flex;
            height: 100vh;
            width: 100vw;
        }

        /* Main view area - 75% width */
        .main-view {
            flex: 0 0 75%;
            position: relative;
            background: linear-gradient(180deg, #a8d8f0 0%, #b8e8ff 100%);
            display: flex;
            flex-direction: column;
        }

        .wall-container {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .wall {
            width: 100%;
            height: 100%;
            position: absolute;
            display: none;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .wall.active {
            display: block;
        }

        /* Navigation arrows */
        .nav-arrows {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 40px;
            z-index: 100;
        }

        .nav-btn {
            width: 50px;
            height: 50px;
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid #8b7355;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: #c9a56f;
            transition: all 0.3s;
            user-select: none;
        }

        .nav-btn:hover {
            background: rgba(0, 0, 0, 0.7);
            box-shadow: 0 0 15px rgba(201, 165, 111, 0.5);
            transform: scale(1.1);
        }

        .wall-indicator {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 20px;
            border-radius: 20px;
            border: 2px solid #8b7355;
            color: #c9a56f;
            font-size: 16px;
            z-index: 100;
        }

        /* Right side panel - 25% width */
        .right-panel {
            flex: 0 0 25%;
            background: linear-gradient(180deg, #1a1a2e 0%, #16213e 100%);
            border-left: 3px solid #8b7355;
            display: flex;
            flex-direction: column;
            padding: 20px;
            overflow-y: auto;
        }

        .panel-header {
            text-align: center;
            font-size: 24px;
            color: #c9a56f;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
        }

        .clues-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }

        .clue-box {
            aspect-ratio: 1;
            border: 2px solid #8b7355;
            border-radius: 10px;
            background: rgba(26, 26, 46, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            transition: all 0.3s;
        }

        .clue-box.empty {
            border-style: dashed;
            opacity: 0.4;
        }

        .clue-box.filled {
            border-color: #c9a56f;
            box-shadow: 0 0 15px rgba(201, 165, 111, 0.3);
        }

        .clue-box.new-item {
            animation: itemPulse 1s ease-in-out;
        }

        @keyframes itemPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); box-shadow: 0 0 25px rgba(201, 165, 111, 0.8); }
        }

        .clue-image {
            width: 90%;
            height: 90%;
            object-fit: contain;
        }

        .clue-text {
            text-align: center;
            padding: 10px;
            font-size: 12px;
            color: #c9a56f;
            word-wrap: break-word;
        }

        .clue-icon {
            font-size: 40px;
        }

        /* Event log */
        .event-log {
            flex: 1;
            border: 2px solid #8b7355;
            border-radius: 10px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.5);
            overflow-y: auto;
            max-height: 200px;
        }

        .log-title {
            color: #c9a56f;
            font-size: 14px;
            margin-bottom: 10px;
            text-align: center;
        }

        .log-message {
            padding: 5px;
            margin: 5px 0;
            font-size: 12px;
            border-left: 2px solid #8b7355;
            padding-left: 10px;
            animation: fadeIn 0.5s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateX(-10px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .log-message.important {
            color: #90ff90;
            border-left-color: #90ff90;
        }

        .log-message.error {
            color: #ff6b6b;
            border-left-color: #ff6b6b;
        }

        /* Clickable hotspots on walls */
        .hotspot {
            position: absolute;
            cursor: pointer;
            transition: all 0.3s;
            border: 3px solid transparent;
            border-radius: 5px;
        }

        .hotspot:hover {
            border-color: rgba(201, 165, 111, 0.8);
            box-shadow: 0 0 20px rgba(201, 165, 111, 0.6);
            transform: scale(1.05);
        }

        .hotspot.selected {
            border-color: #90ff90;
            animation: hotspotGlow 1.5s infinite;
        }

        @keyframes hotspotGlow {
            0%, 100% { box-shadow: 0 0 15px rgba(144, 255, 144, 0.6); }
            50% { box-shadow: 0 0 30px rgba(144, 255, 144, 1); }
        }

        /* Modal for detailed views */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            border: 3px solid #8b7355;
            border-radius: 15px;
            padding: 40px;
            max-width: 600px;
            max-height: 80vh;
            overflow-y: auto;
            position: relative;
        }

        .modal-close {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 30px;
            cursor: pointer;
            color: #c9a56f;
            border: none;
            background: none;
        }

        .modal-close:hover {
            color: #ff6b6b;
        }

        .modal-title {
            font-size: 28px;
            color: #c9a56f;
            margin-bottom: 20px;
            text-align: center;
        }

        .modal-description {
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 20px;
            color: #e8e8e8;
        }

        .modal-input {
            width: 100%;
            padding: 15px;
            font-size: 18px;
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid #8b7355;
            border-radius: 5px;
            color: #c9a56f;
            text-align: center;
            font-family: 'Courier New', monospace;
            margin: 20px 0;
        }

        .modal-btn {
            width: 100%;
            padding: 15px;
            font-size: 18px;
            background: #8b7355;
            border: none;
            border-radius: 5px;
            color: #fff;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            margin-top: 10px;
            transition: all 0.3s;
        }

        .modal-btn:hover {
            background: #a88866;
            box-shadow: 0 0 15px rgba(139, 115, 85, 0.6);
        }

        .modal-btn:disabled {
            background: #555;
            cursor: not-allowed;
            opacity: 0.5;
        }

        /* Control buttons */
        .controls {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
            z-index: 100;
        }

        .control-btn {
            padding: 10px 20px;
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid #8b7355;
            border-radius: 5px;
            color: #c9a56f;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            transition: all 0.3s;
        }

        .control-btn:hover {
            background: rgba(0, 0, 0, 0.9);
            box-shadow: 0 0 10px rgba(139, 115, 85, 0.6);
        }

        /* Cabinet/Furniture styles */
        .furniture-view {
            width: 100%;
            max-width: 500px;
            margin: 20px auto;
            text-align: center;
        }

        .furniture-image {
            width: 100%;
            height: auto;
            border: 2px solid #8b7355;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .lock-icon {
            font-size: 60px;
            margin: 20px 0;
        }

        /* Wall placeholder backgrounds */
        .wall-1 {
            background: linear-gradient(180deg, #a8d8f0 0%, #b8e8ff 50%, #a8d8f0 100%);
        }

        .wall-2 {
            background: linear-gradient(180deg, #a8d8f0 0%, #b8e8ff 50%, #a8d8f0 100%);
        }

        .wall-3 {
            background: linear-gradient(180deg, #a8d8f0 0%, #b8e8ff 50%, #a8d8f0 100%);
        }

        .wall-4 {
            background: linear-gradient(180deg, #a8d8f0 0%, #b8e8ff 50%, #a8d8f0 100%);
            position: relative;
        }

        .wall-4::after {
            content: 'Empty Wall';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 36px;
            color: rgba(0, 0, 0, 0.1);
        }

        /* Placeholder objects drawn with CSS */
        .portrait-placeholder {
            width: 200px;
            height: 280px;
            background: linear-gradient(135deg, #3a2f24 0%, #5a4a3a 100%);
            border: 10px solid #d4a574;
            box-shadow: inset 0 0 30px rgba(0, 0, 0, 0.5);
            position: relative;
        }

        .portrait-placeholder::before {
            content: '🖼️';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 80px;
        }

        .window-placeholder {
            width: 180px;
            height: 240px;
            background: linear-gradient(135deg, #e8e8e8 0%, #c0c0c0 100%);
            border: 8px solid #a0a0a0;
            position: relative;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.3);
        }

        .window-placeholder::before {
            content: '';
            position: absolute;
            top: 0;
            left: 50%;
            width: 2px;
            height: 100%;
            background: #888;
            transform: translateX(-50%);
        }

        .window-placeholder::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            width: 100%;
            height: 2px;
            background: #888;
            transform: translateY(-50%);
        }

        .desk-placeholder {
            width: 300px;
            height: 200px;
            background: linear-gradient(180deg, #c9964a 0%, #d4a574 50%, #b88644 100%);
            border: 5px solid #8b6935;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            position: relative;
        }

        .desk-placeholder::before {
            content: '🗄️';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 60px;
        }

        .cabinet-placeholder {
            width: 180px;
            height: 280px;
            background: linear-gradient(135deg, #d4a574 0%, #c9964a 100%);
            border: 6px solid #8b6935;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            position: relative;
        }

        .cabinet-placeholder::before {
            content: '🚪';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 80px;
        }

        .clock-placeholder {
            width: 150px;
            height: 200px;
            background: linear-gradient(135deg, #8b6935 0%, #a88550 100%);
            border: 5px solid #6b4f25;
            border-radius: 50% 50% 10px 10px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.4);
            position: relative;
        }

        .clock-placeholder::before {
            content: '🕐';
            position: absolute;
            top: 40%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 60px;
        }
    </style>
</head>
<body>
    <div class="game-layout">
        <!-- Main view area -->
        <div class="main-view">
            <div class="wall-indicator">Wall <span id="wallNumber">1</span> of 4</div>

            <div class="controls">
                <button class="control-btn" onclick="game.saveGame()">💾 Save</button>
                <button class="control-btn" onclick="game.loadGame()">📂 Load</button>
            </div>

            <div class="wall-container">
                <!-- Wall 1: Portrait and Window -->
                <div class="wall wall-1 active" id="wall-1">
                    <!-- Portrait hotspot (upper center) -->
                    <div class="hotspot portrait-placeholder"
                         style="position: absolute; top: 15%; left: 50%; transform: translateX(-50%);"
                         onclick="game.clickHotspot('portrait')"
                         id="hotspot-portrait">
                    </div>

                    <!-- Window hotspot (right side) -->
                    <div class="hotspot window-placeholder"
                         style="position: absolute; top: 25%; right: 15%;"
                         onclick="game.clickHotspot('window')"
                         id="hotspot-window">
                    </div>
                </div>

                <!-- Wall 2: Desk -->
                <div class="wall wall-2" id="wall-2">
                    <!-- Desk hotspot (center-bottom) -->
                    <div class="hotspot desk-placeholder"
                         style="position: absolute; bottom: 20%; left: 50%; transform: translateX(-50%);"
                         onclick="game.clickHotspot('desk')"
                         id="hotspot-desk">
                    </div>
                </div>

                <!-- Wall 3: Clock and Cabinet -->
                <div class="wall wall-3" id="wall-3">
                    <!-- Clock hotspot (left side) -->
                    <div class="hotspot clock-placeholder"
                         style="position: absolute; top: 20%; left: 20%;"
                         onclick="game.clickHotspot('clock')"
                         id="hotspot-clock">
                    </div>

                    <!-- Cabinet hotspot (right side) -->
                    <div class="hotspot cabinet-placeholder"
                         style="position: absolute; top: 25%; right: 15%;"
                         onclick="game.clickHotspot('cabinet')"
                         id="hotspot-cabinet">
                    </div>
                </div>

                <!-- Wall 4: Empty -->
                <div class="wall wall-4" id="wall-4">
                    <!-- This wall is empty as specified -->
                </div>
            </div>

            <!-- Navigation arrows -->
            <div class="nav-arrows">
                <div class="nav-btn" onclick="game.previousWall()">◀</div>
                <div class="nav-btn" onclick="game.nextWall()">▶</div>
            </div>
        </div>

        <!-- Right panel for clues -->
        <div class="right-panel">
            <div class="panel-header">🔍 Clues & Items</div>
            <div class="clues-grid" id="cluesGrid">
                <!-- 8 clue boxes -->
                <div class="clue-box empty" id="clue-0"></div>
                <div class="clue-box empty" id="clue-1"></div>
                <div class="clue-box empty" id="clue-2"></div>
                <div class="clue-box empty" id="clue-3"></div>
                <div class="clue-box empty" id="clue-4"></div>
                <div class="clue-box empty" id="clue-5"></div>
                <div class="clue-box empty" id="clue-6"></div>
                <div class="clue-box empty" id="clue-7"></div>
            </div>

            <div class="event-log">
                <div class="log-title">📰 Event Log</div>
                <div id="logContainer"></div>
            </div>
        </div>
    </div>

    <!-- Modal for interactions -->
    <div class="modal" id="modal">
        <div class="modal-content">
            <button class="modal-close" onclick="game.closeModal()">×</button>
            <div id="modalBody"></div>
        </div>
    </div>

    <script>
        class RustyLakeGame {
            constructor() {
                this.currentWall = 1;
                this.selectedHotspot = null;
                this.clues = [];
                this.puzzleStates = {
                    portrait: { solved: false, examined: false },
                    desk: { solved: false, locked: true },
                    clock: { solved: false, examined: false },
                    cabinet: { solved: false, locked: true }
                };

                this.init();
            }

            init() {
                this.addLog("Welcome to Rusty Lake Mystery...", "important");
                this.addLog("Explore the room by clicking on objects and switching between walls.");
            }

            nextWall() {
                this.currentWall = (this.currentWall % 4) + 1;
                this.updateWall();
            }

            previousWall() {
                this.currentWall = this.currentWall === 1 ? 4 : this.currentWall - 1;
                this.updateWall();
            }

            updateWall() {
                document.querySelectorAll('.wall').forEach(w => w.classList.remove('active'));
                document.getElementById(`wall-${this.currentWall}`).classList.add('active');
                document.getElementById('wallNumber').textContent = this.currentWall;
                this.clearSelection();
            }

            clickHotspot(itemKey) {
                // Clear previous selection
                this.clearSelection();

                // Select this hotspot
                this.selectedHotspot = itemKey;
                const hotspot = document.getElementById(`hotspot-${itemKey}`);
                if (hotspot) {
                    hotspot.classList.add('selected');
                }

                this.addLog(`Selected: ${this.getItemName(itemKey)}`, "important");

                // Open interaction modal
                this.openInteractionModal(itemKey);
            }

            clearSelection() {
                document.querySelectorAll('.hotspot').forEach(h => h.classList.remove('selected'));
                this.selectedHotspot = null;
            }

            getItemName(key) {
                const names = {
                    portrait: "Victorian Portrait",
                    window: "Window",
                    desk: "Wooden Desk",
                    clock: "Grandfather Clock",
                    cabinet: "Cabinet"
                };
                return names[key] || key;
            }

            openInteractionModal(itemKey) {
                const modal = document.getElementById('modal');
                const modalBody = document.getElementById('modalBody');

                let content = '';

                switch(itemKey) {
                    case 'portrait':
                        content = this.getPortraitModal();
                        break;
                    case 'window':
                        content = this.getWindowModal();
                        break;
                    case 'desk':
                        content = this.getDeskModal();
                        break;
                    case 'clock':
                        content = this.getClockModal();
                        break;
                    case 'cabinet':
                        content = this.getCabinetModal();
                        break;
                }

                modalBody.innerHTML = content;
                modal.classList.add('active');
            }

            getPortraitModal() {
                if (!this.puzzleStates.portrait.examined) {
                    this.puzzleStates.portrait.examined = true;
                    return `
                        <h2 class="modal-title">Victorian Portrait</h2>
                        <div class="modal-description">
                            An old portrait hangs on the wall. A stern Victorian gentleman stares back at you.
                            Behind the frame, you notice something scratched into the wood...
                        </div>
                        <div class="furniture-view">
                            <div style="font-size: 100px; margin: 30px 0;">🖼️</div>
                            <div style="color: #c9a56f; font-style: italic; margin: 20px 0;">
                                "The key lies beneath where papers rest"
                            </div>
                        </div>
                        <button class="modal-btn" onclick="game.solvePortraitPuzzle()">Take the Hint</button>
                    `;
                } else {
                    return `
                        <h2 class="modal-title">Victorian Portrait</h2>
                        <div class="modal-description">
                            The portrait has already revealed its secret.
                            The message reads: "The key lies beneath where papers rest"
                        </div>
                        <button class="modal-btn" onclick="game.closeModal()">Close</button>
                    `;
                }
            }

            solvePortraitPuzzle() {
                if (!this.puzzleStates.portrait.solved) {
                    this.puzzleStates.portrait.solved = true;
                    this.addClue({
                        icon: '📜',
                        text: 'Hint: Check desk',
                        type: 'hint'
                    });
                    this.addLog("Found a cryptic message behind the portrait!", "important");
                }
                this.closeModal();
            }

            getWindowModal() {
                return `
                    <h2 class="modal-title">Window</h2>
                    <div class="modal-description">
                        Through the frosted glass, you see nothing but darkness.
                        The window is sealed shut. A cold draft seeps through the cracks.
                    </div>
                    <div class="furniture-view">
                        <div style="font-size: 100px; margin: 30px 0;">🪟</div>
                        <div style="color: #888; font-style: italic;">
                            No escape this way...
                        </div>
                    </div>
                    <button class="modal-btn" onclick="game.closeModal()">Close</button>
                `;
            }

            getDeskModal() {
                if (this.puzzleStates.desk.locked) {
                    return `
                        <h2 class="modal-title">Wooden Desk</h2>
                        <div class="modal-description">
                            A sturdy wooden desk with a single drawer.
                            The drawer has a small keyhole.
                        </div>
                        <div class="furniture-view">
                            <div style="font-size: 100px; margin: 30px 0;">🗄️</div>
                            <div class="lock-icon">🔒</div>
                            <div style="color: #ff6b6b;">Locked - Need a key</div>
                        </div>
                        <input type="text" class="modal-input" placeholder="Enter action or use key..." id="deskInput">
                        <button class="modal-btn" onclick="game.tryUnlockDesk()">Unlock</button>
                        <button class="modal-btn" onclick="game.closeModal()">Close</button>
                    `;
                } else {
                    return `
                        <h2 class="modal-title">Wooden Desk</h2>
                        <div class="modal-description">
                            The drawer is now open. Inside you find a precision gear
                            and a note with strange symbols.
                        </div>
                        <div class="furniture-view">
                            <div style="font-size: 100px; margin: 30px 0;">⚙️</div>
                        </div>
                        <button class="modal-btn" onclick="game.collectDeskItems()">Take Items</button>
                    `;
                }
            }

            tryUnlockDesk() {
                const input = document.getElementById('deskInput');
                const value = input ? input.value.toLowerCase() : '';

                if (value.includes('key') || this.hasClue('key')) {
                    this.puzzleStates.desk.locked = false;
                    this.puzzleStates.desk.solved = true;
                    this.addLog("Unlocked the desk drawer!", "important");
                    this.openInteractionModal('desk');
                } else {
                    this.addLog("You don't have the key yet...", "error");
                }
            }

            collectDeskItems() {
                if (!this.hasClue('gear')) {
                    this.addClue({ icon: '⚙️', text: 'Precision Gear', type: 'item' });
                    this.addClue({ icon: '📄', text: 'Note: 376', type: 'clue' });
                    this.addLog("Collected gear and note from desk!", "important");
                }
                this.closeModal();
            }

            getClockModal() {
                if (!this.puzzleStates.clock.solved) {
                    return `
                        <h2 class="modal-title">Grandfather Clock</h2>
                        <div class="modal-description">
                            An antique grandfather clock. The pendulum is missing.
                            There's a space where a gear should be...
                        </div>
                        <div class="furniture-view">
                            <div style="font-size: 120px; margin: 30px 0;">🕰️</div>
                            <div style="color: #ff6b6b; margin: 20px 0;">Missing: Gear</div>
                        </div>
                        <button class="modal-btn" onclick="game.tryFixClock()">Insert Gear</button>
                        <button class="modal-btn" onclick="game.closeModal()">Close</button>
                    `;
                } else {
                    return `
                        <h2 class="modal-title">Grandfather Clock</h2>
                        <div class="modal-description">
                            The clock is now ticking. As the hands move, a secret compartment
                            opens, revealing a small brass key!
                        </div>
                        <div class="furniture-view">
                            <div style="font-size: 120px; margin: 30px 0;">🕐</div>
                            <div style="font-size: 60px; color: #c9a56f;">🔑</div>
                        </div>
                        <button class="modal-btn" onclick="game.collectClockKey()">Take Key</button>
                    `;
                }
            }

            tryFixClock() {
                if (this.hasClue('gear')) {
                    this.puzzleStates.clock.solved = true;
                    this.addLog("The clock springs to life!", "important");
                    this.openInteractionModal('clock');
                } else {
                    this.addLog("You need a gear to fix the clock...", "error");
                }
            }

            collectClockKey() {
                if (!this.hasClue('key')) {
                    this.addClue({ icon: '🔑', text: 'Brass Key', type: 'key' });
                    this.addLog("Obtained the brass key!", "important");
                }
                this.closeModal();
            }

            getCabinetModal() {
                if (this.puzzleStates.cabinet.locked) {
                    return `
                        <h2 class="modal-title">Cabinet</h2>
                        <div class="modal-description">
                            A tall wooden cabinet with a numerical lock.
                            You need to enter a 3-digit code.
                        </div>
                        <div class="furniture-view">
                            <div style="font-size: 100px; margin: 30px 0;">🚪</div>
                            <div class="lock-icon">🔢</div>
                        </div>
                        <input type="text" class="modal-input" placeholder="Enter 3-digit code..."
                               id="cabinetCode" maxlength="3">
                        <button class="modal-btn" onclick="game.tryUnlockCabinet()">Unlock</button>
                        <button class="modal-btn" onclick="game.closeModal()">Close</button>
                    `;
                } else {
                    return `
                        <h2 class="modal-title">Cabinet</h2>
                        <div class="modal-description">
                            The cabinet door swings open. Inside, resting on black velvet,
                            is the mysterious Black Cube!
                        </div>
                        <div class="furniture-view">
                            <div style="font-size: 120px; margin: 30px 0;">⬛</div>
                            <div style="color: #c9a56f; font-size: 24px; margin: 20px 0;">
                                You Win!
                            </div>
                        </div>
                        <button class="modal-btn" onclick="game.winGame()">Take the Black Cube</button>
                    `;
                }
            }

            tryUnlockCabinet() {
                const input = document.getElementById('cabinetCode');
                const code = input ? input.value : '';

                if (code === '376') {
                    this.puzzleStates.cabinet.locked = false;
                    this.puzzleStates.cabinet.solved = true;
                    this.addLog("Cabinet unlocked! You found the Black Cube!", "important");
                    this.openInteractionModal('cabinet');
                } else {
                    this.addLog("Wrong code...", "error");
                }
            }

            winGame() {
                this.addClue({ icon: '⬛', text: 'Black Cube', type: 'final' });
                this.addLog("CONGRATULATIONS! You escaped the room!", "important");
                this.closeModal();

                setTimeout(() => {
                    alert('🎉 Congratulations! You solved the mystery and found the Black Cube!\n\nThank you for playing!');
                }, 500);
            }

            addClue(clue) {
                if (this.clues.length < 8) {
                    this.clues.push(clue);
                    const index = this.clues.length - 1;
                    const clueBox = document.getElementById(`clue-${index}`);

                    clueBox.classList.remove('empty');
                    clueBox.classList.add('filled', 'new-item');
                    clueBox.innerHTML = `
                        <div>
                            <div class="clue-icon">${clue.icon}</div>
                            <div class="clue-text">${clue.text}</div>
                        </div>
                    `;

                    setTimeout(() => clueBox.classList.remove('new-item'), 1000);
                }
            }

            hasClue(type) {
                return this.clues.some(c => c.text.toLowerCase().includes(type) || c.type === type);
            }

            addLog(message, type = '') {
                const logContainer = document.getElementById('logContainer');
                const logMsg = document.createElement('div');
                logMsg.className = `log-message ${type}`;
                logMsg.textContent = message;
                logContainer.appendChild(logMsg);
                logContainer.scrollTop = logContainer.scrollHeight;
            }

            closeModal() {
                document.getElementById('modal').classList.remove('active');
            }

            saveGame() {
                const saveData = {
                    currentWall: this.currentWall,
                    clues: this.clues,
                    puzzleStates: this.puzzleStates
                };
                localStorage.setItem('rustyLakeSave', JSON.stringify(saveData));
                this.addLog("Game saved!", "important");
            }

            loadGame() {
                const saveData = localStorage.getItem('rustyLakeSave');
                if (saveData) {
                    const data = JSON.parse(saveData);
                    this.currentWall = data.currentWall;
                    this.puzzleStates = data.puzzleStates;
                    this.clues = [];

                    // Clear clue boxes
                    for (let i = 0; i < 8; i++) {
                        const box = document.getElementById(`clue-${i}`);
                        box.classList.add('empty');
                        box.classList.remove('filled');
                        box.innerHTML = '';
                    }

                    // Restore clues
                    data.clues.forEach(clue => this.addClue(clue));

                    this.updateWall();
                    this.addLog("Game loaded!", "important");
                } else {
                    this.addLog("No save file found!", "error");
                }
            }
        }

        // Initialize game
        const game = new RustyLakeGame();
    </script>
</body>
</html>
