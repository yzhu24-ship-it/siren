<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>办公桌解压模拟器 - Office Desk Stress Relief</title>
    <!-- MediaPipe Hands -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1640029074/camera_utils.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils@0.3.1620248257/drawing_utils.js"></script>
    <!-- Matter.js 物理引擎 -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: #1a1a1a;
            overflow: hidden;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #gameContainer {
            position: relative;
            width: 100%;
            height: 100vh;
            display: flex;
            background: #0a0a0a;
        }

        /* 左侧摄像头面板 */
        #leftPanel {
            width: 320px;
            background: rgba(20, 20, 20, 0.95);
            border-right: 2px solid #333;
            display: flex;
            flex-direction: column;
            padding: 15px;
            gap: 15px;
        }

        .panel-title {
            color: #00ff00;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 2px;
            border-bottom: 1px solid #333;
            padding-bottom: 8px;
            text-shadow: 0 0 10px rgba(0, 255, 0, 0.5);
        }

        #videoContainer {
            position: relative;
            background: #000;
            border: 2px solid #333;
            overflow: hidden;
            aspect-ratio: 4/3;
        }

        #inputVideo {
            width: 100%;
            display: block;
            transform: scaleX(-1);
        }

        #handCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            transform: scaleX(-1);
        }

        #cameraStatus {
            background: rgba(40, 40, 40, 0.9);
            border: 1px solid #444;
            padding: 12px;
            color: #aaa;
            font-size: 12px;
            text-align: center;
        }

        #cameraStatus.active {
            background: rgba(0, 80, 0, 0.3);
            color: #00ff00;
            border-color: #00ff00;
        }

        #cameraStatus.error {
            background: rgba(80, 0, 0, 0.3);
            color: #ff0000;
            border-color: #ff0000;
        }

        /* 状态显示 */
        .stats-container {
            background: rgba(40, 40, 40, 0.9);
            border: 1px solid #444;
            padding: 12px;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            color: #aaa;
            font-size: 12px;
        }

        .stat-row:last-child {
            margin-bottom: 0;
        }

        .stat-value {
            color: #00ff00;
            font-weight: bold;
            text-shadow: 0 0 5px rgba(0, 255, 0, 0.5);
        }

        /* 物品栏 */
        #inventory {
            background: rgba(40, 40, 40, 0.9);
            border: 1px solid #444;
            padding: 12px;
        }

        .inventory-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            margin-top: 10px;
        }

        .inventory-item {
            aspect-ratio: 1;
            background: rgba(60, 60, 60, 0.8);
            border: 2px solid #555;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s;
        }

        .inventory-item:hover {
            background: rgba(80, 80, 80, 0.9);
            border-color: #00ff00;
            transform: translateY(-2px);
        }

        .inventory-item-icon {
            font-size: 24px;
            margin-bottom: 4px;
        }

        .inventory-item-name {
            font-size: 10px;
            color: #aaa;
            text-align: center;
        }

        /* 主游戏区域 */
        #mainArea {
            flex: 1;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        #gameCanvas {
            flex: 1;
            cursor: crosshair;
            image-rendering: crisp-edges;
        }

        /* 底部 HUD */
        #bottomHud {
            height: 80px;
            background: rgba(20, 20, 20, 0.95);
            border-top: 2px solid #333;
            display: flex;
            align-items: center;
            padding: 0 20px;
            gap: 30px;
        }

        .hud-section {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .hud-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        .hud-label {
            font-size: 11px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .hud-value {
            font-size: 28px;
            color: #00ff00;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(0, 255, 0, 0.5);
            font-family: 'Courier New', monospace;
        }

        .hud-divider {
            width: 1px;
            height: 50px;
            background: #333;
        }

        .hud-button {
            padding: 10px 20px;
            background: rgba(60, 60, 60, 0.8);
            border: 2px solid #555;
            color: #aaa;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-family: 'Courier New', monospace;
        }

        .hud-button:hover {
            background: rgba(80, 80, 80, 0.9);
            border-color: #00ff00;
            color: #00ff00;
            box-shadow: 0 0 10px rgba(0, 255, 0, 0.3);
        }

        .hud-button:active {
            transform: scale(0.95);
        }

        /* 启动屏幕 */
        #startScreen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a1a1a 0%, #0a0a0a 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.5s;
        }

        #startScreen.hidden {
            opacity: 0;
            pointer-events: none;
        }

        #startScreen h1 {
            color: #00ff00;
            font-size: 48px;
            margin-bottom: 10px;
            text-shadow: 0 0 20px rgba(0, 255, 0, 0.5);
            font-family: 'Courier New', monospace;
            letter-spacing: 3px;
        }

        #startScreen .subtitle {
            color: #666;
            font-size: 16px;
            margin-bottom: 40px;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        #startScreen p {
            color: #aaa;
            font-size: 14px;
            margin-bottom: 40px;
            text-align: center;
            max-width: 600px;
            line-height: 1.8;
        }

        #startBtn {
            padding: 20px 50px;
            font-size: 18px;
            background: rgba(60, 60, 60, 0.8);
            border: 2px solid #00ff00;
            color: #00ff00;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-family: 'Courier New', monospace;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.3);
        }

        #startBtn:hover {
            background: rgba(0, 255, 0, 0.2);
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(0, 255, 0, 0.5);
        }

        /* 提示文字 */
        #hints {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.9);
            color: #00ff00;
            padding: 15px 30px;
            border: 1px solid #00ff00;
            font-size: 14px;
            text-align: center;
            z-index: 100;
            transition: opacity 0.3s;
            font-family: 'Courier New', monospace;
            box-shadow: 0 0 20px rgba(0, 255, 0, 0.3);
        }

        #hints.hidden {
            opacity: 0;
            pointer-events: none;
        }

        /* 加载动画 */
        .loader {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(0, 255, 0, 0.3);
            border-radius: 50%;
            border-top-color: #00ff00;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* 响应式 */
        @media (max-width: 1024px) {
            #leftPanel {
                width: 280px;
            }

            #bottomHud {
                height: 70px;
            }

            .hud-value {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>
    <!-- 启动屏幕 -->
    <div id="startScreen">
        <h1>OFFICE DESK SIMULATOR</h1>
        <div class="subtitle">Stress Relief Edition</div>
        <p>
            使用手势操控办公桌上的物品，释放工作压力<br>
            握拳抓取 | 张开手释放 | 快速挥动投掷<br>
            将垃圾扔进垃圾桶获得分数
        </p>
        <button id="startBtn">[ LAUNCH GAME ]</button>
    </div>

    <!-- 游戏容器 -->
    <div id="gameContainer" style="display: none;">
        <!-- 左侧面板 -->
        <div id="leftPanel">
            <div class="panel-title">▶ Camera Feed</div>
            <div id="videoContainer">
                <video id="inputVideo" autoplay playsinline></video>
                <canvas id="handCanvas"></canvas>
            </div>
            <div id="cameraStatus">
                <div class="loader"></div>
                <div style="margin-top: 10px;">初始化中...</div>
            </div>

            <div class="panel-title">▶ Stats</div>
            <div class="stats-container">
                <div class="stat-row">
                    <span>得分</span>
                    <span class="stat-value" id="scoreDisplay">0</span>
                </div>
                <div class="stat-row">
                    <span>连击</span>
                    <span class="stat-value" id="comboDisplay">0x</span>
                </div>
                <div class="stat-row">
                    <span>手势</span>
                    <span class="stat-value" id="gestureDisplay">READY</span>
                </div>
            </div>

            <div class="panel-title">▶ Inventory</div>
            <div id="inventory">
                <div class="inventory-grid">
                    <div class="inventory-item" data-item="paper">
                        <div class="inventory-item-icon">📄</div>
                        <div class="inventory-item-name">废纸</div>
                    </div>
                    <div class="inventory-item" data-item="cup">
                        <div class="inventory-item-icon">☕</div>
                        <div class="inventory-item-name">咖啡杯</div>
                    </div>
                    <div class="inventory-item" data-item="document">
                        <div class="inventory-item-icon">📋</div>
                        <div class="inventory-item-name">文件</div>
                    </div>
                    <div class="inventory-item" data-item="random">
                        <div class="inventory-item-icon">🎲</div>
                        <div class="inventory-item-name">随机</div>
                    </div>
                    <div class="inventory-item" data-item="book">
                        <div class="inventory-item-icon">📚</div>
                        <div class="inventory-item-name">书本</div>
                    </div>
                    <div class="inventory-item" data-item="pen">
                        <div class="inventory-item-icon">🖊️</div>
                        <div class="inventory-item-name">笔</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- 主游戏区域 -->
        <div id="mainArea">
            <canvas id="gameCanvas"></canvas>

            <!-- 底部 HUD -->
            <div id="bottomHud">
                <div class="hud-section">
                    <div class="hud-item">
                        <div class="hud-label">Score</div>
                        <div class="hud-value" id="score">0000</div>
                    </div>
                </div>

                <div class="hud-divider"></div>

                <div class="hud-section">
                    <div class="hud-item">
                        <div class="hud-label">Combo</div>
                        <div class="hud-value" id="combo" style="color: #ffaa00;">0x</div>
                    </div>
                </div>

                <div class="hud-divider"></div>

                <div class="hud-section">
                    <div class="hud-item">
                        <div class="hud-label">Status</div>
                        <div class="hud-value" id="gestureStatus" style="font-size: 32px;">🖐️</div>
                    </div>
                </div>

                <div style="flex: 1;"></div>

                <div class="hud-section">
                    <button class="hud-button" id="resetBtn">[ RESET ]</button>
                    <button class="hud-button" id="addItemBtn">[ ADD ITEM ]</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 提示 -->
    <div id="hints" class="hidden">
        > 握拳抓取，张开手释放，快速挥动投掷！
    </div>

    <script>
        // ==================== 全局变量 ====================
        const { Engine, Render, World, Bodies, Body, Events, Runner } = Matter;

        let engine, render, world, runner;
        let hands, camera;
        let score = 0;
        let combo = 0;
        let comboTimer = null;

        // 手势状态
        let handState = {
            isGrabbing: false,
            position: { x: 0, y: 0 },
            velocity: { x: 0, y: 0 },
            previousPosition: { x: 0, y: 0 }
        };

        // 游戏物品
        let items = [];
        let trashBin = null;
        let grabbedItem = null;

        // DOM 元素
        const startScreen = document.getElementById('startScreen');
        const startBtn = document.getElementById('startBtn');
        const gameContainer = document.getElementById('gameContainer');
        const inputVideo = document.getElementById('inputVideo');
        const handCanvas = document.getElementById('handCanvas');
        const gameCanvas = document.getElementById('gameCanvas');
        const cameraStatus = document.getElementById('cameraStatus');
        const scoreElement = document.getElementById('score');
        const scoreDisplay = document.getElementById('scoreDisplay');
        const comboElement = document.getElementById('combo');
        const comboDisplay = document.getElementById('comboDisplay');
        const gestureStatus = document.getElementById('gestureStatus');
        const gestureDisplay = document.getElementById('gestureDisplay');
        const hints = document.getElementById('hints');
        const resetBtn = document.getElementById('resetBtn');
        const addItemBtn = document.getElementById('addItemBtn');
        const inventoryItems = document.querySelectorAll('.inventory-item');

        // ==================== 绘制木纹桌面背景 ====================
        function drawWoodTexture(ctx, width, height) {
            // 基础木色
            const gradient = ctx.createLinearGradient(0, 0, 0, height);
            gradient.addColorStop(0, '#8B4513');
            gradient.addColorStop(0.5, '#A0522D');
            gradient.addColorStop(1, '#8B4513');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, width, height);

            // 木纹纹理
            ctx.strokeStyle = 'rgba(101, 67, 33, 0.3)';
            ctx.lineWidth = 2;
            for (let i = 0; i < height; i += 20) {
                ctx.beginPath();
                ctx.moveTo(0, i);
                for (let x = 0; x < width; x += 10) {
                    const y = i + Math.sin(x * 0.05) * 3;
                    ctx.lineTo(x, y);
                }
                ctx.stroke();
            }

            // 添加一些暗色斑点
            ctx.fillStyle = 'rgba(60, 40, 20, 0.2)';
            for (let i = 0; i < 50; i++) {
                const x = Math.random() * width;
                const y = Math.random() * height;
                const radius = Math.random() * 30 + 10;
                ctx.beginPath();
                ctx.ellipse(x, y, radius, radius * 0.3, Math.random() * Math.PI, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // ==================== 自定义渲染物品 ====================
        function renderCustomObjects() {
            const ctx = render.context;

            // 渲染垃圾桶
            if (trashBin) {
                const pos = trashBin.position;
                const w = 100;
                const h = 120;

                // 垃圾桶身
                ctx.fillStyle = '#404040';
                ctx.strokeStyle = '#202020';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(pos.x - w/2 + 10, pos.y - h/2);
                ctx.lineTo(pos.x + w/2 - 10, pos.y - h/2);
                ctx.lineTo(pos.x + w/2, pos.y + h/2);
                ctx.lineTo(pos.x - w/2, pos.y + h/2);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();

                // 垃圾桶盖
                ctx.fillStyle = '#505050';
                ctx.fillRect(pos.x - w/2 - 5, pos.y - h/2 - 10, w + 10, 12);
                ctx.strokeRect(pos.x - w/2 - 5, pos.y - h/2 - 10, w + 10, 12);

                // 垃圾桶图标
                ctx.fillStyle = '#808080';
                ctx.font = '40px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('🗑️', pos.x, pos.y);
            }

            // 渲染物品
            items.forEach(item => {
                const pos = item.position;
                const angle = item.angle;

                ctx.save();
                ctx.translate(pos.x, pos.y);
                ctx.rotate(angle);

                switch(item.label) {
                    case 'paper':
                        // 废纸团
                        ctx.fillStyle = '#f0f0f0';
                        ctx.strokeStyle = '#999';
                        ctx.lineWidth = 2;

                        // 不规则的纸团形状
                        ctx.beginPath();
                        for (let i = 0; i < 8; i++) {
                            const a = (i / 8) * Math.PI * 2;
                            const r = 20 + Math.sin(i * 2) * 5;
                            const x = Math.cos(a) * r;
                            const y = Math.sin(a) * r;
                            if (i === 0) ctx.moveTo(x, y);
                            else ctx.lineTo(x, y);
                        }
                        ctx.closePath();
                        ctx.fill();
                        ctx.stroke();

                        // 纸张纹理线条
                        ctx.strokeStyle = '#ccc';
                        ctx.lineWidth = 1;
                        for (let i = 0; i < 5; i++) {
                            ctx.beginPath();
                            ctx.moveTo(-15 + i * 3, -10);
                            ctx.lineTo(-10 + i * 3, 10);
                            ctx.stroke();
                        }
                        break;

                    case 'cup':
                        // 咖啡杯
                        const cupW = 40;
                        const cupH = 60;

                        // 杯身
                        ctx.fillStyle = '#d2691e';
                        ctx.strokeStyle = '#8b4513';
                        ctx.lineWidth = 2;
                        ctx.fillRect(-cupW/2, -cupH/2, cupW, cupH);
                        ctx.strokeRect(-cupW/2, -cupH/2, cupW, cupH);

                        // 杯口高光
                        ctx.fillStyle = 'rgba(255, 255, 255, 0.3)';
                        ctx.fillRect(-cupW/2, -cupH/2, cupW, 5);

                        // 咖啡
                        ctx.fillStyle = '#4a2511';
                        ctx.fillRect(-cupW/2 + 3, -cupH/2 + 5, cupW - 6, cupH - 25);

                        // 杯子把手
                        ctx.strokeStyle = '#d2691e';
                        ctx.lineWidth = 3;
                        ctx.beginPath();
                        ctx.arc(cupW/2, 0, 10, -Math.PI/2, Math.PI/2);
                        ctx.stroke();

                        // 蒸汽
                        ctx.strokeStyle = 'rgba(200, 200, 200, 0.5)';
                        ctx.lineWidth = 2;
                        ctx.beginPath();
                        ctx.moveTo(-5, -cupH/2 - 5);
                        ctx.quadraticCurveTo(-3, -cupH/2 - 15, 0, -cupH/2 - 10);
                        ctx.stroke();
                        ctx.beginPath();
                        ctx.moveTo(5, -cupH/2 - 5);
                        ctx.quadraticCurveTo(3, -cupH/2 - 15, 0, -cupH/2 - 20);
                        ctx.stroke();
                        break;

                    case 'document':
                        // 文件
                        const docW = 60;
                        const docH = 80;

                        // 纸张
                        ctx.fillStyle = '#ffffff';
                        ctx.strokeStyle = '#888';
                        ctx.lineWidth = 2;
                        ctx.fillRect(-docW/2, -docH/2, docW, docH);
                        ctx.strokeRect(-docW/2, -docH/2, docW, docH);

                        // 折角
                        ctx.fillStyle = '#e0e0e0';
                        ctx.beginPath();
                        ctx.moveTo(docW/2 - 15, -docH/2);
                        ctx.lineTo(docW/2, -docH/2 + 15);
                        ctx.lineTo(docW/2, -docH/2);
                        ctx.closePath();
                        ctx.fill();
                        ctx.stroke();

                        // 文字线条
                        ctx.strokeStyle = '#333';
                        ctx.lineWidth = 1;
                        for (let i = 0; i < 8; i++) {
                            const y = -docH/2 + 15 + i * 8;
                            ctx.beginPath();
                            ctx.moveTo(-docW/2 + 8, y);
                            ctx.lineTo(docW/2 - 8, y);
                            ctx.stroke();
                        }
                        break;

                    case 'book':
                        // 书本
                        const bookW = 50;
                        const bookH = 70;

                        // 书封面
                        ctx.fillStyle = '#8B0000';
                        ctx.strokeStyle = '#4a0000';
                        ctx.lineWidth = 3;
                        ctx.fillRect(-bookW/2, -bookH/2, bookW, bookH);
                        ctx.strokeRect(-bookW/2, -bookH/2, bookW, bookH);

                        // 书脊
                        ctx.fillStyle = '#600000';
                        ctx.fillRect(-bookW/2, -bookH/2, 5, bookH);

                        // 书名
                        ctx.fillStyle = '#FFD700';
                        ctx.font = 'bold 10px Arial';
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.fillText('WORK', 0, -10);
                        ctx.fillText('MANUAL', 0, 5);
                        break;

                    case 'pen':
                        // 笔
                        const penL = 60;

                        // 笔身
                        ctx.fillStyle = '#1E90FF';
                        ctx.strokeStyle = '#104E8B';
                        ctx.lineWidth = 2;
                        ctx.fillRect(-penL/2, -4, penL - 10, 8);
                        ctx.strokeRect(-penL/2, -4, penL - 10, 8);

                        // 笔尖
                        ctx.fillStyle = '#C0C0C0';
                        ctx.beginPath();
                        ctx.moveTo(penL/2 - 10, -4);
                        ctx.lineTo(penL/2, 0);
                        ctx.lineTo(penL/2 - 10, 4);
                        ctx.closePath();
                        ctx.fill();
                        ctx.stroke();

                        // 笔帽
                        ctx.fillStyle = '#000080';
                        ctx.fillRect(-penL/2 - 5, -4, 5, 8);
                        ctx.strokeRect(-penL/2 - 5, -4, 5, 8);
                        break;
                }

                ctx.restore();
            });
        }

        // ==================== 初始化物理引擎 ====================
        function initPhysics() {
            const canvasWidth = gameCanvas.clientWidth;
            const canvasHeight = gameCanvas.clientHeight;

            // 设置 canvas 实际尺寸
            gameCanvas.width = canvasWidth;
            gameCanvas.height = canvasHeight;

            // 创建引擎
            engine = Engine.create({
                gravity: { x: 0, y: 1 }
            });
            world = engine.world;

            // 创建渲染器
            render = Render.create({
                canvas: gameCanvas,
                engine: engine,
                options: {
                    width: canvasWidth,
                    height: canvasHeight,
                    wireframes: false,
                    background: 'transparent'
                }
            });

            // 绘制木纹背景
            const ctx = render.context;
            drawWoodTexture(ctx, canvasWidth, canvasHeight);

            // 创建地面和墙壁（不可见）
            const ground = Bodies.rectangle(canvasWidth / 2, canvasHeight - 10, canvasWidth, 20, {
                isStatic: true,
                render: { visible: false }
            });

            const leftWall = Bodies.rectangle(10, canvasHeight / 2, 20, canvasHeight, {
                isStatic: true,
                render: { visible: false }
            });

            const rightWall = Bodies.rectangle(canvasWidth - 10, canvasHeight / 2, 20, canvasHeight, {
                isStatic: true,
                render: { visible: false }
            });

            World.add(world, [ground, leftWall, rightWall]);

            // 创建垃圾桶
            createTrashBin();

            // 添加初始物品
            addRandomItem();
            addRandomItem();
            addRandomItem();

            // 启动渲染和引擎
            Render.run(render);
            runner = Runner.create();
            Runner.run(runner, engine);

            // 监听碰撞
            Events.on(engine, 'collisionStart', handleCollision);

            // 自定义渲染循环
            Events.on(render, 'afterRender', () => {
                drawWoodTexture(ctx, canvasWidth, canvasHeight);
                renderCustomObjects();
            });
        }

        // ==================== 创建垃圾桶 ====================
        function createTrashBin() {
            const canvasWidth = gameCanvas.clientWidth;
            const canvasHeight = gameCanvas.clientHeight;

            trashBin = Bodies.rectangle(
                canvasWidth - 150,
                canvasHeight - 100,
                100,
                120,
                {
                    isStatic: true,
                    isSensor: true,
                    label: 'trashBin',
                    render: { visible: false }
                }
            );

            World.add(world, trashBin);
        }

        // ==================== 添加物品 ====================
        function addItem(type) {
            const canvasWidth = gameCanvas.clientWidth;
            const x = Math.random() * (canvasWidth - 300) + 150;
            const y = Math.random() * 200 + 100;

            let item;

            switch(type) {
                case 'paper':
                    item = Bodies.circle(x, y, 25, {
                        label: 'paper',
                        restitution: 0.6,
                        friction: 0.1,
                        render: { visible: false }
                    });
                    break;
                case 'cup':
                    item = Bodies.rectangle(x, y, 40, 60, {
                        label: 'cup',
                        restitution: 0.3,
                        friction: 0.5,
                        render: { visible: false }
                    });
                    break;
                case 'document':
                    item = Bodies.rectangle(x, y, 60, 80, {
                        label: 'document',
                        restitution: 0.1,
                        friction: 0.8,
                        render: { visible: false }
                    });
                    break;
                case 'book':
                    item = Bodies.rectangle(x, y, 50, 70, {
                        label: 'book',
                        restitution: 0.2,
                        friction: 0.9,
                        render: { visible: false }
                    });
                    break;
                case 'pen':
                    item = Bodies.rectangle(x, y, 60, 8, {
                        label: 'pen',
                        restitution: 0.4,
                        friction: 0.3,
                        render: { visible: false }
                    });
                    break;
            }

            items.push(item);
            World.add(world, item);
        }

        function addRandomItem() {
            const types = ['paper', 'cup', 'document', 'book', 'pen'];
            const type = types[Math.floor(Math.random() * types.length)];
            addItem(type);
        }

        // ==================== 碰撞检测 ====================
        function handleCollision(event) {
            const pairs = event.pairs;

            pairs.forEach(pair => {
                const { bodyA, bodyB } = pair;

                if ((bodyA === trashBin && items.includes(bodyB)) ||
                    (bodyB === trashBin && items.includes(bodyA))) {
                    const item = bodyA === trashBin ? bodyB : bodyA;

                    World.remove(world, item);
                    items = items.filter(i => i !== item);

                    updateScore(10);
                    setTimeout(() => addRandomItem(), 500);
                }
            });
        }

        // ==================== 更新分数 ====================
        function updateScore(points) {
            score += points;
            scoreElement.textContent = String(score).padStart(4, '0');
            scoreDisplay.textContent = score;

            combo++;
            comboElement.textContent = combo + 'x';
            comboDisplay.textContent = combo + 'x';

            if (comboTimer) clearTimeout(comboTimer);
            comboTimer = setTimeout(() => {
                combo = 0;
                comboElement.textContent = '0x';
                comboDisplay.textContent = '0x';
            }, 3000);
        }

        // ==================== 初始化 MediaPipe Hands ====================
        async function initHandTracking() {
            try {
                hands = new Hands({
                    locateFile: (file) => {
                        return `https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1646424915/${file}`;
                    }
                });

                hands.setOptions({
                    maxNumHands: 1,
                    modelComplexity: 1,
                    minDetectionConfidence: 0.7,
                    minTrackingConfidence: 0.7
                });

                hands.onResults(onHandResults);

                const stream = await navigator.mediaDevices.getUserMedia({
                    video: { width: 640, height: 480 }
                });

                inputVideo.srcObject = stream;

                camera = new Camera(inputVideo, {
                    onFrame: async () => {
                        await hands.send({ image: inputVideo });
                    },
                    width: 640,
                    height: 480
                });

                camera.start();

                cameraStatus.className = 'active';
                cameraStatus.innerHTML = '✓ CAMERA ONLINE';

                setTimeout(() => {
                    hints.classList.remove('hidden');
                    setTimeout(() => hints.classList.add('hidden'), 5000);
                }, 1000);

            } catch (error) {
                console.error('手势追踪初始化失败:', error);
                cameraStatus.className = 'error';
                cameraStatus.innerHTML = '✗ CAMERA ERROR';
            }
        }

        // ==================== 处理手势识别结果 ====================
        function onHandResults(results) {
            const ctx = handCanvas.getContext('2d');
            ctx.clearRect(0, 0, handCanvas.width, handCanvas.height);

            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
                const landmarks = results.multiHandLandmarks[0];

                drawConnectors(ctx, landmarks, HAND_CONNECTIONS, {
                    color: '#00FF00',
                    lineWidth: 2
                });
                drawLandmarks(ctx, landmarks, {
                    color: '#FF0000',
                    lineWidth: 1,
                    radius: 3
                });

                const palmCenter = landmarks[9];
                const canvasWidth = gameCanvas.clientWidth;
                const canvasHeight = gameCanvas.clientHeight;

                handState.previousPosition = { ...handState.position };
                handState.position = {
                    x: canvasWidth - (palmCenter.x * canvasWidth),
                    y: palmCenter.y * canvasHeight
                };

                handState.velocity = {
                    x: handState.position.x - handState.previousPosition.x,
                    y: handState.position.y - handState.previousPosition.y
                };

                const isGrabbing = detectGrabGesture(landmarks);

                if (isGrabbing && !handState.isGrabbing) {
                    tryGrabItem();
                    gestureStatus.textContent = '✊';
                    gestureDisplay.textContent = 'GRAB';
                } else if (!isGrabbing && handState.isGrabbing) {
                    releaseItem();
                    gestureStatus.textContent = '🖐️';
                    gestureDisplay.textContent = 'OPEN';
                }

                handState.isGrabbing = isGrabbing;

                if (grabbedItem) {
                    Body.setPosition(grabbedItem, handState.position);
                    Body.setVelocity(grabbedItem, { x: 0, y: 0 });
                }
            } else {
                gestureStatus.textContent = '❓';
                gestureDisplay.textContent = 'WAIT';
            }
        }

        // ==================== 检测抓取手势 ====================
        function detectGrabGesture(landmarks) {
            const fingerTips = [8, 12, 16, 20];
            const fingerBases = [6, 10, 14, 18];

            let bentFingers = 0;
            for (let i = 0; i < fingerTips.length; i++) {
                const tip = landmarks[fingerTips[i]];
                const base = landmarks[fingerBases[i]];
                if (tip.y > base.y) bentFingers++;
            }

            return bentFingers >= 3;
        }

        // ==================== 尝试抓取物品 ====================
        function tryGrabItem() {
            const grabRadius = 100;

            for (let item of items) {
                const dx = item.position.x - handState.position.x;
                const dy = item.position.y - handState.position.y;
                const distance = Math.sqrt(dx * dx + dy * dy);

                if (distance < grabRadius) {
                    grabbedItem = item;
                    Body.setStatic(grabbedItem, true);
                    break;
                }
            }
        }

        // ==================== 释放物品 ====================
        function releaseItem() {
            if (grabbedItem) {
                Body.setStatic(grabbedItem, false);

                const speed = Math.sqrt(
                    handState.velocity.x ** 2 +
                    handState.velocity.y ** 2
                );

                if (speed > 5) {
                    Body.setVelocity(grabbedItem, {
                        x: handState.velocity.x * 0.5,
                        y: handState.velocity.y * 0.5
                    });
                }

                grabbedItem = null;
            }
        }

        // ==================== 重置游戏 ====================
        function resetGame() {
            items.forEach(item => World.remove(world, item));
            items = [];

            score = 0;
            combo = 0;
            scoreElement.textContent = '0000';
            scoreDisplay.textContent = '0';
            comboElement.textContent = '0x';
            comboDisplay.textContent = '0x';

            addRandomItem();
            addRandomItem();
            addRandomItem();
        }

        // ==================== 事件监听 ====================
        startBtn.addEventListener('click', async () => {
            startScreen.classList.add('hidden');
            gameContainer.style.display = 'flex';

            setTimeout(() => {
                handCanvas.width = inputVideo.videoWidth || 640;
                handCanvas.height = inputVideo.videoHeight || 480;

                initPhysics();
                initHandTracking();
            }, 100);
        });

        resetBtn.addEventListener('click', resetGame);
        addItemBtn.addEventListener('click', addRandomItem);

        // 物品栏点击
        inventoryItems.forEach(item => {
            item.addEventListener('click', () => {
                const itemType = item.dataset.item;
                if (itemType === 'random') {
                    addRandomItem();
                } else {
                    addItem(itemType);
                }
            });
        });

        // 窗口大小调整
        window.addEventListener('resize', () => {
            if (render) {
                const canvasWidth = gameCanvas.clientWidth;
                const canvasHeight = gameCanvas.clientHeight;

                gameCanvas.width = canvasWidth;
                gameCanvas.height = canvasHeight;
                render.canvas.width = canvasWidth;
                render.canvas.height = canvasHeight;
                render.options.width = canvasWidth;
                render.options.height = canvasHeight;
            }
        });
    </script>
</body>
</html>
