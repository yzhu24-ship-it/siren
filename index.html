<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Persona Mask Switcher</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            background: linear-gradient(135deg, #ffa07a 0%, #ff6b6b 100%);
            transition: background 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
            position: relative;
        }

        /* 背景动画装饰 */
        body::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: backgroundMove 20s linear infinite;
            pointer-events: none;
        }

        @keyframes backgroundMove {
            0% {
                transform: translate(0, 0);
            }
            100% {
                transform: translate(50px, 50px);
            }
        }

        .container {
            position: relative;
            z-index: 1;
            text-align: center;
            max-width: 600px;
            width: 100%;
        }

        h1 {
            color: white;
            font-size: 2.5rem;
            margin-bottom: 60px;
            text-shadow: 2px 4px 8px rgba(0, 0, 0, 0.2);
            font-weight: 300;
            letter-spacing: 2px;
        }

        .avatar-container {
            margin: 0 auto 60px;
            width: 300px;
            height: 300px;
            position: relative;
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3),
                        0 0 0 10px rgba(255, 255, 255, 0.1),
                        0 0 0 20px rgba(255, 255, 255, 0.05);
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1),
                        box-shadow 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            background: white;
            animation: avatarPulse 3s ease-in-out infinite;
        }

        @keyframes avatarPulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.02);
            }
        }

        .avatar:hover {
            transform: scale(1.05);
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.4),
                        0 0 0 10px rgba(255, 255, 255, 0.15),
                        0 0 0 20px rgba(255, 255, 255, 0.08);
        }

        /* 切换动画效果 */
        .avatar.switching {
            animation: switchAnimation 0.6s ease-in-out;
        }

        @keyframes switchAnimation {
            0% {
                transform: scale(1) rotateY(0deg);
                opacity: 1;
            }
            50% {
                transform: scale(0.8) rotateY(90deg);
                opacity: 0.3;
            }
            100% {
                transform: scale(1) rotateY(0deg);
                opacity: 1;
            }
        }

        .button-group {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            max-width: 400px;
            margin: 0 auto;
        }

        .persona-button {
            padding: 20px 30px;
            font-size: 1.1rem;
            font-weight: 500;
            border: none;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: white;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            position: relative;
            overflow: hidden;
        }

        .persona-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            transform: translateX(-100%);
            transition: transform 0.6s;
        }

        .persona-button:hover::before {
            transform: translateX(100%);
        }

        .persona-button:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
        }

        .persona-button:active {
            transform: translateY(0);
        }

        .persona-button.active {
            background: rgba(255, 255, 255, 0.4);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2),
                        inset 0 2px 10px rgba(255, 255, 255, 0.2);
            transform: scale(0.98);
        }

        /* 状态指示器 */
        .status-indicator {
            margin-top: 40px;
            color: white;
            font-size: 1.2rem;
            opacity: 0.9;
            text-shadow: 1px 2px 4px rgba(0, 0, 0, 0.2);
        }

        /* 响应式设计 */
        @media (max-width: 600px) {
            h1 {
                font-size: 2rem;
                margin-bottom: 40px;
            }

            .avatar-container {
                width: 250px;
                height: 250px;
                margin-bottom: 40px;
            }

            .button-group {
                grid-template-columns: 1fr;
                max-width: 300px;
            }

            .persona-button {
                font-size: 1rem;
                padding: 18px 25px;
            }
        }

        /* 不同状态的背景色 */
        body.family {
            background: linear-gradient(135deg, #ffa07a 0%, #ff6b6b 100%);
        }

        body.friend {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }

        body.colleague {
            background: linear-gradient(135deg, #e0e0e0 0%, #b0b0b0 100%);
        }

        body.stranger {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
    </style>
</head>
<body class="family">
    <div class="container">
        <h1>Social Persona Mask Switcher</h1>

        <div class="avatar-container">
            <canvas id="avatar" class="avatar"></canvas>
        </div>

        <div class="button-group">
            <button class="persona-button active" data-persona="family">👨‍👩‍👧‍👦 Family</button>
            <button class="persona-button" data-persona="friend">🎉 Friends</button>
            <button class="persona-button" data-persona="colleague">💼 Colleagues</button>
            <button class="persona-button" data-persona="stranger">🎭 Strangers</button>
        </div>

        <div class="status-indicator">
            Current Mode: <span id="currentStatus">Family Mode</span>
        </div>
    </div>

    <script>
        // Drawing function for avatars with different expressions
        function drawAvatar(ctx, expression, bgColor) {
            const width = 300;
            const height = 300;

            // Clear canvas
            ctx.clearRect(0, 0, width, height);

            // Background
            ctx.fillStyle = bgColor;
            ctx.fillRect(0, 0, width, height);

            // Face
            ctx.fillStyle = '#f4c7a5';
            ctx.beginPath();
            ctx.arc(150, 135, 75, 0, Math.PI * 2);
            ctx.fill();

            // Hair (long straight hair)
            ctx.fillStyle = '#8b4513';
            ctx.beginPath();
            // Top of hair
            ctx.ellipse(150, 90, 75, 45, 0, 0, Math.PI * 2);
            ctx.fill();
            // Left side
            ctx.fillRect(75, 90, 30, 120);
            // Right side
            ctx.fillRect(195, 90, 30, 120);
            // Bottom wave
            ctx.beginPath();
            ctx.moveTo(75, 200);
            ctx.quadraticCurveTo(90, 210, 105, 200);
            ctx.lineTo(105, 135);
            ctx.lineTo(75, 135);
            ctx.fill();
            ctx.beginPath();
            ctx.moveTo(195, 200);
            ctx.quadraticCurveTo(210, 210, 225, 200);
            ctx.lineTo(225, 135);
            ctx.lineTo(195, 135);
            ctx.fill();

            // Eyes
            ctx.fillStyle = '#000';
            if (expression === 'stranger') {
                // Looking to the side
                ctx.beginPath();
                ctx.ellipse(120, 128, 6, 9, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.ellipse(190, 128, 6, 9, 0, 0, Math.PI * 2);
                ctx.fill();
            } else if (expression === 'friend') {
                // Happy squinted eyes
                ctx.beginPath();
                ctx.arc(128, 123, 4, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(172, 123, 4, 0, Math.PI * 2);
                ctx.fill();
                // Eyebrows raised
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.moveTo(110, 110);
                ctx.quadraticCurveTo(128, 105, 145, 110);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(155, 110);
                ctx.quadraticCurveTo(172, 105, 190, 110);
                ctx.stroke();
            } else {
                // Normal eyes
                ctx.beginPath();
                ctx.ellipse(128, 128, 7, 12, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.ellipse(172, 128, 7, 12, 0, 0, Math.PI * 2);
                ctx.fill();

                // Eyebrows
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(110, 113);
                ctx.lineTo(145, 113);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(155, 113);
                ctx.lineTo(190, 113);
                ctx.stroke();
            }

            // Mouth
            ctx.strokeStyle = '#000';
            ctx.fillStyle = '#000';
            ctx.lineWidth = 3;
            ctx.beginPath();

            if (expression === 'family') {
                // Warm smile
                ctx.moveTo(120, 158);
                ctx.quadraticCurveTo(150, 173, 180, 158);
            } else if (expression === 'friend') {
                // Big laugh
                ctx.moveTo(113, 150);
                ctx.quadraticCurveTo(150, 180, 187, 150);
            } else if (expression === 'colleague') {
                // Straight line (serious)
                ctx.moveTo(120, 162);
                ctx.lineTo(180, 162);
            } else if (expression === 'stranger') {
                // Tight line (cold, indifferent)
                ctx.moveTo(125, 162);
                ctx.lineTo(175, 162);
            }

            ctx.stroke();
        }

        // Persona configurations
        const personas = {
            family: {
                name: 'Family Mode',
                expression: 'family',
                bgColor: '#ffdfbf',
                emoji: '👨‍👩‍👧‍👦'
            },
            friend: {
                name: 'Friends Mode',
                expression: 'friend',
                bgColor: '#b6e3f4',
                emoji: '🎉'
            },
            colleague: {
                name: 'Colleagues Mode',
                expression: 'colleague',
                bgColor: '#d1d4f9',
                emoji: '💼'
            },
            stranger: {
                name: 'Strangers Mode',
                expression: 'stranger',
                bgColor: '#c0aede',
                emoji: '🎭'
            }
        };

        // Get DOM elements
        const canvas = document.getElementById('avatar');
        const ctx = canvas.getContext('2d');
        const statusElement = document.getElementById('currentStatus');
        const buttons = document.querySelectorAll('.persona-button');
        const body = document.body;

        // Set canvas size
        canvas.width = 300;
        canvas.height = 300;

        // Switch persona function
        function switchPersona(personaKey) {
            const persona = personas[personaKey];

            // Add switching animation
            canvas.classList.add('switching');

            // Draw new avatar after animation delay
            setTimeout(() => {
                drawAvatar(ctx, persona.expression, persona.bgColor);
            }, 300);

            // Remove animation class
            setTimeout(() => {
                canvas.classList.remove('switching');
            }, 600);

            // Update background color
            body.className = personaKey;

            // Update status text
            statusElement.textContent = persona.name;

            // Update button states
            buttons.forEach(btn => {
                if (btn.dataset.persona === personaKey) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
        }

        // Add click events to buttons
        buttons.forEach(button => {
            button.addEventListener('click', () => {
                const personaKey = button.dataset.persona;
                switchPersona(personaKey);
            });
        });

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            const keyMap = {
                '1': 'family',
                '2': 'friend',
                '3': 'colleague',
                '4': 'stranger'
            };

            if (keyMap[e.key]) {
                switchPersona(keyMap[e.key]);
            }
        });

        // Draw initial avatar (family mode)
        drawAvatar(ctx, 'family', '#ffdfbf');
    </script>
</body>
</html>
