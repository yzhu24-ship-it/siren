<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>人生选择 - Life Choice Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            overflow: hidden;
            background: #f5f5f5;
        }

        #gameCanvas {
            display: block;
            background: linear-gradient(180deg, #e0e0e0 0%, #d0d0d0 50%, #c0c0c0 100%);
            cursor: pointer;
        }

        .ui-overlay {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            z-index: 100;
            pointer-events: none;
        }

        .game-title {
            color: #fff;
            font-size: 2rem;
            font-weight: 300;
            text-shadow: 2px 2px 8px rgba(0, 0, 0, 0.5);
            margin-bottom: 10px;
            letter-spacing: 4px;
        }

        .info-text {
            color: #fff;
            font-size: 1rem;
            text-shadow: 1px 1px 4px rgba(0, 0, 0, 0.5);
            opacity: 0.9;
        }

        .message-box {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 20px 40px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            max-width: 600px;
            text-align: center;
            z-index: 100;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .message-box.show {
            opacity: 1;
        }

        .message-box h3 {
            color: #333;
            font-size: 1.3rem;
            margin-bottom: 10px;
            font-weight: 500;
        }

        .message-box p {
            color: #666;
            font-size: 1rem;
            line-height: 1.6;
        }

        /* 小游戏覆盖层 */
        .minigame-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 200;
        }

        .minigame-overlay.show {
            display: flex;
        }

        .minigame-container {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            max-width: 90%;
            max-height: 90%;
            overflow: auto;
        }

        .minigame-title {
            text-align: center;
            color: #333;
            font-size: 1.8rem;
            margin-bottom: 10px;
        }

        .minigame-desc {
            text-align: center;
            color: #666;
            margin-bottom: 20px;
        }

        /* 数独游戏样式 */
        .sudoku-grid {
            display: inline-block;
            border: 3px solid #333;
            background: #fff;
            margin: 20px auto;
        }

        .sudoku-row {
            display: flex;
        }

        .sudoku-cell {
            width: 50px;
            height: 50px;
            border: 1px solid #ccc;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .sudoku-cell:hover:not(.fixed) {
            background: #e3f2fd;
        }

        .sudoku-cell.fixed {
            background: #f0f0f0;
            color: #000;
            cursor: default;
        }

        .sudoku-cell.error {
            background: #ffebee;
            color: #c62828;
        }

        .sudoku-cell.selected {
            background: #bbdefb;
            border: 2px solid #2196f3;
        }

        .sudoku-numbers {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .sudoku-number-btn {
            width: 50px;
            height: 50px;
            font-size: 1.5rem;
            font-weight: bold;
            border: 2px solid #2196f3;
            background: white;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .sudoku-number-btn:hover {
            background: #2196f3;
            color: white;
            transform: scale(1.1);
        }

        .minigame-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 20px;
        }

        .btn {
            padding: 12px 30px;
            font-size: 1.1rem;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 500;
        }

        .btn-primary {
            background: #4caf50;
            color: white;
        }

        .btn-primary:hover {
            background: #45a049;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: #f44336;
            color: white;
        }

        .btn-secondary:hover {
            background: #da190b;
            transform: translateY(-2px);
        }

        /* 答题游戏样式 */
        .quiz-container {
            text-align: center;
            max-width: 600px;
        }

        .quiz-timer {
            font-size: 3rem;
            font-weight: bold;
            color: #ff5722;
            margin: 20px 0;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

        .quiz-timer.warning {
            color: #f44336;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }

        .quiz-question {
            font-size: 1.5rem;
            color: #333;
            margin: 30px 0;
            line-height: 1.6;
            font-weight: 500;
        }

        .quiz-options {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin: 30px 0;
        }

        .quiz-option {
            padding: 20px;
            font-size: 1.2rem;
            background: white;
            border: 3px solid #2196f3;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s;
            text-align: left;
        }

        .quiz-option:hover {
            background: #e3f2fd;
            transform: translateX(10px);
            box-shadow: 0 5px 15px rgba(33, 150, 243, 0.3);
        }

        .quiz-option.selected {
            background: #2196f3;
            color: white;
            border-color: #1976d2;
        }

        .quiz-option.correct {
            background: #4caf50;
            color: white;
            border-color: #388e3c;
        }

        .quiz-option.incorrect {
            background: #f44336;
            color: white;
            border-color: #d32f2f;
        }

        @media (max-width: 768px) {
            .game-title {
                font-size: 1.5rem;
            }
            .message-box {
                max-width: 90%;
                padding: 15px 25px;
            }
            .sudoku-cell {
                width: 40px;
                height: 40px;
                font-size: 1.2rem;
            }
            .sudoku-number-btn {
                width: 40px;
                height: 40px;
                font-size: 1.2rem;
            }
        }
    </style>
</head>
<body>
    <div class="ui-overlay">
        <h1 class="game-title">人生选择</h1>
        <p class="info-text">点击左右门做出你的选择</p>
    </div>

    <div class="message-box" id="messageBox">
        <h3 id="messageTitle">欢迎</h3>
        <p id="messageContent">开始你的人生旅程</p>
    </div>

    <!-- 小游戏覆盖层 -->
    <div class="minigame-overlay" id="minigameOverlay">
        <div class="minigame-container" id="minigameContainer">
            <!-- 动态内容将在这里插入 -->
        </div>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        // ============================================
        // 游戏配置
        // ============================================
        const config = {
            roomColor: '#ffffff',
            floorColor: '#e8e8e8',
            shadowColor: 'rgba(0, 0, 0, 0.15)',
            doorLeftColor: '#5a9fd4',
            doorRightColor: '#d45a9f',
            characterColor: '#f0e4d7',
            characterOutline: '#8b7355'
        };

        // ============================================
        // Canvas 设置
        // ============================================
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            render();
        }

        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // ============================================
        // 游戏状态管理
        // ============================================
        const gameState = {
            currentModule: 'module0',
            playerX: canvas.width / 2,
            playerY: canvas.height * 0.7,
            hoveredDoor: null,
            animating: false,
            playerChoices: [], // 记录玩家的选择历史
            minigameActive: false
        };

        // ============================================
        // 模块定义
        // ============================================
        const modules = {
            module0: {
                type: 'choice',
                title: "人生的起点",
                question: "父母询问：是上学还是学体育？",
                hint: "（提示：主人公学习成绩好，体育也好）",
                leftDoor: {
                    label: "学习",
                    description: "选择走学习的道路",
                    nextModule: 'module1A'
                },
                rightDoor: {
                    label: "体育",
                    description: "选择体育专业发展",
                    nextModule: 'module1B'
                }
            },
            module1A: {
                type: 'minigame',
                gameType: 'sudoku',
                title: "数独挑战",
                description: "证明你的逻辑思维能力",
                difficulty: 'easy',
                onSuccess: 'module2A',
                onFailure: 'ending_mediocre'
            },
            module1B: {
                type: 'choice',
                title: "体育发展",
                question: "在体育道路上，你选择哪个方向？",
                leftDoor: {
                    label: "职业运动员",
                    description: "走向专业运动员道路",
                    nextModule: 'ending_athlete'
                },
                rightDoor: {
                    label: "体育教师",
                    description: "成为一名体育老师",
                    nextModule: 'ending_teacher'
                }
            },
            module2A: {
                type: 'choice',
                title: "文理分科",
                question: "高中文理分科，你选择？",
                leftDoor: {
                    label: "文科",
                    description: "选择文科，深入人文社科",
                    nextModule: 'module2A1_quiz'
                },
                rightDoor: {
                    label: "理科",
                    description: "选择理科，探索科学世界",
                    nextModule: 'ending_science'
                }
            },
            module2A1_quiz: {
                type: 'minigame',
                gameType: 'quiz',
                title: "地理知识挑战",
                description: "回答地理问题，展现你的知识储备",
                timeLimit: 30,
                question: "中国的首都是哪个城市？",
                options: [
                    { label: "A. 上海", value: "A", correct: false },
                    { label: "B. 北京", value: "B", correct: true },
                    { label: "C. 广州", value: "C", correct: false }
                ],
                onSuccess: 'ending_liberal_arts_success',
                onFailure: 'ending_liberal_arts_fail'
            },
            ending_mediocre: {
                type: 'ending',
                title: "平凡的人生",
                message: "虽然努力学习，但效果不佳，考上了一所普通大学。你过着平凡但安稳的生活。"
            },
            ending_athlete: {
                type: 'ending',
                title: "职业运动员",
                message: "你成为了一名职业运动员，在赛场上挥洒汗水，为国争光！"
            },
            ending_teacher: {
                type: 'ending',
                title: "体育教师",
                message: "你成为了一名受学生爱戴的体育老师，培养了无数体育人才。"
            },
            ending_liberal_arts_success: {
                type: 'ending',
                title: "职场精英",
                message: "你大学成绩优异，毕业后进入一家大公司工作，人生一帆风顺。"
            },
            ending_liberal_arts_fail: {
                type: 'ending',
                title: "普通文员",
                message: "你大学期间有些松懈，成绩平平，最终成为一名普通的公司文员。"
            },
            ending_science: {
                type: 'ending',
                title: "科学家",
                message: "你在理科道路上不断探索，成为了一名杰出的科学家，推动人类进步。"
            }
        };

        // ============================================
        // 数独游戏逻辑
        // ============================================
        class SudokuGame {
            constructor(size = 4) {
                this.size = size;
                this.grid = [];
                this.solution = [];
                this.selectedCell = null;
                this.generate();
            }

            generate() {
                // 生成一个简单的4x4数独
                // 解决方案
                this.solution = [
                    [1, 2, 3, 4],
                    [3, 4, 1, 2],
                    [2, 1, 4, 3],
                    [4, 3, 2, 1]
                ];

                // 创建谜题（隐藏一些数字）
                this.grid = this.solution.map(row => [...row]);

                // 随机移除一些数字
                const cellsToRemove = 6; // 移除6个数字
                let removed = 0;
                while (removed < cellsToRemove) {
                    const row = Math.floor(Math.random() * this.size);
                    const col = Math.floor(Math.random() * this.size);
                    if (this.grid[row][col] !== 0) {
                        this.grid[row][col] = 0;
                        removed++;
                    }
                }
            }

            isValid(row, col, num) {
                // 检查行
                for (let c = 0; c < this.size; c++) {
                    if (c !== col && this.grid[row][c] === num) {
                        return false;
                    }
                }

                // 检查列
                for (let r = 0; r < this.size; r++) {
                    if (r !== row && this.grid[r][col] === num) {
                        return false;
                    }
                }

                // 检查2x2宫格
                const boxRow = Math.floor(row / 2) * 2;
                const boxCol = Math.floor(col / 2) * 2;
                for (let r = boxRow; r < boxRow + 2; r++) {
                    for (let c = boxCol; c < boxCol + 2; c++) {
                        if ((r !== row || c !== col) && this.grid[r][c] === num) {
                            return false;
                        }
                    }
                }

                return true;
            }

            setCell(row, col, num) {
                this.grid[row][col] = num;
            }

            isComplete() {
                for (let r = 0; r < this.size; r++) {
                    for (let c = 0; c < this.size; c++) {
                        if (this.grid[r][c] === 0) {
                            return false;
                        }
                        if (this.grid[r][c] !== this.solution[r][c]) {
                            return false;
                        }
                    }
                }
                return true;
            }

            getCell(row, col) {
                return this.grid[row][col];
            }

            isFixed(row, col) {
                return this.solution[row][col] !== 0 && this.grid[row][col] === this.solution[row][col];
            }
        }

        let currentSudoku = null;

        // ============================================
        // 绘制函数
        // ============================================

        // 绘制房间
        function drawRoom() {
            const w = canvas.width;
            const h = canvas.height;

            // 墙壁
            const wallGradient = ctx.createLinearGradient(0, 0, 0, h * 0.6);
            wallGradient.addColorStop(0, '#f5f5f5');
            wallGradient.addColorStop(1, '#e0e0e0');
            ctx.fillStyle = wallGradient;
            ctx.fillRect(0, 0, w, h * 0.6);

            // 地板
            const floorGradient = ctx.createLinearGradient(0, h * 0.6, 0, h);
            floorGradient.addColorStop(0, '#d0d0d0');
            floorGradient.addColorStop(1, '#b0b0b0');
            ctx.fillStyle = floorGradient;
            ctx.fillRect(0, h * 0.6, w, h * 0.4);

            // 地板线条
            ctx.strokeStyle = 'rgba(0, 0, 0, 0.1)';
            ctx.lineWidth = 2;
            const centerX = w / 2;
            for (let i = 0; i < 5; i++) {
                const y = h * 0.6 + (h * 0.4 * (i + 1) / 6);
                ctx.beginPath();
                ctx.moveTo(centerX - 200 * (i + 1) / 5, y);
                ctx.lineTo(centerX + 200 * (i + 1) / 5, y);
                ctx.stroke();
            }
        }

        // 绘制门
        function drawDoor(x, y, width, height, color, label, isHovered) {
            const scale = isHovered ? 1.05 : 1;
            const scaledWidth = width * scale;
            const scaledHeight = height * scale;
            const offsetX = (scaledWidth - width) / 2;
            const offsetY = (scaledHeight - height) / 2;

            // 阴影
            ctx.fillStyle = config.shadowColor;
            ctx.fillRect(x - offsetX + 5, y - offsetY + 5, scaledWidth, scaledHeight);

            // 门框
            ctx.fillStyle = color;
            ctx.fillRect(x - offsetX, y - offsetY, scaledWidth, scaledHeight);

            // 高光
            const gradient = ctx.createLinearGradient(x, y, x + width, y);
            gradient.addColorStop(0, 'rgba(255, 255, 255, 0.3)');
            gradient.addColorStop(0.5, 'rgba(255, 255, 255, 0)');
            gradient.addColorStop(1, 'rgba(0, 0, 0, 0.2)');
            ctx.fillStyle = gradient;
            ctx.fillRect(x - offsetX, y - offsetY, scaledWidth, scaledHeight);

            // 门把手
            const handleY = y + height * 0.5;
            const handleX = x + width * 0.8;
            ctx.fillStyle = '#FFD700';
            ctx.beginPath();
            ctx.arc(handleX, handleY, 8, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#B8860B';
            ctx.lineWidth = 2;
            ctx.stroke();

            // 门标签
            ctx.fillStyle = '#fff';
            ctx.font = 'bold 24px sans-serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(label, x + width / 2, y + height / 2);

            if (isHovered) {
                ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
                ctx.fillRect(x - 20, y - 60, width + 40, 40);
                ctx.fillStyle = '#333';
                ctx.font = '16px sans-serif';
                ctx.fillText('点击进入', x + width / 2, y - 40);
            }
        }

        // 绘制信息板
        function drawInfoBoard() {
            const module = modules[gameState.currentModule];
            if (module.type !== 'choice') return;

            const boardX = canvas.width / 2 - 250;
            const boardY = canvas.height * 0.12;
            const boardWidth = 500;
            const boardHeight = 120;

            // 背景
            ctx.fillStyle = 'rgba(255, 255, 255, 0.95)';
            ctx.shadowColor = 'rgba(0, 0, 0, 0.3)';
            ctx.shadowBlur = 20;
            ctx.shadowOffsetX = 0;
            ctx.shadowOffsetY = 5;
            ctx.fillRect(boardX, boardY, boardWidth, boardHeight);
            ctx.shadowBlur = 0;

            // 边框
            ctx.strokeStyle = '#ddd';
            ctx.lineWidth = 3;
            ctx.strokeRect(boardX, boardY, boardWidth, boardHeight);

            // 标题
            ctx.fillStyle = '#2c3e50';
            ctx.font = 'bold 22px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(module.title, boardX + boardWidth / 2, boardY + 30);

            // 问题
            ctx.fillStyle = '#555';
            ctx.font = '18px sans-serif';
            ctx.fillText(module.question, boardX + boardWidth / 2, boardY + 60);

            // 提示
            if (module.hint) {
                ctx.fillStyle = '#888';
                ctx.font = '14px sans-serif';
                ctx.fillText(module.hint, boardX + boardWidth / 2, boardY + 90);
            }
        }

        // 绘制软体橡皮人角色
        function drawCharacter(x, y) {
            const time = Date.now() / 1000;
            const bounce = Math.sin(time * 2) * 3;

            // 阴影
            ctx.fillStyle = config.shadowColor;
            ctx.beginPath();
            ctx.ellipse(x, y + 45, 35, 10, 0, 0, Math.PI * 2);
            ctx.fill();

            // 身体
            ctx.fillStyle = config.characterColor;
            ctx.strokeStyle = config.characterOutline;
            ctx.lineWidth = 3;

            ctx.beginPath();
            ctx.moveTo(x, y - 40 + bounce);
            ctx.bezierCurveTo(x - 25, y - 30 + bounce, x - 30, y + 10, x - 20, y + 40);
            ctx.bezierCurveTo(x - 10, y + 45, x + 10, y + 45, x + 20, y + 40);
            ctx.bezierCurveTo(x + 30, y + 10, x + 25, y - 30 + bounce, x, y - 40 + bounce);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // 头
            ctx.beginPath();
            ctx.arc(x, y - 50 + bounce, 25, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            // 眼睛
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.arc(x - 8, y - 53 + bounce, 3, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(x + 8, y - 53 + bounce, 3, 0, Math.PI * 2);
            ctx.fill();

            // 嘴巴
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(x, y - 45 + bounce, 8, 0.2, Math.PI - 0.2);
            ctx.stroke();

            // 手臂
            ctx.strokeStyle = config.characterOutline;
            ctx.lineWidth = 3;
            ctx.lineCap = 'round';
            ctx.beginPath();
            ctx.moveTo(x - 22, y - 20 + bounce);
            ctx.quadraticCurveTo(x - 40, y - 10, x - 35, y + 5);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(x + 22, y - 20 + bounce);
            ctx.quadraticCurveTo(x + 40, y - 10, x + 35, y + 5);
            ctx.stroke();

            // 腿
            ctx.beginPath();
            ctx.moveTo(x - 10, y + 40);
            ctx.quadraticCurveTo(x - 15, y + 50, x - 10, y + 60);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(x + 10, y + 40);
            ctx.quadraticCurveTo(x + 15, y + 50, x + 10, y + 60);
            ctx.stroke();
        }

        // ============================================
        // 主渲染函数
        // ============================================
        function render() {
            const module = modules[gameState.currentModule];

            if (module.type === 'choice') {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                drawRoom();

                const doorWidth = 150;
                const doorHeight = 250;
                const doorY = canvas.height * 0.35;
                const leftDoorX = canvas.width * 0.25 - doorWidth / 2;
                const rightDoorX = canvas.width * 0.75 - doorWidth / 2;

                drawDoor(
                    leftDoorX, doorY, doorWidth, doorHeight,
                    config.doorLeftColor,
                    module.leftDoor.label,
                    gameState.hoveredDoor === 'left'
                );

                drawDoor(
                    rightDoorX, doorY, doorWidth, doorHeight,
                    config.doorRightColor,
                    module.rightDoor.label,
                    gameState.hoveredDoor === 'right'
                );

                drawInfoBoard();
                drawCharacter(gameState.playerX, gameState.playerY);
            } else if (module.type === 'ending') {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                drawRoom();
                drawCharacter(gameState.playerX, gameState.playerY);

                // 显示结局文字
                ctx.fillStyle = 'rgba(255, 255, 255, 0.95)';
                const boxWidth = 600;
                const boxHeight = 200;
                const boxX = canvas.width / 2 - boxWidth / 2;
                const boxY = canvas.height / 2 - boxHeight / 2;
                ctx.fillRect(boxX, boxY, boxWidth, boxHeight);

                ctx.strokeStyle = '#ddd';
                ctx.lineWidth = 3;
                ctx.strokeRect(boxX, boxY, boxWidth, boxHeight);

                ctx.fillStyle = '#2c3e50';
                ctx.font = 'bold 28px sans-serif';
                ctx.textAlign = 'center';
                ctx.fillText(module.title, canvas.width / 2, boxY + 60);

                ctx.fillStyle = '#555';
                ctx.font = '18px sans-serif';
                wrapText(ctx, module.message, canvas.width / 2, boxY + 100, boxWidth - 60, 25);
            }
        }

        // 文字换行
        function wrapText(context, text, x, y, maxWidth, lineHeight) {
            const words = text.split('');
            let line = '';
            let testLine = '';
            let lineArray = [];

            for (let n = 0; n < words.length; n++) {
                testLine += words[n];
                const metrics = context.measureText(testLine);
                if (metrics.width > maxWidth && n > 0) {
                    lineArray.push(line);
                    line = words[n];
                    testLine = words[n];
                } else {
                    line += words[n];
                }
            }
            lineArray.push(line);

            for (let k = 0; k < lineArray.length; k++) {
                context.fillText(lineArray[k], x, y + (k * lineHeight));
            }
        }

        // ============================================
        // 小游戏界面
        // ============================================
        function showSudokuGame() {
            gameState.minigameActive = true;
            currentSudoku = new SudokuGame(4);

            const container = document.getElementById('minigameContainer');
            container.innerHTML = `
                <h2 class="minigame-title">数独挑战</h2>
                <p class="minigame-desc">填入1-4的数字，使每行、每列和每个2x2宫格都不重复</p>
                <div style="text-align: center;">
                    <div class="sudoku-grid" id="sudokuGrid"></div>
                    <div class="sudoku-numbers" id="sudokuNumbers"></div>
                </div>
                <div class="minigame-buttons">
                    <button class="btn btn-primary" onclick="checkSudoku()">检查答案</button>
                    <button class="btn btn-secondary" onclick="giveUpSudoku()">放弃</button>
                </div>
            `;

            renderSudokuGrid();
            renderSudokuNumbers();

            document.getElementById('minigameOverlay').classList.add('show');
        }

        function renderSudokuGrid() {
            const grid = document.getElementById('sudokuGrid');
            grid.innerHTML = '';

            for (let r = 0; r < 4; r++) {
                const row = document.createElement('div');
                row.className = 'sudoku-row';

                for (let c = 0; c < 4; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'sudoku-cell';
                    cell.dataset.row = r;
                    cell.dataset.col = c;

                    const value = currentSudoku.getCell(r, c);
                    if (value !== 0) {
                        cell.textContent = value;
                        if (currentSudoku.solution[r][c] === value) {
                            cell.classList.add('fixed');
                        }
                    }

                    cell.onclick = () => selectSudokuCell(r, c);
                    row.appendChild(cell);
                }

                grid.appendChild(row);
            }
        }

        function renderSudokuNumbers() {
            const numbers = document.getElementById('sudokuNumbers');
            numbers.innerHTML = '';

            for (let i = 1; i <= 4; i++) {
                const btn = document.createElement('button');
                btn.className = 'sudoku-number-btn';
                btn.textContent = i;
                btn.onclick = () => placeSudokuNumber(i);
                numbers.appendChild(btn);
            }

            // 清除按钮
            const clearBtn = document.createElement('button');
            clearBtn.className = 'sudoku-number-btn';
            clearBtn.textContent = '✗';
            clearBtn.onclick = () => placeSudokuNumber(0);
            numbers.appendChild(clearBtn);
        }

        let selectedSudokuCell = null;

        function selectSudokuCell(row, col) {
            // 移除之前的选中状态
            const cells = document.querySelectorAll('.sudoku-cell');
            cells.forEach(c => c.classList.remove('selected'));

            // 检查是否是固定单元格
            if (currentSudoku.solution[row][col] !== 0 &&
                currentSudoku.getCell(row, col) === currentSudoku.solution[row][col]) {
                return;
            }

            selectedSudokuCell = { row, col };
            const cell = document.querySelector(`[data-row="${row}"][data-col="${col}"]`);
            cell.classList.add('selected');
        }

        function placeSudokuNumber(num) {
            if (!selectedSudokuCell) return;

            const { row, col } = selectedSudokuCell;
            currentSudoku.setCell(row, col, num);
            renderSudokuGrid();

            // 重新选中
            if (num !== 0) {
                selectSudokuCell(row, col);
            }
        }

        function checkSudoku() {
            if (currentSudoku.isComplete()) {
                showMessage('成功！', '你成功完成了数独！', 3000);
                setTimeout(() => {
                    closeSudoku(true);
                }, 3000);
            } else {
                showMessage('还没完成', '还有错误或空格，请继续努力！', 2000);
            }
        }

        function giveUpSudoku() {
            if (confirm('确定要放弃吗？这将导致失败结局。')) {
                closeSudoku(false);
            }
        }

        function closeSudoku(success) {
            document.getElementById('minigameOverlay').classList.remove('show');
            gameState.minigameActive = false;

            const module = modules[gameState.currentModule];
            const nextModule = success ? module.onSuccess : module.onFailure;

            setTimeout(() => {
                gameState.currentModule = nextModule;
                gameState.playerX = canvas.width / 2;
                render();

                const newModule = modules[nextModule];
                if (newModule.type === 'ending') {
                    showMessage(newModule.title, newModule.message, 5000);
                }
            }, 500);
        }

        // ============================================
        // 答题游戏逻辑
        // ============================================
        let quizTimer = null;
        let quizTimeLeft = 0;
        let quizSelectedAnswer = null;

        function showQuizGame() {
            gameState.minigameActive = true;
            const module = modules[gameState.currentModule];

            quizTimeLeft = module.timeLimit;
            quizSelectedAnswer = null;

            const container = document.getElementById('minigameContainer');
            container.innerHTML = `
                <div class="quiz-container">
                    <h2 class="minigame-title">${module.title}</h2>
                    <p class="minigame-desc">${module.description}</p>
                    <div class="quiz-timer" id="quizTimer">${quizTimeLeft}秒</div>
                    <div class="quiz-question">${module.question}</div>
                    <div class="quiz-options" id="quizOptions"></div>
                    <div class="minigame-buttons">
                        <button class="btn btn-primary" onclick="submitQuizAnswer()" id="submitBtn">提交答案</button>
                    </div>
                </div>
            `;

            renderQuizOptions();
            startQuizTimer();

            document.getElementById('minigameOverlay').classList.add('show');
        }

        function renderQuizOptions() {
            const module = modules[gameState.currentModule];
            const optionsContainer = document.getElementById('quizOptions');
            optionsContainer.innerHTML = '';

            module.options.forEach((option, index) => {
                const optionDiv = document.createElement('div');
                optionDiv.className = 'quiz-option';
                optionDiv.textContent = option.label;
                optionDiv.dataset.value = option.value;
                optionDiv.dataset.correct = option.correct;
                optionDiv.onclick = () => selectQuizOption(index);
                optionsContainer.appendChild(optionDiv);
            });
        }

        function selectQuizOption(index) {
            const module = modules[gameState.currentModule];
            const options = document.querySelectorAll('.quiz-option');

            // 移除之前的选中状态
            options.forEach(opt => opt.classList.remove('selected'));

            // 选中当前选项
            options[index].classList.add('selected');
            quizSelectedAnswer = module.options[index];
        }

        function startQuizTimer() {
            const timerDisplay = document.getElementById('quizTimer');

            quizTimer = setInterval(() => {
                quizTimeLeft--;
                timerDisplay.textContent = `${quizTimeLeft}秒`;

                // 最后10秒警告
                if (quizTimeLeft <= 10) {
                    timerDisplay.classList.add('warning');
                }

                // 时间到
                if (quizTimeLeft <= 0) {
                    clearInterval(quizTimer);
                    showMessage('时间到！', '很遗憾，你没有在规定时间内作答', 3000);
                    setTimeout(() => {
                        closeQuiz(false);
                    }, 3000);
                }
            }, 1000);
        }

        function submitQuizAnswer() {
            if (!quizSelectedAnswer) {
                showMessage('请选择答案', '请先选择一个答案再提交', 2000);
                return;
            }

            clearInterval(quizTimer);

            const options = document.querySelectorAll('.quiz-option');
            const module = modules[gameState.currentModule];

            // 显示正确答案
            options.forEach(opt => {
                if (opt.dataset.correct === 'true') {
                    opt.classList.add('correct');
                } else if (opt.classList.contains('selected')) {
                    opt.classList.add('incorrect');
                }
                opt.onclick = null; // 禁用点击
            });

            // 禁用提交按钮
            document.getElementById('submitBtn').disabled = true;

            const isCorrect = quizSelectedAnswer.correct;

            if (isCorrect) {
                showMessage('回答正确！', '恭喜你答对了！', 3000);
                setTimeout(() => {
                    closeQuiz(true);
                }, 3000);
            } else {
                showMessage('回答错误', '很遗憾，答案不正确', 3000);
                setTimeout(() => {
                    closeQuiz(false);
                }, 3000);
            }
        }

        function closeQuiz(success) {
            if (quizTimer) {
                clearInterval(quizTimer);
            }

            document.getElementById('minigameOverlay').classList.remove('show');
            gameState.minigameActive = false;

            const module = modules[gameState.currentModule];
            const nextModule = success ? module.onSuccess : module.onFailure;

            setTimeout(() => {
                gameState.currentModule = nextModule;
                gameState.playerX = canvas.width / 2;
                render();

                const newModule = modules[nextModule];
                if (newModule.type === 'ending') {
                    showMessage(newModule.title, newModule.message, 5000);
                }
            }, 500);
        }

        // ============================================
        // 交互处理
        // ============================================
        function checkDoorHover(mouseX, mouseY) {
            const module = modules[gameState.currentModule];
            if (module.type !== 'choice') return null;

            const doorWidth = 150;
            const doorHeight = 250;
            const doorY = canvas.height * 0.35;
            const leftDoorX = canvas.width * 0.25 - doorWidth / 2;
            const rightDoorX = canvas.width * 0.75 - doorWidth / 2;

            if (mouseX >= leftDoorX && mouseX <= leftDoorX + doorWidth &&
                mouseY >= doorY && mouseY <= doorY + doorHeight) {
                return 'left';
            }

            if (mouseX >= rightDoorX && mouseX <= rightDoorX + doorWidth &&
                mouseY >= doorY && mouseY <= doorY + doorHeight) {
                return 'right';
            }

            return null;
        }

        function showMessage(title, content, duration = 3000) {
            const messageBox = document.getElementById('messageBox');
            const messageTitle = document.getElementById('messageTitle');
            const messageContent = document.getElementById('messageContent');

            messageTitle.textContent = title;
            messageContent.textContent = content;
            messageBox.classList.add('show');

            setTimeout(() => {
                messageBox.classList.remove('show');
            }, duration);
        }

        function chooseDoor(door) {
            if (gameState.animating) return;

            const module = modules[gameState.currentModule];
            if (module.type !== 'choice') return;

            gameState.animating = true;
            const choice = door === 'left' ? module.leftDoor : module.rightDoor;

            // 记录选择
            gameState.playerChoices.push({
                module: gameState.currentModule,
                choice: door,
                label: choice.label
            });

            showMessage(`你选择了: ${choice.label}`, choice.description);

            // 角色移动
            const targetX = door === 'left' ? canvas.width * 0.25 : canvas.width * 0.75;
            const duration = 1000;
            const startX = gameState.playerX;
            const startTime = Date.now();

            function animate() {
                const elapsed = Date.now() - startTime;
                const progress = Math.min(elapsed / duration, 1);

                gameState.playerX = startX + (targetX - startX) * easeInOutQuad(progress);
                render();

                if (progress < 1) {
                    requestAnimationFrame(animate);
                } else {
                    setTimeout(() => {
                        const nextModule = choice.nextModule;
                        gameState.currentModule = nextModule;
                        gameState.playerX = canvas.width / 2;
                        gameState.animating = false;

                        const newModule = modules[nextModule];

                        if (newModule.type === 'minigame') {
                            if (newModule.gameType === 'sudoku') {
                                showSudokuGame();
                            } else if (newModule.gameType === 'quiz') {
                                showQuizGame();
                            }
                        } else if (newModule.type === 'ending') {
                            render();
                            showMessage(newModule.title, newModule.message, 5000);
                        } else {
                            render();
                        }
                    }, 1000);
                }
            }

            animate();
        }

        function easeInOutQuad(t) {
            return t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;
        }

        // 事件监听
        canvas.addEventListener('mousemove', (e) => {
            if (gameState.minigameActive) return;

            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            const hoveredDoor = checkDoorHover(mouseX, mouseY);

            if (hoveredDoor !== gameState.hoveredDoor) {
                gameState.hoveredDoor = hoveredDoor;
                canvas.style.cursor = hoveredDoor ? 'pointer' : 'default';
                render();
            }
        });

        canvas.addEventListener('click', (e) => {
            if (gameState.animating || gameState.minigameActive) return;

            const rect = canvas.getBoundingClientRect();
            const mouseX = e.clientX - rect.left;
            const mouseY = e.clientY - rect.top;

            const clickedDoor = checkDoorHover(mouseX, mouseY);

            if (clickedDoor) {
                chooseDoor(clickedDoor);
            }
        });

        document.addEventListener('keydown', (e) => {
            if (gameState.animating || gameState.minigameActive) return;

            if (e.key === 'ArrowLeft') {
                chooseDoor('left');
            } else if (e.key === 'ArrowRight') {
                chooseDoor('right');
            }
        });

        // ============================================
        // 游戏循环
        // ============================================
        function gameLoop() {
            render();
            requestAnimationFrame(gameLoop);
        }

        // 启动游戏
        showMessage(
            '欢迎来到人生选择',
            '父母询问：是上学还是学体育？做出你的选择开始旅程',
            4000
        );

        gameLoop();
    </script>
</body>
</html>
