<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rusty Lake Mystery - The Black Cube</title>
    <!-- Version 3.0 - Visual Image-Based Interface -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: #0a0a0a;
            color: #e8e8e8;
            overflow: hidden;
            height: 100vh;
        }

        .game-layout {
            display: flex;
            height: 100vh;
            width: 100vw;
        }

        /* Main view area - 75% width */
        .main-view {
            flex: 0 0 75%;
            position: relative;
            background: linear-gradient(180deg, #a8d8f0 0%, #b8e8ff 100%);
            display: flex;
            flex-direction: column;
        }

        .wall-container {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .wall {
            width: 100%;
            height: 100%;
            position: absolute;
            display: none;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        .wall.active {
            display: block;
        }

        /* Navigation arrows */
        .nav-arrows {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 40px;
            z-index: 100;
        }

        .nav-btn {
            width: 50px;
            height: 50px;
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid #8b7355;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: #c9a56f;
            transition: all 0.3s;
            user-select: none;
        }

        .nav-btn:hover {
            background: rgba(0, 0, 0, 0.7);
            box-shadow: 0 0 15px rgba(201, 165, 111, 0.5);
            transform: scale(1.1);
        }

        .wall-indicator {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            padding: 10px 20px;
            border-radius: 20px;
            border: 2px solid #8b7355;
            color: #c9a56f;
            font-size: 16px;
            z-index: 100;
        }

        /* Right side panel - 25% width */
        .right-panel {
            flex: 0 0 25%;
            background: linear-gradient(180deg, #1a1a2e 0%, #16213e 100%);
            border-left: 3px solid #8b7355;
            display: flex;
            flex-direction: column;
            padding: 20px;
            overflow-y: auto;
        }

        .panel-header {
            text-align: center;
            font-size: 24px;
            color: #c9a56f;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.8);
        }

        .clues-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 30px;
        }

        .clue-box {
            aspect-ratio: 1;
            border: 2px solid #8b7355;
            border-radius: 10px;
            background: rgba(26, 26, 46, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            transition: all 0.3s;
        }

        .clue-box.empty {
            border-style: dashed;
            opacity: 0.4;
        }

        .clue-box.filled {
            border-color: #c9a56f;
            box-shadow: 0 0 15px rgba(201, 165, 111, 0.3);
        }

        .clue-box.new-item {
            animation: itemPulse 1s ease-in-out;
        }

        @keyframes itemPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); box-shadow: 0 0 25px rgba(201, 165, 111, 0.8); }
        }

        .clue-image {
            width: 90%;
            height: 90%;
            object-fit: contain;
        }

        .clue-text {
            text-align: center;
            padding: 10px;
            font-size: 12px;
            color: #c9a56f;
            word-wrap: break-word;
        }

        .clue-icon {
            font-size: 40px;
        }

        /* Event log */
        .event-log {
            flex: 1;
            border: 2px solid #8b7355;
            border-radius: 10px;
            padding: 15px;
            background: rgba(0, 0, 0, 0.5);
            overflow-y: auto;
            max-height: 200px;
        }

        .log-title {
            color: #c9a56f;
            font-size: 14px;
            margin-bottom: 10px;
            text-align: center;
        }

        .log-message {
            padding: 5px;
            margin: 5px 0;
            font-size: 12px;
            border-left: 2px solid #8b7355;
            padding-left: 10px;
            animation: fadeIn 0.5s;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateX(-10px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .log-message.important {
            color: #90ff90;
            border-left-color: #90ff90;
        }

        .log-message.error {
            color: #ff6b6b;
            border-left-color: #ff6b6b;
        }

        /* Clickable hotspots on walls */
        .hotspot {
            position: absolute;
            cursor: pointer;
            transition: all 0.3s;
            border: 3px solid transparent;
            border-radius: 5px;
        }

        .hotspot:hover {
            border-color: rgba(201, 165, 111, 0.8);
            box-shadow: 0 0 20px rgba(201, 165, 111, 0.6);
            transform: scale(1.05);
        }

        .hotspot.selected {
            border-color: #90ff90;
            animation: hotspotGlow 1.5s infinite;
        }

        @keyframes hotspotGlow {
            0%, 100% { box-shadow: 0 0 15px rgba(144, 255, 144, 0.6); }
            50% { box-shadow: 0 0 30px rgba(144, 255, 144, 1); }
        }

        /* Modal for detailed views */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            border: 3px solid #8b7355;
            border-radius: 15px;
            padding: 40px;
            max-width: 600px;
            max-height: 80vh;
            overflow-y: auto;
            position: relative;
        }

        .modal-close {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 30px;
            cursor: pointer;
            color: #c9a56f;
            border: none;
            background: none;
        }

        .modal-close:hover {
            color: #ff6b6b;
        }

        .modal-title {
            font-size: 28px;
            color: #c9a56f;
            margin-bottom: 20px;
            text-align: center;
        }

        .modal-description {
            font-size: 16px;
            line-height: 1.6;
            margin-bottom: 20px;
            color: #e8e8e8;
        }

        .modal-input {
            width: 100%;
            padding: 15px;
            font-size: 18px;
            background: rgba(0, 0, 0, 0.5);
            border: 2px solid #8b7355;
            border-radius: 5px;
            color: #c9a56f;
            text-align: center;
            font-family: 'Courier New', monospace;
            margin: 20px 0;
        }

        .modal-btn {
            width: 100%;
            padding: 15px;
            font-size: 18px;
            background: #8b7355;
            border: none;
            border-radius: 5px;
            color: #fff;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            margin-top: 10px;
            transition: all 0.3s;
        }

        .modal-btn:hover {
            background: #a88866;
            box-shadow: 0 0 15px rgba(139, 115, 85, 0.6);
        }

        .modal-btn:disabled {
            background: #555;
            cursor: not-allowed;
            opacity: 0.5;
        }

        /* Control buttons */
        .controls {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            gap: 10px;
            z-index: 100;
        }

        .control-btn {
            padding: 10px 20px;
            background: rgba(0, 0, 0, 0.7);
            border: 2px solid #8b7355;
            border-radius: 5px;
            color: #c9a56f;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            transition: all 0.3s;
        }

        .control-btn:hover {
            background: rgba(0, 0, 0, 0.9);
            box-shadow: 0 0 10px rgba(139, 115, 85, 0.6);
        }

        /* Cabinet/Furniture styles */
        .furniture-view {
            width: 100%;
            max-width: 500px;
            margin: 20px auto;
            text-align: center;
        }

        .furniture-image {
            width: 100%;
            height: auto;
            border: 2px solid #8b7355;
            border-radius: 10px;
            margin-bottom: 20px;
        }

        .lock-icon {
            font-size: 60px;
            margin: 20px 0;
        }

        /* Wall placeholder backgrounds */
        .wall-1 {
            background-image: url('30441762907866_.pic_hd.jpg');
            background-size: cover;
            background-position: center;
        }

        .wall-2 {
            background-image: url('30451762908484_.pic_hd.jpg');
            background-size: cover;
            background-position: center;
        }

        .wall-3 {
            background-image: url('30471762909008_.pic_hd.jpg');
            background-size: cover;
            background-position: center;
        }

        .wall-4 {
            background-image: url('30481762909291_.pic_hd.jpg');
            background-size: cover;
            background-position: center;
        }

        /* Transparent hotspot areas - no visual styling needed as images show objects */
    </style>
</head>
<body>
    <div class="game-layout">
        <!-- Main view area -->
        <div class="main-view">
            <div class="wall-indicator">Wall <span id="wallNumber">1</span> of 4</div>

            <div class="controls">
                <button class="control-btn" onclick="game.saveGame()">💾 Save</button>
                <button class="control-btn" onclick="game.loadGame()">📂 Load</button>
            </div>

            <div class="wall-container">
                <!-- Wall 1: Exit Door -->
                <div class="wall wall-1 active" id="wall-1">
                    <!-- Door hotspot (center) -->
                    <div class="hotspot"
                         style="position: absolute; top: 20%; left: 50%; transform: translateX(-50%); width: 280px; height: 380px;"
                         onclick="game.clickHotspot('door')"
                         id="hotspot-door">
                    </div>
                </div>

                <!-- Wall 2: Desk and Cabinet -->
                <div class="wall wall-2" id="wall-2">
                    <!-- Desk hotspot (left side) -->
                    <div class="hotspot"
                         style="position: absolute; bottom: 18%; left: 20%; width: 320px; height: 220px;"
                         onclick="game.clickHotspot('desk')"
                         id="hotspot-desk">
                    </div>

                    <!-- Tall Cabinet hotspot (right side) -->
                    <div class="hotspot"
                         style="position: absolute; top: 22%; right: 18%; width: 190px; height: 420px;"
                         onclick="game.clickHotspot('cabinet')"
                         id="hotspot-cabinet">
                    </div>
                </div>

                <!-- Wall 3: Storage Cabinet and Window -->
                <div class="wall wall-3" id="wall-3">
                    <!-- Storage Cabinet hotspot (center-bottom) -->
                    <div class="hotspot"
                         style="position: absolute; bottom: 18%; left: 32%; width: 280px; height: 230px;"
                         onclick="game.clickHotspot('storage')"
                         id="hotspot-storage">
                    </div>

                    <!-- Window hotspot (right-top) -->
                    <div class="hotspot"
                         style="position: absolute; top: 12%; right: 10%; width: 160px; height: 210px;"
                         onclick="game.clickHotspot('window1')"
                         id="hotspot-window1">
                    </div>
                </div>

                <!-- Wall 4: Bookshelf and Window -->
                <div class="wall wall-4" id="wall-4">
                    <!-- Bookshelf hotspot (center-bottom) -->
                    <div class="hotspot"
                         style="position: absolute; bottom: 18%; left: 25%; width: 450px; height: 270px;"
                         onclick="game.clickHotspot('bookshelf')"
                         id="hotspot-bookshelf">
                    </div>

                    <!-- Window hotspot (right-top) -->
                    <div class="hotspot"
                         style="position: absolute; top: 12%; right: 10%; width: 160px; height: 210px;"
                         onclick="game.clickHotspot('window2')"
                         id="hotspot-window2">
                    </div>
                </div>
            </div>

            <!-- Navigation arrows -->
            <div class="nav-arrows">
                <div class="nav-btn" onclick="game.previousWall()">◀</div>
                <div class="nav-btn" onclick="game.nextWall()">▶</div>
            </div>
        </div>

        <!-- Right panel for clues -->
        <div class="right-panel">
            <div class="panel-header">🔍 Clues & Items</div>
            <div class="clues-grid" id="cluesGrid">
                <!-- 8 clue boxes -->
                <div class="clue-box empty" id="clue-0"></div>
                <div class="clue-box empty" id="clue-1"></div>
                <div class="clue-box empty" id="clue-2"></div>
                <div class="clue-box empty" id="clue-3"></div>
                <div class="clue-box empty" id="clue-4"></div>
                <div class="clue-box empty" id="clue-5"></div>
                <div class="clue-box empty" id="clue-6"></div>
                <div class="clue-box empty" id="clue-7"></div>
            </div>

            <div class="event-log">
                <div class="log-title">📰 Event Log</div>
                <div id="logContainer"></div>
            </div>
        </div>
    </div>

    <!-- Modal for interactions -->
    <div class="modal" id="modal">
        <div class="modal-content">
            <button class="modal-close" onclick="game.closeModal()">×</button>
            <div id="modalBody"></div>
        </div>
    </div>

    <script>
        class RustyLakeGame {
            constructor() {
                this.currentWall = 1;
                this.selectedHotspot = null;
                this.clues = [];
                this.puzzleStates = {
                    desk: { examined: false },
                    cabinet: { locked: true },
                    gameWon: false
                };

                this.init();
            }

            init() {
                this.addLog("Welcome to Rusty Lake Mystery...", "important");
                this.addLog("Explore the room by clicking on objects and switching between walls.");
            }

            nextWall() {
                this.currentWall = (this.currentWall % 4) + 1;
                this.updateWall();
            }

            previousWall() {
                this.currentWall = this.currentWall === 1 ? 4 : this.currentWall - 1;
                this.updateWall();
            }

            updateWall() {
                document.querySelectorAll('.wall').forEach(w => w.classList.remove('active'));
                document.getElementById(`wall-${this.currentWall}`).classList.add('active');
                document.getElementById('wallNumber').textContent = this.currentWall;
                this.clearSelection();
            }

            clickHotspot(itemKey) {
                // Clear previous selection
                this.clearSelection();

                // Select this hotspot
                this.selectedHotspot = itemKey;
                const hotspot = document.getElementById(`hotspot-${itemKey}`);
                if (hotspot) {
                    hotspot.classList.add('selected');
                }

                this.addLog(`Selected: ${this.getItemName(itemKey)}`, "important");

                // Open interaction modal
                this.openInteractionModal(itemKey);
            }

            clearSelection() {
                document.querySelectorAll('.hotspot').forEach(h => h.classList.remove('selected'));
                this.selectedHotspot = null;
            }

            getItemName(key) {
                const names = {
                    door: "Exit Door",
                    desk: "Wooden Desk",
                    cabinet: "Tall Cabinet",
                    storage: "Storage Cabinet",
                    window1: "Window",
                    bookshelf: "Bookshelf",
                    window2: "Window"
                };
                return names[key] || key;
            }

            openInteractionModal(itemKey) {
                const modal = document.getElementById('modal');
                const modalBody = document.getElementById('modalBody');

                let content = '';

                switch(itemKey) {
                    case 'door':
                        content = this.getDoorModal();
                        break;
                    case 'desk':
                        content = this.getDeskModal();
                        break;
                    case 'cabinet':
                        content = this.getCabinetModal();
                        break;
                    case 'storage':
                        content = this.getStorageModal();
                        break;
                    case 'window1':
                    case 'window2':
                        content = this.getWindowModal();
                        break;
                    case 'bookshelf':
                        content = this.getBookshelfModal();
                        break;
                }

                modalBody.innerHTML = content;
                modal.classList.add('active');
            }


            getWindowModal() {
                return `
                    <h2 class="modal-title">Window</h2>
                    <div class="modal-description">
                        Through the frosted glass, you see nothing but darkness.
                        The window is sealed shut. A cold draft seeps through the cracks.
                    </div>
                    <div class="furniture-view">
                        <div style="font-size: 100px; margin: 30px 0;">🪟</div>
                        <div style="color: #888; font-style: italic;">
                            No escape this way...
                        </div>
                    </div>
                    <button class="modal-btn" onclick="game.closeModal()">Close</button>
                `;
            }

            getDeskModal() {
                if (!this.puzzleStates.desk.examined) {
                    this.puzzleStates.desk.examined = true;
                    return `
                        <h2 class="modal-title">Wooden Desk</h2>
                        <div class="modal-description">
                            A simple wooden desk with a drawer.
                            You open the drawer and find a note with numbers written on it...
                        </div>
                        <div class="furniture-view">
                            <div style="font-size: 80px; margin: 30px 0;">📝</div>
                            <div style="color: #c9a56f; font-size: 36px; font-weight: bold; margin: 20px 0;">
                                3 - 7 - 6
                            </div>
                        </div>
                        <button class="modal-btn" onclick="game.collectDeskClue()">Take the Note</button>
                    `;
                } else {
                    return `
                        <h2 class="modal-title">Wooden Desk</h2>
                        <div class="modal-description">
                            The drawer is empty now. You already took the note with numbers: 3-7-6
                        </div>
                        <button class="modal-btn" onclick="game.closeModal()">Close</button>
                    `;
                }
            }

            collectDeskClue() {
                if (!this.hasClue('code')) {
                    this.addClue({ icon: '📄', text: 'Code: 376', type: 'code' });
                    this.addLog("Found a code: 376", "important");
                }
                this.closeModal();
            }

            getStorageModal() {
                return `
                    <h2 class="modal-title">Storage Cabinet</h2>
                    <div class="modal-description">
                        A low storage cabinet with two doors.
                        Inside you find old tools and supplies. Nothing immediately useful...
                    </div>
                    <div class="furniture-view">
                        <div style="font-size: 100px; margin: 30px 0;">🗄️</div>
                        <div style="color: #888; font-style: italic;">
                            Just storage. Nothing special here.
                        </div>
                    </div>
                    <button class="modal-btn" onclick="game.closeModal()">Close</button>
                `;
            }

            getCabinetModal() {
                if (this.puzzleStates.cabinet.locked) {
                    return `
                        <h2 class="modal-title">Cabinet</h2>
                        <div class="modal-description">
                            A tall wooden cabinet with a numerical lock.
                            You need to enter a 3-digit code.
                        </div>
                        <div class="furniture-view">
                            <div style="font-size: 100px; margin: 30px 0;">🚪</div>
                            <div class="lock-icon">🔢</div>
                        </div>
                        <input type="text" class="modal-input" placeholder="Enter 3-digit code..."
                               id="cabinetCode" maxlength="3">
                        <button class="modal-btn" onclick="game.tryUnlockCabinet()">Unlock</button>
                        <button class="modal-btn" onclick="game.closeModal()">Close</button>
                    `;
                } else {
                    return `
                        <h2 class="modal-title">Cabinet</h2>
                        <div class="modal-description">
                            The cabinet door swings open. Inside, resting on black velvet,
                            is the mysterious Black Cube!
                        </div>
                        <div class="furniture-view">
                            <div style="font-size: 120px; margin: 30px 0;">⬛</div>
                            <div style="color: #c9a56f; font-size: 24px; margin: 20px 0;">
                                You Win!
                            </div>
                        </div>
                        <button class="modal-btn" onclick="game.winGame()">Take the Black Cube</button>
                    `;
                }
            }

            tryUnlockCabinet() {
                const input = document.getElementById('cabinetCode');
                const code = input ? input.value : '';

                if (code === '376') {
                    this.puzzleStates.cabinet.locked = false;
                    this.puzzleStates.cabinet.solved = true;
                    this.addLog("Cabinet unlocked! You found the Black Cube!", "important");
                    this.openInteractionModal('cabinet');
                } else {
                    this.addLog("Wrong code...", "error");
                }
            }

            winGame() {
                this.addClue({ icon: '⬛', text: 'Black Cube', type: 'final' });
                this.addLog("CONGRATULATIONS! You escaped the room!", "important");
                this.puzzleStates.gameWon = true;
                this.closeModal();

                setTimeout(() => {
                    alert('🎉 Congratulations! You solved the mystery and found the Black Cube!\n\nNow you can use it to open the exit door on Wall 4!');
                }, 500);
            }

            getDoorModal() {
                if (!this.puzzleStates.gameWon) {
                    return `
                        <h2 class="modal-title">Exit Door</h2>
                        <div class="modal-description">
                            A heavy wooden door. It's locked from the inside.
                            You need something special to unlock it...
                        </div>
                        <div class="furniture-view">
                            <div style="font-size: 120px; margin: 30px 0;">🚪</div>
                            <div class="lock-icon">🔒</div>
                            <div style="color: #ff6b6b;">
                                The door won't budge. You need to find the Black Cube first.
                            </div>
                        </div>
                        <button class="modal-btn" onclick="game.closeModal()">Close</button>
                    `;
                } else {
                    return `
                        <h2 class="modal-title">Exit Door</h2>
                        <div class="modal-description">
                            You place the Black Cube into the door's lock mechanism.
                            With a deep rumble, the door swings open!
                            Blinding light floods in from the outside...
                        </div>
                        <div class="furniture-view">
                            <div style="font-size: 120px; margin: 30px 0;">🚪✨</div>
                            <div style="color: #90ff90; font-size: 24px; margin: 20px 0;">
                                Freedom at last!
                            </div>
                            <div style="color: #c9a56f; font-style: italic; margin: 20px 0;">
                                "Thank you for playing Rusty Lake Mystery!"
                            </div>
                        </div>
                        <button class="modal-btn" onclick="game.closeModal()">Close</button>
                    `;
                }
            }

            getBookshelfModal() {
                return `
                    <h2 class="modal-title">Bookshelf</h2>
                    <div class="modal-description">
                        An old wooden bookshelf filled with dusty volumes.
                        You pull out a few books - they're all written in strange symbols.
                        One book titled "The Theory of Cubes" catches your eye...
                    </div>
                    <div class="furniture-view">
                        <div style="font-size: 100px; margin: 30px 0;">📚</div>
                        <div style="color: #c9a56f; font-style: italic; margin: 20px 0;">
                            "When darkness is complete, the cube shall provide the key to freedom."
                        </div>
                    </div>
                    <button class="modal-btn" onclick="game.closeModal()">Close</button>
                `;
            }


            addClue(clue) {
                if (this.clues.length < 8) {
                    this.clues.push(clue);
                    const index = this.clues.length - 1;
                    const clueBox = document.getElementById(`clue-${index}`);

                    clueBox.classList.remove('empty');
                    clueBox.classList.add('filled', 'new-item');
                    clueBox.innerHTML = `
                        <div>
                            <div class="clue-icon">${clue.icon}</div>
                            <div class="clue-text">${clue.text}</div>
                        </div>
                    `;

                    setTimeout(() => clueBox.classList.remove('new-item'), 1000);
                }
            }

            hasClue(type) {
                return this.clues.some(c => c.text.toLowerCase().includes(type) || c.type === type);
            }

            addLog(message, type = '') {
                const logContainer = document.getElementById('logContainer');
                const logMsg = document.createElement('div');
                logMsg.className = `log-message ${type}`;
                logMsg.textContent = message;
                logContainer.appendChild(logMsg);
                logContainer.scrollTop = logContainer.scrollHeight;
            }

            closeModal() {
                document.getElementById('modal').classList.remove('active');
            }

            saveGame() {
                const saveData = {
                    currentWall: this.currentWall,
                    clues: this.clues,
                    puzzleStates: this.puzzleStates
                };
                localStorage.setItem('rustyLakeSave', JSON.stringify(saveData));
                this.addLog("Game saved!", "important");
            }

            loadGame() {
                const saveData = localStorage.getItem('rustyLakeSave');
                if (saveData) {
                    const data = JSON.parse(saveData);
                    this.currentWall = data.currentWall;
                    this.puzzleStates = data.puzzleStates;
                    this.clues = [];

                    // Clear clue boxes
                    for (let i = 0; i < 8; i++) {
                        const box = document.getElementById(`clue-${i}`);
                        box.classList.add('empty');
                        box.classList.remove('filled');
                        box.innerHTML = '';
                    }

                    // Restore clues
                    data.clues.forEach(clue => this.addClue(clue));

                    this.updateWall();
                    this.addLog("Game loaded!", "important");
                } else {
                    this.addLog("No save file found!", "error");
                }
            }
        }

        // Initialize game
        const game = new RustyLakeGame();
    </script>
</body>
</html>
