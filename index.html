<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rusty Lake Mystery Room</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', serif;
            background: #000;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        /* Main game container */
        .game-container {
            display: flex;
            height: 100vh;
            width: 100vw;
            position: relative;
        }

        /* Main scene area - with vignette effect */
        .scene-area {
            flex: 1;
            position: relative;
            background: #2a1f1a;
            overflow: hidden;
        }

        /* Vignette dark edges effect - DISABLED, images already have vignette */
        .scene-area::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            /* box-shadow: inset 0 0 200px 100px rgba(0,0,0,0.8); */
            pointer-events: none;
            z-index: 1000;
        }

        /* Room walls */
        .room-wall {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            display: none;
            background-size: cover;
            background-position: center;
        }

        .room-wall.active {
            display: block;
        }

        /* Wall 1 - Front wall (窗户墙) - Initial state: only window + painting */
        .wall-front {
            background:
                /* Wood texture */
                repeating-linear-gradient(0deg,
                    transparent 0px,
                    transparent 39px,
                    rgba(139, 115, 85, 0.3) 39px,
                    rgba(139, 115, 85, 0.3) 40px
                ),
                linear-gradient(180deg,
                    #c9a982 0%,
                    #b89872 30%,
                    #a68968 60%,
                    #8b7355 100%
                );
        }

        /* Window frame */
        .window {
            position: absolute;
            left: 50%;
            top: 25%;
            transform: translateX(-50%);
            width: 45%;
            height: 50%;
            background: linear-gradient(135deg, #d4a574 0%, #c9a982 100%);
            border: 8px solid #5a4a35;
            box-shadow:
                inset 0 0 20px rgba(0,0,0,0.3),
                0 10px 30px rgba(0,0,0,0.5);
        }

        /* Window inner frame */
        .window::before {
            content: '';
            position: absolute;
            top: 5%;
            left: 5%;
            right: 5%;
            bottom: 5%;
            border: 3px solid #8b7355;
            background: linear-gradient(180deg, #e8d4c0 0%, #d4c4a0 100%);
        }

        /* Lake painting inside window */
        .lake-painting {
            position: absolute;
            top: 8%;
            left: 8%;
            right: 8%;
            bottom: 8%;
            background-image: url('前.JPG');
            background-size: 270%;
            background-position: 50% 48%;
            background-repeat: no-repeat;
            transition: all 0.6s ease;
            cursor: pointer;
            border: 3px solid transparent;
            box-shadow: 0 0 0 rgba(255, 215, 0, 0);
        }

        /* Click animation */
        @keyframes paintingPulse {
            0% {
                transform: scale(1);
                box-shadow: 0 0 0 rgba(255, 215, 0, 0.7);
            }
            50% {
                transform: scale(1.05);
                box-shadow: 0 0 30px rgba(255, 215, 0, 0.9);
            }
            100% {
                transform: scale(1);
                box-shadow: 0 0 0 rgba(255, 215, 0, 0);
            }
        }

        .lake-painting.clicked {
            animation: paintingPulse 0.6s ease-out;
        }

        /* Painting state 1 - Normal (default) */
        .lake-painting.state-1 {
            filter: brightness(1) saturate(1);
            border-color: rgba(139, 115, 85, 0.5);
        }

        /* Painting state 2 - Brighter, revealing hidden details */
        .lake-painting.state-2 {
            filter: brightness(1.3) saturate(1.2) contrast(1.1);
            border-color: rgba(255, 215, 0, 0.8);
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.6);
        }

        /* Painting state 3 - Dark and mysterious */
        .lake-painting.state-3 {
            filter: brightness(0.6) saturate(0.8) hue-rotate(10deg);
            border-color: rgba(138, 43, 226, 0.8);
            box-shadow: 0 0 20px rgba(138, 43, 226, 0.6);
        }

        /* Painting state 4 - Inverted colors (hidden clue) */
        .lake-painting.state-4 {
            filter: invert(1) hue-rotate(180deg);
            border-color: rgba(0, 255, 255, 0.8);
            box-shadow: 0 0 25px rgba(0, 255, 255, 0.7);
        }

        /* Click counter badge */
        .click-counter {
            position: absolute;
            top: -15px;
            right: -15px;
            width: 45px;
            height: 45px;
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a52 100%);
            border: 3px solid #fff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
            color: #fff;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
            z-index: 10;
            animation: counterPop 0.3s ease-out;
        }

        @keyframes counterPop {
            0% {
                transform: scale(0.5);
                opacity: 0;
            }
            50% {
                transform: scale(1.2);
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* Hidden clue text overlay */
        .clue-overlay {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            color: #ffd700;
            padding: 20px 30px;
            border: 3px solid #ffd700;
            border-radius: 10px;
            font-size: 24px;
            font-weight: bold;
            text-align: center;
            z-index: 20;
            animation: clueReveal 1s ease-out;
            pointer-events: none;
        }

        @keyframes clueReveal {
            0% {
                transform: translate(-50%, -50%) scale(0) rotate(-180deg);
                opacity: 0;
            }
            100% {
                transform: translate(-50%, -50%) scale(1) rotate(0deg);
                opacity: 1;
            }
        }

        /* Wall 2 - Right wall (桌子+柜子墙) */
        .wall-right {
            background:
                /* Wood texture */
                repeating-linear-gradient(0deg,
                    transparent 0px,
                    transparent 39px,
                    rgba(139, 115, 85, 0.3) 39px,
                    rgba(139, 115, 85, 0.3) 40px
                ),
                linear-gradient(180deg,
                    #c9a982 0%,
                    #b89872 30%,
                    #a68968 60%,
                    #8b7355 100%
                );
        }

        /* Desk on right wall */
        .desk {
            position: absolute;
            left: 20%;
            bottom: 22%;
            width: 30%;
            height: 32%;
            background: linear-gradient(180deg, #8b9a6a 0%, #7a8a5a 50%, #6a7a4a 100%);
            border: 3px solid #5a6a3a;
            perspective: 600px;
        }

        /* Desk drawer */
        .desk::before {
            content: '';
            position: absolute;
            top: 15%;
            left: 10%;
            right: 10%;
            height: 25%;
            background: linear-gradient(135deg, #6a7a4a 0%, #5a6a3a 100%);
            border: 2px solid #4a5a2a;
            border-radius: 3px;
            transition: transform 0.4s ease;
        }

        /* Desk drawer handle */
        .desk::after {
            content: '';
            position: absolute;
            top: 27%;
            left: 50%;
            transform: translateX(-50%);
            width: 20%;
            height: 6%;
            background: linear-gradient(90deg, #d4a050 0%, #c49040 50%, #a47830 100%);
            border-radius: 8px;
            transition: transform 0.4s ease;
            z-index: 2;
        }

        /* Tall cabinet on right wall */
        .tall-cabinet {
            position: absolute;
            right: 22%;
            bottom: 22%;
            width: 22%;
            height: 45%;
            background: linear-gradient(180deg, #7a9a6a 0%, #6a8a5a 100%);
            border: 4px solid #5a7a4a;
            perspective: 800px;
        }

        /* Cabinet top door */
        .cabinet-top-door {
            position: absolute;
            top: 5%;
            left: 10%;
            right: 10%;
            height: 42%;
            background: linear-gradient(135deg, #6a8a5a 0%, #5a7a4a 100%);
            border: 3px solid #4a6a3a;
            border-radius: 4px;
            box-shadow: inset 2px 2px 5px rgba(0,0,0,0.3);
            transition: transform 0.5s ease;
            transform-style: preserve-3d;
            transform-origin: left center;
        }

        /* Cabinet bottom door */
        .cabinet-bottom-door {
            position: absolute;
            top: 52%;
            left: 10%;
            right: 10%;
            height: 42%;
            background: linear-gradient(135deg, #6a8a5a 0%, #5a7a4a 100%);
            border: 3px solid #4a6a3a;
            border-radius: 4px;
            box-shadow: inset 2px 2px 5px rgba(0,0,0,0.3);
            transition: transform 0.5s ease;
            transform-style: preserve-3d;
            transform-origin: left center;
        }

        /* Cabinet door handles */
        .cabinet-handle {
            position: absolute;
            width: 8px;
            height: 8px;
            background: #2a2a2a;
            border-radius: 50%;
            right: 15%;
            top: 50%;
            transform: translateY(-50%);
        }

        /* Fishing rod leaning on wall */
        .fishing-rod-right {
            position: absolute;
            right: 17%;
            bottom: 22%;
            width: 8px;
            height: 40%;
            background: linear-gradient(180deg, #8b6535 0%, #6a4a25 100%);
            transform: rotate(-10deg);
            transform-origin: bottom right;
            border-radius: 4px;
        }

        /* Wall 3 - Back wall (储物墙) */
        .wall-back {
            background:
                /* Wood texture */
                repeating-linear-gradient(0deg,
                    transparent 0px,
                    transparent 39px,
                    rgba(139, 115, 85, 0.3) 39px,
                    rgba(139, 115, 85, 0.3) 40px
                ),
                linear-gradient(180deg,
                    #c9a982 0%,
                    #b89872 30%,
                    #a68968 60%,
                    #8b7355 100%
                );
        }

        /* Wall cabinet on back wall */
        .wall-cabinet {
            position: absolute;
            right: 25%;
            top: 18%;
            width: 18%;
            height: 22%;
            background: linear-gradient(180deg, #8a9a7a 0%, #7a8a6a 100%);
            border: 3px solid #5a6a4a;
            box-shadow: 0 8px 16px rgba(0,0,0,0.4);
            perspective: 600px;
        }

        /* Wall cabinet shelves (3 layers) */
        .wall-cabinet::before {
            content: '';
            position: absolute;
            top: 33%;
            left: 8%;
            right: 8%;
            height: 2px;
            background: #4a5a3a;
            box-shadow: 0 34% 0 #4a5a3a;
            z-index: 1;
        }

        /* Wall cabinet door */
        .wall-cabinet-door {
            position: absolute;
            top: 5%;
            left: 5%;
            right: 5%;
            bottom: 5%;
            background: linear-gradient(135deg, #7a8a6a 0%, #6a7a5a 100%);
            border: 2px solid #5a6a4a;
            border-radius: 3px;
            box-shadow: inset 1px 1px 3px rgba(0,0,0,0.3);
            transition: transform 0.5s ease;
            transform-style: preserve-3d;
            z-index: 3;
        }

        /* Wall cabinet door handle */
        .wall-cabinet-door::after {
            content: '';
            position: absolute;
            left: 10%;
            top: 50%;
            transform: translateY(-50%);
            width: 8px;
            height: 8px;
            background: #2a2a2a;
            border-radius: 50%;
        }

        /* Floor cabinet on back wall */
        .floor-cabinet {
            position: absolute;
            left: 28%;
            bottom: 22%;
            width: 28%;
            height: 28%;
            background: linear-gradient(180deg, #7a9a6a 0%, #6a8a5a 100%);
            border: 4px solid #5a7a4a;
            perspective: 800px;
        }

        /* Floor cabinet left door */
        .floor-cabinet-left-door {
            position: absolute;
            top: 8%;
            left: 8%;
            width: 42%;
            height: 84%;
            background: linear-gradient(135deg, #6a8a5a 0%, #5a7a4a 100%);
            border: 3px solid #4a6a3a;
            border-radius: 4px;
            box-shadow: inset 2px 2px 5px rgba(0,0,0,0.3);
            transition: transform 0.5s ease;
            transform-style: preserve-3d;
            transform-origin: left center;
        }

        /* Floor cabinet right door */
        .floor-cabinet-right-door {
            position: absolute;
            top: 8%;
            right: 8%;
            width: 42%;
            height: 84%;
            background: linear-gradient(135deg, #6a8a5a 0%, #5a7a4a 100%);
            border: 3px solid #4a6a3a;
            border-radius: 4px;
            box-shadow: inset 2px 2px 5px rgba(0,0,0,0.3);
            transition: transform 0.5s ease;
            transform-style: preserve-3d;
            transform-origin: right center;
        }

        /* Floor cabinet handles */
        .floor-cabinet-handle {
            position: absolute;
            width: 8px;
            height: 8px;
            background: #2a2a2a;
            border-radius: 50%;
            top: 50%;
            transform: translateY(-50%);
        }

        /* Floor cabinet left door handle position */
        .floor-cabinet-left-door .floor-cabinet-handle {
            right: 15%;
        }

        /* Floor cabinet right door handle position */
        .floor-cabinet-right-door .floor-cabinet-handle {
            left: 15%;
        }

        /* Wall 4 - Left wall (窗户+凳子墙) */
        .wall-left {
            background:
                /* Wood texture */
                repeating-linear-gradient(0deg,
                    transparent 0px,
                    transparent 39px,
                    rgba(139, 115, 85, 0.3) 39px,
                    rgba(139, 115, 85, 0.3) 40px
                ),
                linear-gradient(180deg,
                    #c9a982 0%,
                    #b89872 30%,
                    #a68968 60%,
                    #8b7355 100%
                );
        }

        /* Window on left wall (same as front wall) */
        .window-left {
            position: absolute;
            left: 28%;
            top: 18%;
            width: 35%;
            height: 38%;
            background: linear-gradient(135deg, #d4a574 0%, #c9a982 100%);
            border: 8px solid #5a4a35;
            box-shadow:
                inset 0 0 20px rgba(0,0,0,0.3),
                0 10px 30px rgba(0,0,0,0.5);
        }

        /* Window left inner frame */
        .window-left::before {
            content: '';
            position: absolute;
            top: 5%;
            left: 5%;
            right: 5%;
            bottom: 5%;
            border: 3px solid #8b7355;
            background: linear-gradient(180deg, #e8d4c0 0%, #d4c4a0 100%);
        }

        /* Lake painting in left window */
        .lake-painting-left {
            position: absolute;
            top: 8%;
            left: 8%;
            right: 8%;
            bottom: 8%;
            background:
                /* Mountain */
                linear-gradient(135deg,
                    transparent 0%,
                    transparent 30%,
                    #5a4a5a 30%,
                    #6a5a6a 35%,
                    #4a3a4a 40%,
                    transparent 40%
                ),
                /* Trees */
                radial-gradient(ellipse at 20% 55%, #2d4a3a 0%, transparent 15%),
                radial-gradient(ellipse at 35% 58%, #1d3a2a 0%, transparent 12%),
                radial-gradient(ellipse at 50% 60%, #2d4a3a 0%, transparent 10%),
                /* Water */
                linear-gradient(180deg,
                    transparent 0%,
                    transparent 50%,
                    #4a7a8a 50%,
                    #3a6a7a 70%,
                    #2a5a6a 100%
                ),
                /* Sky */
                linear-gradient(180deg,
                    #e8c4a0 0%,
                    #ffd4a0 20%,
                    #d4b490 50%
                );
        }

        /* Blue stool on left wall */
        .stool {
            position: absolute;
            left: 50%;
            bottom: 24%;
            transform: translateX(-50%);
            width: 12%;
            height: 16%;
        }

        /* Stool seat */
        .stool::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 35%;
            background: linear-gradient(180deg, #6a8aaa 0%, #5a7a9a 100%);
            border: 3px solid #4a6a8a;
            border-radius: 50% 50% 45% 45%;
        }

        /* Stool legs */
        .stool::after {
            content: '';
            position: absolute;
            top: 35%;
            left: 15%;
            right: 15%;
            bottom: 0;
            background: linear-gradient(180deg, #3a4a5a 0%, #2a3a4a 100%);
            border-left: 3px solid #2a3a4a;
            border-right: 3px solid #2a3a4a;
        }

        /* Ceiling */
        .ceiling {
            background:
                /* Wood texture */
                repeating-linear-gradient(0deg,
                    transparent 0px,
                    transparent 39px,
                    rgba(139, 115, 85, 0.3) 39px,
                    rgba(139, 115, 85, 0.3) 40px
                ),
                linear-gradient(180deg,
                    #c9a982 0%,
                    #b89872 30%,
                    #a68968 60%,
                    #8b7355 100%
                );
        }

        /* Small object on ceiling */
        .ceiling-object {
            position: absolute;
            left: 50%;
            top: 35%;
            transform: translate(-50%, -50%);
            width: 40px;
            height: 25px;
            background: linear-gradient(135deg, #8a6a4a 0%, #6a4a3a 100%);
            border: 2px solid #4a3a2a;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
        }

        /* Floor with wood planks */
        .floor {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 120px; /* Account for toolbar */
            height: 20%;
            background:
                /* Wood planks horizontal */
                repeating-linear-gradient(0deg,
                    transparent 0%,
                    transparent 18%,
                    rgba(0,0,0,0.2) 18%,
                    rgba(0,0,0,0.2) 20%,
                    transparent 20%
                ),
                /* Shadow at wall edge */
                linear-gradient(180deg,
                    rgba(0,0,0,0.4) 0%,
                    transparent 20%
                ),
                /* Base wood color */
                linear-gradient(180deg,
                    #5a4a35 0%,
                    #4a3a25 50%,
                    #3a2a15 100%
                );
            z-index: 10;
        }

        /* Left side wall edge for perspective */
        .wall-left-edge {
            position: absolute;
            top: 0;
            bottom: 20%;
            left: 0;
            width: 8%;
            background: linear-gradient(90deg,
                rgba(0,0,0,0.6) 0%,
                rgba(0,0,0,0.3) 50%,
                transparent 100%
            );
            z-index: 5;
        }

        /* Right side wall edge for perspective */
        .wall-right-edge {
            position: absolute;
            top: 0;
            bottom: 20%;
            right: 120px; /* Account for toolbar */
            width: 8%;
            background: linear-gradient(-90deg,
                rgba(0,0,0,0.6) 0%,
                rgba(0,0,0,0.3) 50%,
                transparent 100%
            );
            z-index: 5;
        }

        /* Navigation arrows */
        .nav-container {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 200px;
            z-index: 1001;
        }

        .nav-arrow {
            width: 0;
            height: 0;
            cursor: pointer;
            transition: all 0.3s;
        }

        .nav-arrow.left {
            border-top: 20px solid transparent;
            border-bottom: 20px solid transparent;
            border-right: 30px solid rgba(255, 255, 255, 0.6);
        }

        .nav-arrow.right {
            border-top: 20px solid transparent;
            border-bottom: 20px solid transparent;
            border-left: 30px solid rgba(255, 255, 255, 0.6);
        }

        .nav-arrow:hover {
            transform: scale(1.2);
        }

        .nav-arrow.left:hover {
            border-right-color: rgba(255, 255, 255, 0.9);
        }

        .nav-arrow.right:hover {
            border-left-color: rgba(255, 255, 255, 0.9);
        }

        /* Up arrow for ceiling */
        .nav-up {
            position: absolute;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-bottom: 30px solid rgba(255, 255, 255, 0.6);
            cursor: pointer;
            transition: all 0.3s;
            z-index: 1001;
        }

        .nav-up:hover {
            transform: translateX(-50%) scale(1.2);
            border-bottom-color: rgba(255, 255, 255, 0.9);
        }

        /* Right toolbar */
        .toolbar {
            width: 120px;
            background: linear-gradient(180deg, #2a2520 0%, #1a1510 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 10px;
            gap: 15px;
            position: relative;
            z-index: 1002;
        }

        /* Toolbar icons (inventory slots) */
        .toolbar-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #e8d4a0 0%, #c9b888 100%);
            border: 3px solid #8b7355;
            border-radius: 8px;
            box-shadow:
                inset 0 2px 5px rgba(255,255,255,0.3),
                inset 0 -2px 5px rgba(0,0,0,0.3),
                0 4px 8px rgba(0,0,0,0.5);
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
        }

        .toolbar-icon:hover {
            transform: scale(1.05);
            box-shadow:
                inset 0 2px 5px rgba(255,255,255,0.3),
                inset 0 -2px 5px rgba(0,0,0,0.3),
                0 6px 12px rgba(0,0,0,0.7);
        }

        .toolbar-icon.active {
            background: linear-gradient(135deg, #ffd700 0%, #e8b800 100%);
            box-shadow:
                inset 0 2px 5px rgba(255,255,255,0.5),
                inset 0 -2px 5px rgba(0,0,0,0.2),
                0 0 20px rgba(255,215,0,0.6);
        }

        .toolbar-icon.empty {
            background: linear-gradient(135deg, #d4c4a0 0%, #b9a888 100%);
            cursor: default;
        }

        .toolbar-icon.empty:hover {
            transform: none;
        }

        /* Wall indicator */
        .wall-indicator {
            position: absolute;
            top: 20px;
            right: 140px;
            color: #fff;
            font-size: 18px;
            z-index: 1001;
            background: rgba(0,0,0,0.6);
            padding: 8px 16px;
            border-radius: 20px;
        }

        /* Dialog box */
        .dialog {
            position: absolute;
            bottom: 120px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.9);
            color: #fff;
            padding: 20px 30px;
            border-radius: 10px;
            border: 2px solid #8b7355;
            max-width: 500px;
            display: none;
            z-index: 1003;
            font-size: 16px;
            text-align: center;
            box-shadow: 0 8px 16px rgba(0,0,0,0.8);
        }

        .dialog.show {
            display: block;
        }

        .dialog::after {
            content: '▼';
            position: absolute;
            bottom: -15px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(0, 0, 0, 0.9);
            font-size: 20px;
        }

        /* Interactive elements */
        .interactive {
            cursor: pointer;
            transition: all 0.3s;
        }

        .interactive:hover {
            filter: brightness(1.1);
        }

        /* Desk drawer - opened state */
        .desk.opened::before {
            transform: rotateX(85deg);
            transform-origin: bottom center;
        }

        /* Desk drawer handle - opened state */
        .desk.opened::after {
            transform: translateX(-50%) rotateX(85deg);
            transform-origin: bottom center;
        }

        /* Desk interior shadow when opened */
        .desk.opened {
            box-shadow: inset 0 10px 30px rgba(0,0,0,0.6);
        }

        /* Cabinet top door - opened state */
        .cabinet-top-door.opened {
            transform: rotateY(-110deg);
        }

        /* Cabinet bottom door - opened state */
        .cabinet-bottom-door.opened {
            transform: rotateY(-110deg);
        }

        /* Tall cabinet interior shadow when opened */
        .tall-cabinet.opened {
            box-shadow: inset 0 20px 40px rgba(0,0,0,0.7);
        }

        /* Wall cabinet - opened state */
        .wall-cabinet.opened {
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
        }

        /* Wall cabinet door - opened state */
        .wall-cabinet-door.opened {
            transform: rotateY(-110deg);
            transform-origin: left center;
        }

        /* Floor cabinet left door - opened state */
        .floor-cabinet-left-door.opened {
            transform: rotateY(-110deg);
        }

        /* Floor cabinet right door - opened state */
        .floor-cabinet-right-door.opened {
            transform: rotateY(110deg);
        }

        /* Floor cabinet interior shadow when opened */
        .floor-cabinet.opened {
            box-shadow: inset 0 0 30px rgba(0,0,0,0.7);
        }
    </style>
</head>
<body>
    <div class="game-container">
        <!-- Main scene area -->
        <div class="scene-area">
            <!-- Wall indicator -->
            <div class="wall-indicator">
                <span id="wallName">前墙</span>
            </div>

            <!-- Up arrow for ceiling view -->
            <div class="nav-up" onclick="game.viewCeiling()"></div>

            <!-- Room walls -->
            <div class="room-wall wall-front active" id="wall-1">
                <!-- Initial state: only window + painting (no fishing rod, no shadow) -->
                <div class="window">
                    <div class="lake-painting interactive" id="painting">
                        <div class="click-counter" id="painting-counter">0</div>
                    </div>
                </div>
            </div>
            <div class="room-wall wall-right" id="wall-2">
                <!-- Desk with drawer -->
                <div class="desk interactive" id="desk"></div>
                <!-- Tall cabinet with 2 doors -->
                <div class="tall-cabinet" id="tall-cabinet">
                    <div class="cabinet-top-door interactive" id="cabinet-top-door">
                        <div class="cabinet-handle"></div>
                    </div>
                    <div class="cabinet-bottom-door interactive" id="cabinet-bottom-door">
                        <div class="cabinet-handle"></div>
                    </div>
                </div>
                <!-- Fishing rod leaning on wall -->
                <div class="fishing-rod-right"></div>
            </div>
            <div class="room-wall wall-back" id="wall-3">
                <!-- Wall cabinet (3 shelves) -->
                <div class="wall-cabinet interactive" id="wall-cabinet">
                    <div class="wall-cabinet-door interactive" id="wall-cabinet-door"></div>
                </div>
                <!-- Floor cabinet with 2 doors -->
                <div class="floor-cabinet" id="floor-cabinet">
                    <div class="floor-cabinet-left-door interactive" id="floor-cabinet-left-door">
                        <div class="floor-cabinet-handle"></div>
                    </div>
                    <div class="floor-cabinet-right-door interactive" id="floor-cabinet-right-door">
                        <div class="floor-cabinet-handle"></div>
                    </div>
                </div>
            </div>
            <div class="room-wall wall-left" id="wall-4">
                <!-- Window with lake painting -->
                <div class="window-left">
                    <div class="lake-painting-left"></div>
                </div>
                <!-- Blue stool -->
                <div class="stool"></div>
            </div>
            <div class="room-wall ceiling" id="ceiling">
                <!-- Small object on ceiling -->
                <div class="ceiling-object"></div>
            </div>

            <!-- Side edges for perspective (not visible on ceiling view) -->
            <div class="wall-left-edge" id="left-edge"></div>
            <div class="wall-right-edge" id="right-edge"></div>

            <!-- Floor (always visible) -->
            <div class="floor"></div>

            <!-- Navigation arrows -->
            <div class="nav-container">
                <div class="nav-arrow left" onclick="game.previousWall()"></div>
                <div class="nav-arrow right" onclick="game.nextWall()"></div>
            </div>

            <!-- Dialog box -->
            <div class="dialog" id="dialog"></div>
        </div>

        <!-- Right toolbar (inventory) -->
        <div class="toolbar" id="toolbar">
            <!-- Inventory slots will be generated here -->
        </div>
    </div>

    <script>
        class RustyLakeRoom {
            constructor() {
                this.currentWall = 1;
                this.wallNames = ['前墙', '右墙', '后墙', '左墙', '天花板'];
                this.inventory = [];
                this.maxInventorySlots = 8;
                this.selectedItem = null;
                this.paintingState = 1; // Track painting state (1-4)
                this.paintingClicks = 0; // Track number of clicks

                this.init();
            }

            init() {
                this.setupToolbar();
                this.updateWallIndicator();
                this.setupInteractions();
                this.showDialog('欢迎来到神秘房间');
            }

            setupInteractions() {
                // Desk drawer
                const desk = document.getElementById('desk');
                if (desk) {
                    desk.addEventListener('click', (e) => {
                        e.stopPropagation();
                        desk.classList.toggle('opened');
                        const state = desk.classList.contains('opened') ? '打开' : '关闭';
                        this.showDialog(`书桌抽屉已${state}`);
                    });
                }

                // Tall cabinet top door
                const cabinetTopDoor = document.getElementById('cabinet-top-door');
                if (cabinetTopDoor) {
                    cabinetTopDoor.addEventListener('click', (e) => {
                        e.stopPropagation();
                        cabinetTopDoor.classList.toggle('opened');
                        const tallCabinet = document.getElementById('tall-cabinet');
                        if (tallCabinet) {
                            tallCabinet.classList.toggle('opened');
                        }
                        const state = cabinetTopDoor.classList.contains('opened') ? '打开' : '关闭';
                        this.showDialog(`高柜上门已${state}`);
                    });
                }

                // Tall cabinet bottom door
                const cabinetBottomDoor = document.getElementById('cabinet-bottom-door');
                if (cabinetBottomDoor) {
                    cabinetBottomDoor.addEventListener('click', (e) => {
                        e.stopPropagation();
                        cabinetBottomDoor.classList.toggle('opened');
                        const state = cabinetBottomDoor.classList.contains('opened') ? '打开' : '关闭';
                        this.showDialog(`高柜下门已${state}`);
                    });
                }

                // Wall cabinet door
                const wallCabinetDoor = document.getElementById('wall-cabinet-door');
                if (wallCabinetDoor) {
                    wallCabinetDoor.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const wallCabinet = document.getElementById('wall-cabinet');
                        wallCabinetDoor.classList.toggle('opened');
                        if (wallCabinet) {
                            wallCabinet.classList.toggle('opened');
                        }
                        const state = wallCabinetDoor.classList.contains('opened') ? '打开' : '关闭';
                        this.showDialog(`壁柜已${state}`);
                    });
                }

                // Floor cabinet left door
                const floorCabinetLeftDoor = document.getElementById('floor-cabinet-left-door');
                if (floorCabinetLeftDoor) {
                    floorCabinetLeftDoor.addEventListener('click', (e) => {
                        e.stopPropagation();
                        floorCabinetLeftDoor.classList.toggle('opened');
                        const floorCabinet = document.getElementById('floor-cabinet');
                        if (floorCabinet) {
                            floorCabinet.classList.toggle('opened');
                        }
                        const state = floorCabinetLeftDoor.classList.contains('opened') ? '打开' : '关闭';
                        this.showDialog(`地柜左门已${state}`);
                    });
                }

                // Floor cabinet right door
                const floorCabinetRightDoor = document.getElementById('floor-cabinet-right-door');
                if (floorCabinetRightDoor) {
                    floorCabinetRightDoor.addEventListener('click', (e) => {
                        e.stopPropagation();
                        floorCabinetRightDoor.classList.toggle('opened');
                        const state = floorCabinetRightDoor.classList.contains('opened') ? '打开' : '关闭';
                        this.showDialog(`地柜右门已${state}`);
                    });
                }

                // Painting on front wall (interactive clue)
                const painting = document.getElementById('painting');
                if (painting) {
                    painting.addEventListener('click', (e) => {
                        e.stopPropagation();
                        this.cyclePaintingState();
                    });
                }
            }

            setupToolbar() {
                const toolbar = document.getElementById('toolbar');
                toolbar.innerHTML = '';

                // Create inventory slots
                for (let i = 0; i < this.maxInventorySlots; i++) {
                    const slot = document.createElement('div');
                    slot.className = 'toolbar-icon empty';
                    slot.id = `slot-${i}`;
                    toolbar.appendChild(slot);
                }
            }

            nextWall() {
                if (this.currentWall === 5) {
                    this.currentWall = 1;
                } else {
                    this.currentWall = this.currentWall === 4 ? 1 : this.currentWall + 1;
                }
                this.updateWall();
            }

            previousWall() {
                if (this.currentWall === 5) {
                    this.currentWall = 1;
                } else {
                    this.currentWall = this.currentWall === 1 ? 4 : this.currentWall - 1;
                }
                this.updateWall();
            }

            viewCeiling() {
                this.currentWall = 5;
                this.updateWall();
            }

            updateWall() {
                // Hide all walls
                document.querySelectorAll('.room-wall').forEach(wall => {
                    wall.classList.remove('active');
                });

                const floor = document.querySelector('.floor');
                const leftEdge = document.getElementById('left-edge');
                const rightEdge = document.getElementById('right-edge');

                // Show current wall
                if (this.currentWall === 5) {
                    // Ceiling view - hide floor and edges
                    document.getElementById('ceiling').classList.add('active');
                    if (floor) floor.style.display = 'none';
                    if (leftEdge) leftEdge.style.display = 'none';
                    if (rightEdge) rightEdge.style.display = 'none';
                } else {
                    // Wall view - show floor and edges
                    document.getElementById(`wall-${this.currentWall}`).classList.add('active');
                    if (floor) floor.style.display = 'block';
                    if (leftEdge) leftEdge.style.display = 'block';
                    if (rightEdge) rightEdge.style.display = 'block';
                }

                this.updateWallIndicator();
            }

            updateWallIndicator() {
                document.getElementById('wallName').textContent = this.wallNames[this.currentWall - 1];
            }

            showDialog(message) {
                const dialog = document.getElementById('dialog');
                dialog.innerHTML = message;
                dialog.classList.add('show');
                setTimeout(() => {
                    dialog.classList.remove('show');
                }, 3000);
            }

            cyclePaintingState() {
                const painting = document.getElementById('painting');
                const counter = document.getElementById('painting-counter');
                if (!painting) return;

                this.paintingClicks++;

                // Update counter display with animation
                if (counter) {
                    counter.textContent = this.paintingClicks;
                    // Re-trigger animation
                    counter.style.animation = 'none';
                    setTimeout(() => {
                        counter.style.animation = 'counterPop 0.3s ease-out';
                    }, 10);
                }

                // Trigger click animation on painting
                painting.classList.remove('clicked');
                setTimeout(() => {
                    painting.classList.add('clicked');
                }, 10);

                // Remove current state class
                painting.classList.remove(`state-${this.paintingState}`);

                // Cycle to next state (1 -> 2 -> 3 -> 4 -> 1)
                this.paintingState = (this.paintingState % 4) + 1;

                // Add new state class
                painting.classList.add(`state-${this.paintingState}`);

                // Show different messages based on state
                const messages = {
                    1: '画恢复了正常...',
                    2: '画变亮了，似乎能看到更多细节...',
                    3: '画变暗了，透出一丝神秘感...',
                    4: '画的颜色反转了！这是什么线索？'
                };

                this.showDialog(messages[this.paintingState]);

                // Puzzle clues at specific click counts
                if (this.paintingClicks === 3) {
                    this.showClueOverlay('线索出现！');
                    setTimeout(() => {
                        this.showDialog('画中似乎藏着秘密...');
                    }, 1500);
                }

                if (this.paintingClicks === 7) {
                    this.showClueOverlay('密码：2487');
                    setTimeout(() => {
                        this.showDialog('你发现了一串数字：2487');
                    }, 1500);
                }

                if (this.paintingClicks === 13) {
                    this.showClueOverlay('🗝️ 钥匙藏在柜子里');
                    setTimeout(() => {
                        this.showDialog('画中出现了神秘的提示！');
                    }, 1500);
                }

                // Easter egg: if clicked many times, show special message
                if (this.paintingClicks === 20) {
                    this.showClueOverlay('🎉 你真有耐心！');
                    setTimeout(() => {
                        this.showDialog('你对这幅画太执着了...');
                    }, 1500);
                }
            }

            showClueOverlay(text) {
                const painting = document.getElementById('painting');
                if (!painting) return;

                // Remove existing overlay if any
                const existingOverlay = painting.querySelector('.clue-overlay');
                if (existingOverlay) {
                    existingOverlay.remove();
                }

                // Create new overlay
                const overlay = document.createElement('div');
                overlay.className = 'clue-overlay';
                overlay.textContent = text;
                painting.appendChild(overlay);

                // Remove after animation
                setTimeout(() => {
                    overlay.remove();
                }, 3000);
            }
        }

        // Initialize game
        const game = new RustyLakeRoom();
    </script>
</body>
</html>
