<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Persona Mask Switcher</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 40px;
            background: linear-gradient(135deg, #ffa07a 0%, #ff6b6b 100%);
            transition: background 0.8s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
            position: relative;
        }

        /* 背景动画装饰 */
        body::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 1px, transparent 1px);
            background-size: 50px 50px;
            animation: backgroundMove 20s linear infinite;
            pointer-events: none;
        }

        @keyframes backgroundMove {
            0% {
                transform: translate(0, 0);
            }
            100% {
                transform: translate(50px, 50px);
            }
        }

        .container {
            position: relative;
            z-index: 1;
            text-align: center;
            max-width: 600px;
            width: 100%;
        }

        h1 {
            color: white;
            font-size: 2.5rem;
            margin-bottom: 60px;
            text-shadow: 2px 4px 8px rgba(0, 0, 0, 0.2);
            font-weight: 300;
            letter-spacing: 2px;
        }

        .avatar-container {
            margin: 0 auto 60px;
            width: 300px;
            height: 300px;
            position: relative;
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3),
                        0 0 0 10px rgba(255, 255, 255, 0.1),
                        0 0 0 20px rgba(255, 255, 255, 0.05);
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1),
                        box-shadow 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            background: white;
            animation: avatarPulse 3s ease-in-out infinite;
        }

        @keyframes avatarPulse {
            0%, 100% {
                transform: scale(1);
            }
            50% {
                transform: scale(1.02);
            }
        }

        .avatar:hover {
            transform: scale(1.05);
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.4),
                        0 0 0 10px rgba(255, 255, 255, 0.15),
                        0 0 0 20px rgba(255, 255, 255, 0.08);
        }

        /* 切换动画效果 */
        .avatar.switching {
            animation: switchAnimation 0.6s ease-in-out;
        }

        @keyframes switchAnimation {
            0% {
                transform: scale(1) rotateY(0deg);
                opacity: 1;
            }
            50% {
                transform: scale(0.8) rotateY(90deg);
                opacity: 0.3;
            }
            100% {
                transform: scale(1) rotateY(0deg);
                opacity: 1;
            }
        }

        .button-group {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 20px;
            max-width: 400px;
            margin: 0 auto;
        }

        .persona-button {
            padding: 20px 30px;
            font-size: 1.1rem;
            font-weight: 500;
            border: none;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            color: white;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            position: relative;
            overflow: hidden;
        }

        .persona-button::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            transform: translateX(-100%);
            transition: transform 0.6s;
        }

        .persona-button:hover::before {
            transform: translateX(100%);
        }

        .persona-button:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.15);
        }

        .persona-button:active {
            transform: translateY(0);
        }

        .persona-button.active {
            background: rgba(255, 255, 255, 0.4);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.2),
                        inset 0 2px 10px rgba(255, 255, 255, 0.2);
            transform: scale(0.98);
        }

        /* 状态指示器 */
        .status-indicator {
            margin-top: 40px;
            color: white;
            font-size: 1.2rem;
            opacity: 0.9;
            text-shadow: 1px 2px 4px rgba(0, 0, 0, 0.2);
        }

        /* 响应式设计 */
        @media (max-width: 600px) {
            h1 {
                font-size: 2rem;
                margin-bottom: 40px;
            }

            .avatar-container {
                width: 250px;
                height: 250px;
                margin-bottom: 40px;
            }

            .button-group {
                grid-template-columns: 1fr;
                max-width: 300px;
            }

            .persona-button {
                font-size: 1rem;
                padding: 18px 25px;
            }
        }

        /* 不同状态的背景色 */
        body.family {
            background: linear-gradient(135deg, #ffa07a 0%, #ff6b6b 100%);
        }

        body.friend {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
        }

        body.colleague {
            background: linear-gradient(135deg, #e0e0e0 0%, #b0b0b0 100%);
        }

        body.stranger {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
    </style>
</head>
<body class="family">
    <div class="container">
        <h1>Social Persona Mask Switcher</h1>

        <div class="avatar-container">
            <canvas id="avatar" class="avatar"></canvas>
        </div>

        <div class="button-group">
            <button class="persona-button active" data-persona="family">👨‍👩‍👧‍👦 Family</button>
            <button class="persona-button" data-persona="friend">🎉 Friends</button>
            <button class="persona-button" data-persona="colleague">💼 Colleagues</button>
            <button class="persona-button" data-persona="stranger">🎭 Strangers</button>
        </div>

        <div class="status-indicator">
            Current Mode: <span id="currentStatus">Family Mode</span>
        </div>
    </div>

    <script>
        // Drawing function for cute avatars with different expressions
        function drawAvatar(ctx, expression, bgColor) {
            const width = 300;
            const height = 300;

            // Clear canvas
            ctx.clearRect(0, 0, width, height);

            // Background with gradient
            const bgGradient = ctx.createRadialGradient(150, 150, 0, 150, 150, 150);
            bgGradient.addColorStop(0, bgColor);
            bgGradient.addColorStop(1, adjustBrightness(bgColor, -20));
            ctx.fillStyle = bgGradient;
            ctx.fillRect(0, 0, width, height);

            // Face shadow (for depth)
            ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
            ctx.beginPath();
            ctx.arc(150, 140, 78, 0, Math.PI * 2);
            ctx.fill();

            // Face
            const faceGradient = ctx.createRadialGradient(150, 130, 0, 150, 140, 75);
            faceGradient.addColorStop(0, '#ffd4b3');
            faceGradient.addColorStop(1, '#f4c7a5');
            ctx.fillStyle = faceGradient;
            ctx.beginPath();
            ctx.arc(150, 135, 75, 0, Math.PI * 2);
            ctx.fill();

            // Hair (long wavy hair)
            ctx.fillStyle = '#6b3410';
            ctx.beginPath();
            // Top bun/volume
            ctx.ellipse(150, 85, 80, 50, 0, 0, Math.PI * 2);
            ctx.fill();

            // Hair highlights
            ctx.fillStyle = '#8b4513';
            ctx.beginPath();
            ctx.ellipse(150, 85, 70, 43, 0, 0, Math.PI * 2);
            ctx.fill();

            // Left hair flow
            ctx.fillStyle = '#6b3410';
            ctx.beginPath();
            ctx.moveTo(70, 90);
            ctx.quadraticCurveTo(60, 120, 70, 180);
            ctx.quadraticCurveTo(75, 200, 85, 215);
            ctx.lineTo(95, 210);
            ctx.quadraticCurveTo(85, 190, 80, 160);
            ctx.quadraticCurveTo(75, 120, 85, 90);
            ctx.fill();

            // Right hair flow
            ctx.beginPath();
            ctx.moveTo(230, 90);
            ctx.quadraticCurveTo(240, 120, 230, 180);
            ctx.quadraticCurveTo(225, 200, 215, 215);
            ctx.lineTo(205, 210);
            ctx.quadraticCurveTo(215, 190, 220, 160);
            ctx.quadraticCurveTo(225, 120, 215, 90);
            ctx.fill();

            // Blush
            if (expression === 'family' || expression === 'friend') {
                ctx.fillStyle = 'rgba(255, 150, 150, 0.3)';
                ctx.beginPath();
                ctx.ellipse(110, 145, 15, 10, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.ellipse(190, 145, 15, 10, 0, 0, Math.PI * 2);
                ctx.fill();
            }

            // Eyes
            if (expression === 'stranger') {
                // Cold, looking away
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.ellipse(115, 125, 12, 15, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.ellipse(185, 125, 12, 15, 0, 0, Math.PI * 2);
                ctx.fill();

                ctx.fillStyle = '#4a3728';
                ctx.beginPath();
                ctx.arc(112, 125, 8, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(188, 125, 8, 0, Math.PI * 2);
                ctx.fill();

                // Flat eyebrows
                ctx.strokeStyle = '#4a3728';
                ctx.lineWidth = 2.5;
                ctx.beginPath();
                ctx.moveTo(100, 108);
                ctx.lineTo(130, 108);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(170, 108);
                ctx.lineTo(200, 108);
                ctx.stroke();
            } else if (expression === 'friend') {
                // Super happy squinted eyes
                ctx.fillStyle = '#4a3728';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(125, 122, 3, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(175, 122, 3, 0, Math.PI * 2);
                ctx.fill();

                // Happy curved eyebrows
                ctx.strokeStyle = '#4a3728';
                ctx.lineWidth = 2.5;
                ctx.beginPath();
                ctx.moveTo(105, 108);
                ctx.quadraticCurveTo(125, 102, 145, 108);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(155, 108);
                ctx.quadraticCurveTo(175, 102, 195, 108);
                ctx.stroke();
            } else {
                // Big cute eyes
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.ellipse(125, 125, 13, 16, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.ellipse(175, 125, 13, 16, 0, 0, Math.PI * 2);
                ctx.fill();

                // Iris
                ctx.fillStyle = '#4a3728';
                ctx.beginPath();
                ctx.arc(125, 128, 10, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(175, 128, 10, 0, Math.PI * 2);
                ctx.fill();

                // Pupils with sparkle
                ctx.fillStyle = '#000';
                ctx.beginPath();
                ctx.arc(125, 128, 6, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(175, 128, 6, 0, Math.PI * 2);
                ctx.fill();

                // Eye sparkles
                ctx.fillStyle = '#fff';
                ctx.beginPath();
                ctx.arc(122, 124, 2.5, 0, Math.PI * 2);
                ctx.fill();
                ctx.beginPath();
                ctx.arc(172, 124, 2.5, 0, Math.PI * 2);
                ctx.fill();

                // Eyebrows
                ctx.strokeStyle = '#4a3728';
                ctx.lineWidth = 2.5;
                if (expression === 'family') {
                    ctx.beginPath();
                    ctx.moveTo(105, 105);
                    ctx.quadraticCurveTo(125, 103, 145, 106);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(155, 106);
                    ctx.quadraticCurveTo(175, 103, 195, 105);
                    ctx.stroke();
                } else {
                    ctx.beginPath();
                    ctx.moveTo(105, 108);
                    ctx.lineTo(145, 108);
                    ctx.stroke();
                    ctx.beginPath();
                    ctx.moveTo(155, 108);
                    ctx.lineTo(195, 108);
                    ctx.stroke();
                }
            }

            // Mouth
            ctx.strokeStyle = '#4a3728';
            ctx.fillStyle = '#ff6b9d';
            ctx.lineWidth = 2.5;

            if (expression === 'family') {
                // Big happy smile
                ctx.beginPath();
                ctx.moveTo(115, 155);
                ctx.quadraticCurveTo(150, 180, 185, 155);
                ctx.stroke();

                // Open mouth smile
                ctx.fillStyle = 'rgba(255, 107, 157, 0.6)';
                ctx.beginPath();
                ctx.moveTo(115, 155);
                ctx.quadraticCurveTo(150, 175, 185, 155);
                ctx.quadraticCurveTo(150, 165, 115, 155);
                ctx.fill();
            } else if (expression === 'friend') {
                // Super wide laugh
                ctx.beginPath();
                ctx.arc(150, 145, 30, 0.2, Math.PI - 0.2);
                ctx.stroke();

                // Open laughing mouth
                ctx.fillStyle = 'rgba(255, 107, 157, 0.7)';
                ctx.beginPath();
                ctx.arc(150, 145, 28, 0.2, Math.PI - 0.2);
                ctx.lineTo(150, 160);
                ctx.fill();
            } else if (expression === 'colleague') {
                // Polite small smile
                ctx.beginPath();
                ctx.moveTo(130, 162);
                ctx.quadraticCurveTo(150, 168, 170, 162);
                ctx.stroke();
            } else if (expression === 'stranger') {
                // Flat line - indifferent
                ctx.beginPath();
                ctx.moveTo(130, 162);
                ctx.lineTo(170, 162);
                ctx.stroke();
            }

            // Cute nose
            ctx.fillStyle = 'rgba(0, 0, 0, 0.1)';
            ctx.beginPath();
            ctx.arc(150, 142, 2, 0, Math.PI * 2);
            ctx.fill();
        }

        // Helper function to adjust color brightness
        function adjustBrightness(color, amount) {
            const hex = color.replace('#', '');
            const r = Math.max(0, Math.min(255, parseInt(hex.substr(0, 2), 16) + amount));
            const g = Math.max(0, Math.min(255, parseInt(hex.substr(2, 2), 16) + amount));
            const b = Math.max(0, Math.min(255, parseInt(hex.substr(4, 2), 16) + amount));
            return '#' + ((r << 16) | (g << 8) | b).toString(16).padStart(6, '0');
        }

        // Persona configurations
        const personas = {
            family: {
                name: 'Family Mode',
                expression: 'family',
                bgColor: '#ffdfbf',
                emoji: '👨‍👩‍👧‍👦'
            },
            friend: {
                name: 'Friends Mode',
                expression: 'friend',
                bgColor: '#b6e3f4',
                emoji: '🎉'
            },
            colleague: {
                name: 'Colleagues Mode',
                expression: 'colleague',
                bgColor: '#d1d4f9',
                emoji: '💼'
            },
            stranger: {
                name: 'Strangers Mode',
                expression: 'stranger',
                bgColor: '#c0aede',
                emoji: '🎭'
            }
        };

        // Get DOM elements
        const canvas = document.getElementById('avatar');
        const ctx = canvas.getContext('2d');
        const statusElement = document.getElementById('currentStatus');
        const buttons = document.querySelectorAll('.persona-button');
        const body = document.body;

        // Set canvas size
        canvas.width = 300;
        canvas.height = 300;

        // Switch persona function
        function switchPersona(personaKey) {
            const persona = personas[personaKey];

            // Add switching animation
            canvas.classList.add('switching');

            // Draw new avatar after animation delay
            setTimeout(() => {
                drawAvatar(ctx, persona.expression, persona.bgColor);
            }, 300);

            // Remove animation class
            setTimeout(() => {
                canvas.classList.remove('switching');
            }, 600);

            // Update background color
            body.className = personaKey;

            // Update status text
            statusElement.textContent = persona.name;

            // Update button states
            buttons.forEach(btn => {
                if (btn.dataset.persona === personaKey) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
        }

        // Add click events to buttons
        buttons.forEach(button => {
            button.addEventListener('click', () => {
                const personaKey = button.dataset.persona;
                switchPersona(personaKey);
            });
        });

        // Keyboard shortcuts
        document.addEventListener('keydown', (e) => {
            const keyMap = {
                '1': 'family',
                '2': 'friend',
                '3': 'colleague',
                '4': 'stranger'
            };

            if (keyMap[e.key]) {
                switchPersona(keyMap[e.key]);
            }
        });

        // Draw initial avatar (family mode)
        drawAvatar(ctx, 'family', '#ffdfbf');
    </script>
</body>
</html>
