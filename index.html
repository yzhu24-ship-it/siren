<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rusty Lake Mystery Room</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', serif;
            background: #000;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        /* Main game container */
        .game-container {
            display: flex;
            height: 100vh;
            width: 100vw;
            position: relative;
        }

        /* Main scene area - with vignette effect */
        .scene-area {
            flex: 1;
            position: relative;
            background: #2a1f1a;
            overflow: hidden;
        }

        /* Vignette dark edges effect - DISABLED, images already have vignette */
        .scene-area::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            /* box-shadow: inset 0 0 200px 100px rgba(0,0,0,0.8); */
            pointer-events: none;
            z-index: 1000;
        }

        /* Room walls */
        .room-wall {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            display: none;
            background-size: cover;
            background-position: center;
        }

        .room-wall.active {
            display: block;
        }

        /* Wall 1 - Front wall (窗户墙) - Initial state: only window + painting */
        .wall-front {
            background:
                /* Wood texture */
                repeating-linear-gradient(0deg,
                    transparent 0px,
                    transparent 39px,
                    rgba(139, 115, 85, 0.3) 39px,
                    rgba(139, 115, 85, 0.3) 40px
                ),
                linear-gradient(180deg,
                    #c9a982 0%,
                    #b89872 30%,
                    #a68968 60%,
                    #8b7355 100%
                );
        }

        /* Window frame */
        .window {
            position: absolute;
            left: 50%;
            top: 25%;
            transform: translateX(-50%);
            width: 45%;
            height: 50%;
            background: linear-gradient(135deg, #d4a574 0%, #c9a982 100%);
            border: 8px solid #5a4a35;
            box-shadow:
                inset 0 0 20px rgba(0,0,0,0.3),
                0 10px 30px rgba(0,0,0,0.5);
        }

        /* Window inner frame */
        .window::before {
            content: '';
            position: absolute;
            top: 5%;
            left: 5%;
            right: 5%;
            bottom: 5%;
            border: 3px solid #8b7355;
            background: linear-gradient(180deg, #e8d4c0 0%, #d4c4a0 100%);
        }

        /* Lake painting inside window */
        .lake-painting {
            position: absolute;
            top: 8%;
            left: 8%;
            right: 8%;
            bottom: 8%;
            background:
                /* Mountain */
                linear-gradient(135deg,
                    transparent 0%,
                    transparent 30%,
                    #5a4a5a 30%,
                    #6a5a6a 35%,
                    #4a3a4a 40%,
                    transparent 40%
                ),
                /* Trees */
                radial-gradient(ellipse at 20% 55%, #2d4a3a 0%, transparent 15%),
                radial-gradient(ellipse at 35% 58%, #1d3a2a 0%, transparent 12%),
                radial-gradient(ellipse at 50% 60%, #2d4a3a 0%, transparent 10%),
                /* Lake reflection */
                radial-gradient(ellipse at 50% 75%, #e8d4a0 0%, transparent 15%),
                /* Water */
                linear-gradient(180deg,
                    transparent 0%,
                    transparent 50%,
                    #4a7a8a 50%,
                    #3a6a7a 60%,
                    #2a5a6a 80%,
                    #1a4a5a 100%
                ),
                /* Sky */
                linear-gradient(180deg,
                    #e8c4a0 0%,
                    #ffd4a0 20%,
                    #d4b490 40%,
                    #b4a480 50%
                );
        }

        /* Wall 2 - Right wall (桌子+柜子墙) */
        .wall-right {
            background:
                /* Wood texture */
                repeating-linear-gradient(0deg,
                    transparent 0px,
                    transparent 39px,
                    rgba(139, 115, 85, 0.3) 39px,
                    rgba(139, 115, 85, 0.3) 40px
                ),
                linear-gradient(180deg,
                    #c9a982 0%,
                    #b89872 30%,
                    #a68968 60%,
                    #8b7355 100%
                );
        }

        /* Desk on right wall */
        .desk {
            position: absolute;
            left: 20%;
            bottom: 22%;
            width: 30%;
            height: 32%;
            background: linear-gradient(180deg, #8b9a6a 0%, #7a8a5a 50%, #6a7a4a 100%);
            border: 3px solid #5a6a3a;
        }

        /* Desk drawer */
        .desk::before {
            content: '';
            position: absolute;
            top: 15%;
            left: 10%;
            right: 10%;
            height: 25%;
            background: linear-gradient(135deg, #6a7a4a 0%, #5a6a3a 100%);
            border: 2px solid #4a5a2a;
            border-radius: 3px;
        }

        /* Desk drawer handle */
        .desk::after {
            content: '';
            position: absolute;
            top: 27%;
            left: 50%;
            transform: translateX(-50%);
            width: 20%;
            height: 6%;
            background: linear-gradient(90deg, #d4a050 0%, #c49040 50%, #a47830 100%);
            border-radius: 8px;
        }

        /* Tall cabinet on right wall */
        .tall-cabinet {
            position: absolute;
            right: 22%;
            bottom: 22%;
            width: 22%;
            height: 45%;
            background: linear-gradient(180deg, #7a9a6a 0%, #6a8a5a 100%);
            border: 4px solid #5a7a4a;
        }

        /* Cabinet top door */
        .tall-cabinet::before {
            content: '';
            position: absolute;
            top: 5%;
            left: 10%;
            right: 10%;
            height: 42%;
            background: linear-gradient(135deg, #6a8a5a 0%, #5a7a4a 100%);
            border: 3px solid #4a6a3a;
            border-radius: 4px;
            box-shadow: inset 2px 2px 5px rgba(0,0,0,0.3);
        }

        /* Cabinet bottom door */
        .cabinet-bottom-door {
            position: absolute;
            top: 52%;
            left: 10%;
            right: 10%;
            height: 42%;
            background: linear-gradient(135deg, #6a8a5a 0%, #5a7a4a 100%);
            border: 3px solid #4a6a3a;
            border-radius: 4px;
            box-shadow: inset 2px 2px 5px rgba(0,0,0,0.3);
        }

        /* Cabinet door handles */
        .cabinet-handle {
            position: absolute;
            width: 8px;
            height: 8px;
            background: #2a2a2a;
            border-radius: 50%;
            right: 15%;
            top: 50%;
            transform: translateY(-50%);
        }

        /* Fishing rod leaning on wall */
        .fishing-rod-right {
            position: absolute;
            right: 17%;
            bottom: 22%;
            width: 3px;
            height: 40%;
            background: linear-gradient(180deg, #8b6535 0%, #6a4a25 100%);
            transform: rotate(-10deg);
            transform-origin: bottom right;
        }

        /* Wall 3 - Back wall (储物墙) */
        .wall-back {
            background:
                /* Wood texture */
                repeating-linear-gradient(0deg,
                    transparent 0px,
                    transparent 39px,
                    rgba(139, 115, 85, 0.3) 39px,
                    rgba(139, 115, 85, 0.3) 40px
                ),
                linear-gradient(180deg,
                    #c9a982 0%,
                    #b89872 30%,
                    #a68968 60%,
                    #8b7355 100%
                );
        }

        /* Wall cabinet on back wall */
        .wall-cabinet {
            position: absolute;
            right: 25%;
            top: 18%;
            width: 18%;
            height: 22%;
            background: linear-gradient(180deg, #8a9a7a 0%, #7a8a6a 100%);
            border: 3px solid #5a6a4a;
            box-shadow: 0 8px 16px rgba(0,0,0,0.4);
        }

        /* Wall cabinet shelves (3 layers) */
        .wall-cabinet::before {
            content: '';
            position: absolute;
            top: 33%;
            left: 8%;
            right: 8%;
            height: 2px;
            background: #4a5a3a;
            box-shadow: 0 34% 0 #4a5a3a;
        }

        /* Wall cabinet door handle */
        .wall-cabinet::after {
            content: '';
            position: absolute;
            left: 15%;
            top: 50%;
            transform: translateY(-50%);
            width: 6px;
            height: 6px;
            background: #2a2a2a;
            border-radius: 50%;
        }

        /* Floor cabinet on back wall */
        .floor-cabinet {
            position: absolute;
            left: 28%;
            bottom: 22%;
            width: 28%;
            height: 28%;
            background: linear-gradient(180deg, #7a9a6a 0%, #6a8a5a 100%);
            border: 4px solid #5a7a4a;
        }

        /* Floor cabinet left door */
        .floor-cabinet::before {
            content: '';
            position: absolute;
            top: 8%;
            left: 8%;
            width: 42%;
            height: 84%;
            background: linear-gradient(135deg, #6a8a5a 0%, #5a7a4a 100%);
            border: 3px solid #4a6a3a;
            border-radius: 4px;
            box-shadow: inset 2px 2px 5px rgba(0,0,0,0.3);
        }

        /* Floor cabinet right door */
        .floor-cabinet-right-door {
            position: absolute;
            top: 8%;
            right: 8%;
            width: 42%;
            height: 84%;
            background: linear-gradient(135deg, #6a8a5a 0%, #5a7a4a 100%);
            border: 3px solid #4a6a3a;
            border-radius: 4px;
            box-shadow: inset 2px 2px 5px rgba(0,0,0,0.3);
        }

        /* Floor cabinet handles */
        .floor-cabinet-handle {
            position: absolute;
            width: 8px;
            height: 8px;
            background: #2a2a2a;
            border-radius: 50%;
            top: 50%;
            transform: translateY(-50%);
        }

        /* Wall 4 - Left wall (窗户+凳子墙) */
        .wall-left {
            background:
                /* Wood texture */
                repeating-linear-gradient(0deg,
                    transparent 0px,
                    transparent 39px,
                    rgba(139, 115, 85, 0.3) 39px,
                    rgba(139, 115, 85, 0.3) 40px
                ),
                linear-gradient(180deg,
                    #c9a982 0%,
                    #b89872 30%,
                    #a68968 60%,
                    #8b7355 100%
                );
        }

        /* Window on left wall (same as front wall) */
        .window-left {
            position: absolute;
            left: 28%;
            top: 18%;
            width: 35%;
            height: 38%;
            background: linear-gradient(135deg, #d4a574 0%, #c9a982 100%);
            border: 8px solid #5a4a35;
            box-shadow:
                inset 0 0 20px rgba(0,0,0,0.3),
                0 10px 30px rgba(0,0,0,0.5);
        }

        /* Window left inner frame */
        .window-left::before {
            content: '';
            position: absolute;
            top: 5%;
            left: 5%;
            right: 5%;
            bottom: 5%;
            border: 3px solid #8b7355;
            background: linear-gradient(180deg, #e8d4c0 0%, #d4c4a0 100%);
        }

        /* Lake painting in left window */
        .lake-painting-left {
            position: absolute;
            top: 8%;
            left: 8%;
            right: 8%;
            bottom: 8%;
            background:
                /* Mountain */
                linear-gradient(135deg,
                    transparent 0%,
                    transparent 30%,
                    #5a4a5a 30%,
                    #6a5a6a 35%,
                    #4a3a4a 40%,
                    transparent 40%
                ),
                /* Trees */
                radial-gradient(ellipse at 20% 55%, #2d4a3a 0%, transparent 15%),
                radial-gradient(ellipse at 35% 58%, #1d3a2a 0%, transparent 12%),
                radial-gradient(ellipse at 50% 60%, #2d4a3a 0%, transparent 10%),
                /* Water */
                linear-gradient(180deg,
                    transparent 0%,
                    transparent 50%,
                    #4a7a8a 50%,
                    #3a6a7a 70%,
                    #2a5a6a 100%
                ),
                /* Sky */
                linear-gradient(180deg,
                    #e8c4a0 0%,
                    #ffd4a0 20%,
                    #d4b490 50%
                );
        }

        /* Blue stool on left wall */
        .stool {
            position: absolute;
            left: 50%;
            bottom: 24%;
            transform: translateX(-50%);
            width: 12%;
            height: 16%;
        }

        /* Stool seat */
        .stool::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 35%;
            background: linear-gradient(180deg, #6a8aaa 0%, #5a7a9a 100%);
            border: 3px solid #4a6a8a;
            border-radius: 50% 50% 45% 45%;
        }

        /* Stool legs */
        .stool::after {
            content: '';
            position: absolute;
            top: 35%;
            left: 15%;
            right: 15%;
            bottom: 0;
            background: linear-gradient(180deg, #3a4a5a 0%, #2a3a4a 100%);
            border-left: 3px solid #2a3a4a;
            border-right: 3px solid #2a3a4a;
        }

        /* Ceiling */
        .ceiling {
            background:
                /* Wood planks */
                repeating-linear-gradient(0deg,
                    transparent 0px,
                    transparent 39px,
                    rgba(139, 115, 85, 0.4) 39px,
                    rgba(139, 115, 85, 0.4) 41px
                ),
                linear-gradient(180deg,
                    #d4b89c 0%,
                    #c9a982 50%,
                    #b89872 100%
                );
        }

        /* Small object on ceiling */
        .ceiling-object {
            position: absolute;
            left: 50%;
            top: 35%;
            transform: translate(-50%, -50%);
            width: 40px;
            height: 25px;
            background: linear-gradient(135deg, #8a6a4a 0%, #6a4a3a 100%);
            border: 2px solid #4a3a2a;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.5);
        }

        /* Floor - HIDDEN, images already have floor */
        .floor {
            display: none;
        }

        /* Side walls - HIDDEN, images already have side edges */
        .wall-left-edge,
        .wall-right-edge {
            display: none;
        }

        /* Navigation arrows */
        .nav-container {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 200px;
            z-index: 1001;
        }

        .nav-arrow {
            width: 0;
            height: 0;
            cursor: pointer;
            transition: all 0.3s;
        }

        .nav-arrow.left {
            border-top: 20px solid transparent;
            border-bottom: 20px solid transparent;
            border-right: 30px solid rgba(255, 255, 255, 0.6);
        }

        .nav-arrow.right {
            border-top: 20px solid transparent;
            border-bottom: 20px solid transparent;
            border-left: 30px solid rgba(255, 255, 255, 0.6);
        }

        .nav-arrow:hover {
            transform: scale(1.2);
        }

        .nav-arrow.left:hover {
            border-right-color: rgba(255, 255, 255, 0.9);
        }

        .nav-arrow.right:hover {
            border-left-color: rgba(255, 255, 255, 0.9);
        }

        /* Up arrow for ceiling */
        .nav-up {
            position: absolute;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 20px solid transparent;
            border-right: 20px solid transparent;
            border-bottom: 30px solid rgba(255, 255, 255, 0.6);
            cursor: pointer;
            transition: all 0.3s;
            z-index: 1001;
        }

        .nav-up:hover {
            transform: translateX(-50%) scale(1.2);
            border-bottom-color: rgba(255, 255, 255, 0.9);
        }

        /* Right toolbar */
        .toolbar {
            width: 120px;
            background: linear-gradient(180deg, #2a2520 0%, #1a1510 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px 10px;
            gap: 15px;
            position: relative;
            z-index: 1002;
        }

        /* Toolbar icons (inventory slots) */
        .toolbar-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #e8d4a0 0%, #c9b888 100%);
            border: 3px solid #8b7355;
            border-radius: 8px;
            box-shadow:
                inset 0 2px 5px rgba(255,255,255,0.3),
                inset 0 -2px 5px rgba(0,0,0,0.3),
                0 4px 8px rgba(0,0,0,0.5);
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 32px;
        }

        .toolbar-icon:hover {
            transform: scale(1.05);
            box-shadow:
                inset 0 2px 5px rgba(255,255,255,0.3),
                inset 0 -2px 5px rgba(0,0,0,0.3),
                0 6px 12px rgba(0,0,0,0.7);
        }

        .toolbar-icon.active {
            background: linear-gradient(135deg, #ffd700 0%, #e8b800 100%);
            box-shadow:
                inset 0 2px 5px rgba(255,255,255,0.5),
                inset 0 -2px 5px rgba(0,0,0,0.2),
                0 0 20px rgba(255,215,0,0.6);
        }

        .toolbar-icon.empty {
            background: linear-gradient(135deg, #d4c4a0 0%, #b9a888 100%);
            cursor: default;
        }

        .toolbar-icon.empty:hover {
            transform: none;
        }

        /* Wall indicator */
        .wall-indicator {
            position: absolute;
            top: 20px;
            right: 140px;
            color: #fff;
            font-size: 18px;
            z-index: 1001;
            background: rgba(0,0,0,0.6);
            padding: 8px 16px;
            border-radius: 20px;
        }

        /* Dialog box */
        .dialog {
            position: absolute;
            bottom: 120px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.9);
            color: #fff;
            padding: 20px 30px;
            border-radius: 10px;
            border: 2px solid #8b7355;
            max-width: 500px;
            display: none;
            z-index: 1003;
            font-size: 16px;
            text-align: center;
            box-shadow: 0 8px 16px rgba(0,0,0,0.8);
        }

        .dialog.show {
            display: block;
        }

        .dialog::after {
            content: '▼';
            position: absolute;
            bottom: -15px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(0, 0, 0, 0.9);
            font-size: 20px;
        }
    </style>
</head>
<body>
    <div class="game-container">
        <!-- Main scene area -->
        <div class="scene-area">
            <!-- Wall indicator -->
            <div class="wall-indicator">
                <span id="wallName">前墙</span>
            </div>

            <!-- Up arrow for ceiling view -->
            <div class="nav-up" onclick="game.viewCeiling()"></div>

            <!-- Room walls -->
            <div class="room-wall wall-front active" id="wall-1">
                <!-- Initial state: only window + painting (no fishing rod, no shadow) -->
                <div class="window">
                    <div class="lake-painting"></div>
                </div>
            </div>
            <div class="room-wall wall-right" id="wall-2">
                <!-- Desk with drawer -->
                <div class="desk"></div>
                <!-- Tall cabinet with 2 doors -->
                <div class="tall-cabinet">
                    <div class="cabinet-bottom-door">
                        <div class="cabinet-handle"></div>
                    </div>
                    <div class="cabinet-handle" style="top: 25%;"></div>
                </div>
                <!-- Fishing rod leaning on wall -->
                <div class="fishing-rod-right"></div>
            </div>
            <div class="room-wall wall-back" id="wall-3">
                <!-- Wall cabinet (3 shelves) -->
                <div class="wall-cabinet"></div>
                <!-- Floor cabinet with 2 doors -->
                <div class="floor-cabinet">
                    <div class="floor-cabinet-right-door">
                        <div class="floor-cabinet-handle" style="left: 15%;"></div>
                    </div>
                    <div class="floor-cabinet-handle" style="left: 65%;"></div>
                </div>
            </div>
            <div class="room-wall wall-left" id="wall-4">
                <!-- Window with lake painting -->
                <div class="window-left">
                    <div class="lake-painting-left"></div>
                </div>
                <!-- Blue stool -->
                <div class="stool"></div>
            </div>
            <div class="room-wall ceiling" id="ceiling">
                <!-- Small object on ceiling -->
                <div class="ceiling-object"></div>
            </div>

            <!-- Side edges for perspective (not visible on ceiling view) -->
            <div class="wall-left-edge" id="left-edge"></div>
            <div class="wall-right-edge" id="right-edge"></div>

            <!-- Floor (always visible) -->
            <div class="floor"></div>

            <!-- Navigation arrows -->
            <div class="nav-container">
                <div class="nav-arrow left" onclick="game.previousWall()"></div>
                <div class="nav-arrow right" onclick="game.nextWall()"></div>
            </div>

            <!-- Dialog box -->
            <div class="dialog" id="dialog"></div>
        </div>

        <!-- Right toolbar (inventory) -->
        <div class="toolbar" id="toolbar">
            <!-- Inventory slots will be generated here -->
        </div>
    </div>

    <script>
        class RustyLakeRoom {
            constructor() {
                this.currentWall = 1;
                this.wallNames = ['前墙', '右墙', '后墙', '左墙', '天花板'];
                this.inventory = [];
                this.maxInventorySlots = 8;
                this.selectedItem = null;

                this.init();
            }

            init() {
                this.setupToolbar();
                this.updateWallIndicator();
                this.showDialog('欢迎来到神秘房间');
            }

            setupToolbar() {
                const toolbar = document.getElementById('toolbar');
                toolbar.innerHTML = '';

                // Create inventory slots
                for (let i = 0; i < this.maxInventorySlots; i++) {
                    const slot = document.createElement('div');
                    slot.className = 'toolbar-icon empty';
                    slot.id = `slot-${i}`;
                    toolbar.appendChild(slot);
                }
            }

            nextWall() {
                if (this.currentWall === 5) {
                    this.currentWall = 1;
                } else {
                    this.currentWall = this.currentWall === 4 ? 1 : this.currentWall + 1;
                }
                this.updateWall();
            }

            previousWall() {
                if (this.currentWall === 5) {
                    this.currentWall = 1;
                } else {
                    this.currentWall = this.currentWall === 1 ? 4 : this.currentWall - 1;
                }
                this.updateWall();
            }

            viewCeiling() {
                this.currentWall = 5;
                this.updateWall();
            }

            updateWall() {
                // Hide all walls
                document.querySelectorAll('.room-wall').forEach(wall => {
                    wall.classList.remove('active');
                });

                // Show current wall
                if (this.currentWall === 5) {
                    document.getElementById('ceiling').classList.add('active');
                } else {
                    document.getElementById(`wall-${this.currentWall}`).classList.add('active');
                }

                this.updateWallIndicator();
            }

            updateWallIndicator() {
                document.getElementById('wallName').textContent = this.wallNames[this.currentWall - 1];
            }

            showDialog(message) {
                const dialog = document.getElementById('dialog');
                dialog.innerHTML = message;
                dialog.classList.add('show');
                setTimeout(() => {
                    dialog.classList.remove('show');
                }, 3000);
            }
        }

        // Initialize game
        const game = new RustyLakeRoom();
    </script>
</body>
</html>
