<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR手势交互原型 - 入口</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            max-width: 600px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        h1 {
            font-size: 32px;
            color: #333;
            margin-bottom: 20px;
            text-align: center;
        }

        .description {
            color: #666;
            line-height: 1.8;
            margin-bottom: 30px;
            text-align: center;
        }

        .features {
            background: #f8f9fa;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 30px;
        }

        .feature-item {
            display: flex;
            align-items: center;
            margin: 12px 0;
            color: #444;
        }

        .feature-icon {
            font-size: 24px;
            margin-right: 12px;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            text-decoration: none;
            text-align: center;
            border-radius: 12px;
            font-size: 18px;
            font-weight: 600;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.6);
        }

        .btn:active {
            transform: translateY(0);
        }

        .requirements {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #e0e0e0;
            font-size: 14px;
            color: #888;
        }

        .requirements-title {
            font-weight: 600;
            color: #666;
            margin-bottom: 10px;
        }

        .requirements ul {
            list-style: none;
            padding-left: 0;
        }

        .requirements li {
            margin: 6px 0;
            padding-left: 20px;
            position: relative;
        }

        .requirements li:before {
            content: "✓";
            position: absolute;
            left: 0;
            color: #667eea;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎯 AR手势交互原型</h1>

        <p class="description">
            使用手机摄像头和手势识别技术，体验全新的AR交互方式。
            双手合十固定背景，用不同手势与场景互动。
        </p>

        <div class="features">
            <div class="feature-item">
                <span class="feature-icon">🙏</span>
                <span>双手合十 - 固定背景场景</span>
            </div>
            <div class="feature-item">
                <span class="feature-icon">✊</span>
                <span>握拳手势 - 轮廓区域变色</span>
            </div>
            <div class="feature-item">
                <span class="feature-icon">👌</span>
                <span>捏合手势 - AR元素虚拟化</span>
            </div>
            <div class="feature-item">
                <span class="feature-icon">🤟</span>
                <span>摇滚手势 - 元素消失效果</span>
            </div>
            <div class="feature-item">
                <span class="feature-icon">🖐️</span>
                <span>展开手掌 - 显示信息面板</span>
            </div>
            <div class="feature-item">
                <span class="feature-icon">👆</span>
                <span>指向手势 - 交换元素位置</span>
            </div>
        </div>

        <a href="ar-gesture.html" class="btn">🚀 开始体验</a>

        <div class="requirements">
            <div class="requirements-title">⚙️ 系统要求</div>
            <ul>
                <li>现代移动浏览器（Chrome/Safari）</li>
                <li>允许摄像头访问权限</li>
                <li>HTTPS安全连接（本地开发可使用HTTP）</li>
                <li>稳定的网络连接（首次加载MediaPipe模型）</li>
            </ul>
        </div>
    </div>
</body>
</html>
